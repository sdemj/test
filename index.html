이는 약 얼마가 적당한가?","c":["약 5cm","약 1cm","약 10cm","약 15cm"],"a":0,"e":"가슴압박은 가슴이 약 5cm 정도 눌릴 만큼 강하게 눌러야 심장에서 혈액이 충분히 순환될 수 있다."},{"q":"심폐소생술에서 가슴압박의 속도는 분당 몇 회가 적당한가?","c":["30~50회","100~120회","60~80회","150회 이상"],"a":1,"e":"가슴압박은 분당 100~120회의 속도로 빠르고 일정하게 눌러야 효과적으로 혈액을 순환시킬 수 있다."},{"q":"심폐소생술에서 가슴압박을 몇 회 실시한 뒤 인공호흡으로 넘어가는가?","c":["10회","20회","30회","50회"],"a":2,"e":"표준 심폐소생술은 가슴압박 30회, 인공호흡 2회를 한 세트로 반복하여 실시한다."},{"q":"기도를 개방할 때 환자의 머리는 어떻게 하고 턱을 들어올려야 하는가?","c":["앞으로 숙이고","옆으로 돌리고","고정한 채로","뒤로 기울이고"],"a":3,"e":"기도를 확보하려면 환자의 머리를 뒤로 젖히고 턱을 위로 들어올려 혀가 기도를 막지 않도록 해야 한다."},{"q":"피부가 벗겨지거나 진물이 흐르는 화상 부위에 무엇을 감싸면 오히려 염증이 생길 수 있는가?","c":["붕대나 약솜으로 직접 감싸기","깨끗한 거즈만 살짝 덮기","찬물로 식히기","병원에 가기"],"a":0,"e":"진물이 흐르는 상처에 붕대나 약솜을 직접 감으면 상처에 달라붙어 떼어낼 때 조직이 손상되고 염증이 생길 수 있다."},{"q":"옷을 입은 채로 화상을 입었을 때, 찬물로 식힌 후 옷은 어떻게 벗겨야 하는가?","c":["빠르게 잡아당겨서","천천히 조심스럽게","가위로 무조건 잘라서","벗기지 않고 그대로"],"a":1,"e":"화상 부위에 옷이 달라붙어 있을 수 있으므로 찬물로 충분히 식힌 뒤 천천히 조심스럽게 벗겨야 피부 손상을 줄일 수 있다."},{"q":"화상 부위에 생긴 물집을 어떻게 해야 하는가?","c":["바늘로 터트린다","손으로 눌러 터트린다","절대 터트리지 않는다","문질러서 없앤다"],"a":2,"e":"물집은 세균 감염을 막아주는 보호막 역할을 하므로 절대 터트리지 말고 그대로 두고 병원에서 치료받아야 한다."},{"q":"2도 화상이 회복되는 데 걸리는 기간은 대략 얼마인가?","c":["1~2일","6개월 이상","1년 이상","2주~1개월"],"a":3,"e":"2도 화상은 진피까지 손상되어 회복에 시간이 걸리며, 대체로 2주에서 1개월 정도 지나야 낫는다."},{"q":"압사 사고 위험 상황에서 갈비뼈를 보호하기 위해 두 손을 모아야 하는 위치는?","c":["가슴 앞","머리 위","등 뒤","허리 옆"],"a":0,"e":"인파에 눌리는 상황에서는 두 손을 가슴 앞에 모아 공간을 확보하면 갈비뼈와 폐가 눌리는 것을 막는 데 도움이 된다."},{"q":"인파 속에서 안전한 자세를 취할 때, 넘어지지 않도록 고정해야 하는 신체 부위는?","c":["팔","다리","목","손목"],"a":1,"e":"다리를 어깨너비 정도로 벌리고 힘을 주어 고정하면 인파에 밀려도 쉽게 넘어지지 않는다."},{"q":"압사 위험 상황에서 군중이 움직이는 힘과 방향에는 어떻게 대응해야 하는가?","c":["반대로 힘껏 밀어낸다","제자리에서 버틴다","저항하지 않고 흐름에 따른다","주저앉는다"],"a":2,"e":"군중의 흐름에 억지로 저항하면 넘어지기 쉬우므로, 무리하게 맞서지 말고 큰 힘의 흐름에 따라 움직이며 안전한 곳을 찾아야 한다."},{"q":"인파 속에서 넘어졌을 때, 몸을 웅크려 보호해야 하는 가장 중요한 신체 부위는?","c":["팔과 다리","손과 발","등과 허리","머리와 가슴"],"a":3,"e":"넘어졌을 때는 최대한 몸을 웅크려 머리와 가슴 등 치명적인 손상을 입기 쉬운 부위를 감싸 보호해야 한다."},{"q":"인공호흡을 할 때, 숨을 불어넣기 전에 막아야 하는 환자의 신체 부위는?","c":["코","입","귀","목"],"a":0,"e":"인공호흡을 할 때는 공기가 코로 새어 나가지 않도록 환자의 코를 막은 뒤 입으로 숨을 불어넣어야 한다."},{"q":"인공호흡을 할 때, 1초 동안 숨을 불어넣어 환자의 가슴이 어떻게 될 정도로 해야 하는가?","c":["가슴이 꺼질 정도로","가슴이 올라올 정도로","배가 부풀 정도로","변화가 없을 정도로"],"a":1,"e":"인공호흡은 환자의 가슴이 살짝 부풀어 오르는 것이 보일 정도로 1초에 걸쳐 숨을 불어넣어야 적절하다."},{"q":"심폐소생술에서 가슴압박 30회를 실시한 후, 인공호흡은 몇 회 실시하는가?","c":["1회","5회","2회","10회"],"a":2,"e":"표준 심폐소생술은 가슴압박 30회 후 인공호흡 2회를 한 세트로 반복하는 것이 기본이다."},{"q":"환자의 호흡이 돌아왔다면, 기도가 막히지 않도록 어떤 자세로 눕혀야 하는가?","c":["똑바로 눕힌다","엎드리게 한다","앉힌다","옆으로 눕힌다"],"a":3,"e":"호흡이 돌아온 환자는 구토물 등으로 기도가 막히지 않도록 옆으로 눕히는 회복자세를 취해주어야 한다."},{"q":"자동심장충격기 패드는 오른쪽 쇄골 아래와, 왼쪽 젖꼭지 아래의 어느 부위에 부착하는가?","c":["중간겨드랑이선","명치 정중앙","등 뒤 중앙","목 아래"],"a":0,"e":"자동심장충격기 패드는 오른쪽 빗장뼈(쇄골) 아래와 왼쪽 젖꼭지 아래 중간겨드랑이선 부위에 각각 부착해야 전류가 심장을 효과적으로 통과한다."},{"q":"자동심장충격기가 심장 리듬을 분석하는 동안, 주변 사람들은 어떻게 해야 하는가?","c":["환자를 계속 흔든다","환자에게서 떨어져 있는다","가슴압박을 계속한다","환자를 붙잡는다"],"a":1,"e":"자동심장충격기가 심장 리듬을 정확히 분석하려면, 그 순간에는 아무도 환자를 만지지 않고 떨어져 있어야 한다."},{"q":"자동심장충격기 분석 결과 심장충격이 필요하면 무엇이 깜빡이는가?","c":["전원 버튼","음량 조절 버튼","심장충격 버튼","패드 부착 표시"],"a":2,"e":"분석 결과 심장충격이 필요하다고 판단되면 심장충격(제세동) 버튼이 깜빡이며, 이때 버튼을 눌러 충격을 전달한다."},{"q":"진피 아래 피하지방까지 손상되는, 가장 심한 단계의 화상은?","c":["1도 화상","2도 화상","경미한 화상","3도 화상"],"a":3,"e":"3도 화상은 표피와 진피를 지나 피하지방까지 손상되는 가장 심각한 단계로, 즉시 전문 치료가 필요하다."},{"q":"3도 화상을 입으면 피부가 건조해지며 마른 가죽처럼 되고 어떤 색으로 변하는가?","c":["갈색이나 흰색","붉은색","파란색","초록색"],"a":0,"e":"3도 화상은 피부 조직이 심하게 손상되어 건조하고 가죽처럼 변하며, 갈색이나 흰색으로 색이 변한다."},{"q":"3도 화상을 치료한 후, 관절 부위에 남을 수 있는 문제는 무엇인가?","c":["색맹","움직이기 어려움(구축)","청력 손실","미각 상실"],"a":1,"e":"3도 화상은 흉터 조직이 딱딱하게 굳으면서 관절을 잡아당겨, 치료 후에도 관절을 움직이기 어려운 구축 문제가 남을 수 있다."},{"q":"화상 범위가 큰 경우, 옷을 억지로 벗기지 않고 환부를 보호하려면 어떻게 해야 하는가?","c":["옷을 잡아당겨 벗긴다","옷 위에 물을 붓지 않는다","가위로 옷을 잘라낸다","옷을 그대로 둔다"],"a":2,"e":"화상 범위가 넓을 때 옷을 억지로 벗기면 피부까지 함께 벗겨질 수 있으므로, 가위로 옷을 잘라 상처 자극을 줄여야 한다."},{"q":"인파 속에서 넘어져 도움을 요청할 때, 시끄러운 곳에서 소리치는 것보다 효과적인 도구는?","c":["손전등","거울","수건","호루라기"],"a":3,"e":"시끄러운 인파 속에서는 목소리보다 호루라기 소리가 더 멀리, 뚜렷하게 퍼져 도움을 요청하기에 효과적이다."},{"q":"인파가 몰린 곳에서 물건을 떨어뜨렸을 때 절대 하면 안 되는 행동은?","c":["물건을 주우러 다시 돌아간다","물건을 포기하고 이동한다","주변에 알린다","천천히 걷는다"],"a":0,"e":"떨어진 물건을 주우려고 사람들 속으로 다시 들어가면 넘어지거나 깔릴 위험이 크므로, 미련 없이 포기하고 안전한 곳으로 이동해야 한다."},{"q":"압사 사고 위험 상황에서 가방을 메고 있다면 어느 방향으로 매는 것이 안전한가?","c":["뒤로","앞으로","옆으로 늘어뜨려","머리 위로"],"a":1,"e":"가방을 앞으로 메면 가슴과 배 부위를 눌림으로부터 보호하는 완충재 역할을 해줄 수 있어 더 안전하다."}] },
  "5": { label: "5. 소방시설·소화기", data: [{"q":"불이 난 것을 알려주는 경보 설비와 불을 끄는 소화 설비를 통틀어 부르는 말은?","c":["소방시설","안전시설","경비시설","전기시설"],"a":0,"e":"소방시설은 화재를 감지하고 알리는 경보 설비와 불을 끄는 소화 설비 등을 모두 포함하는 말이다."},{"q":"비상벨처럼 불이 났다는 사실을 사람들에게 빠르게 알리는 설비를 무엇이라 하는가?","c":["소화 설비","경보 설비","피난 설비","제연 설비"],"a":1,"e":"경보 설비는 화재 발생 사실을 비상벨이나 사이렌 등으로 신속하게 알려 대피를 돕는 설비이다."},{"q":"스프링클러처럼 불을 직접 끄는 데 사용하는 설비를 무엇이라 하는가?","c":["경보 설비","피난 설비","소화 설비","조명 설비"],"a":2,"e":"소화 설비는 스프링클러, 소화기, 옥내소화전처럼 화재를 직접 진압하는 데 사용하는 설비를 말한다."},{"q":"열이나 연기의 변화를 자동으로 알아차려 화재를 감지하는 장치는?","c":["수신기","발신기","유도등","감지기"],"a":3,"e":"감지기는 천장 등에 설치되어 열이나 연기의 변화를 자동으로 감지해 화재 신호를 보내는 장치이다."},{"q":"사람이 버튼을 직접 눌러서 화재 발생 사실을 알리는 기구는?","c":["발신기","감지기","수신기","완강기"],"a":0,"e":"발신기는 화재를 목격한 사람이 직접 버튼을 눌러 수신기로 화재 신호를 보내는 기구이다."},{"q":"불이 막 시작되었거나 작은 불일 때, 사람이 직접 사용해 끄는 대표적인 기구는?","c":["스프링클러","소화기","유도등","완강기"],"a":1,"e":"소화기는 초기 화재 진압에 가장 흔히 쓰이는 도구로, 작은 불은 소화기만으로 충분히 끌 수 있다."},{"q":"소화기를 사용할 때 가장 먼저 힘껏 뽑아야 하는 부분은?","c":["호스","손잡이","안전핀","몸통"],"a":2,"e":"소화기 사용 순서의 첫 단계는 안전핀을 뽑는 것으로, 이 핀을 뽑아야 손잡이를 눌러 소화약제를 분사할 수 있다."},{"q":"소화기 사용법을 배우는 실습 교육이 흔히 이루어지는, 학생들이 모이는 넓은 장소는?","c":["도서관","교무실","강당 무대","운동장"],"a":3,"e":"소화기 실습 교육은 넓고 안전하게 활동할 수 있는 운동장 같은 야외 공간에서 자주 이루어진다."},{"q":"화재 감지기는 열을 감지하는 것과, 무엇을 감지하는 것 두 종류로 나뉘는가?","c":["연기","소리","진동","냄새"],"a":0,"e":"화재 감지기는 크게 열의 변화를 감지하는 열감지기와, 연기를 감지하는 연기감지기 두 종류로 나뉜다."},{"q":"별도의 소방시설이 없는 주택에 직접 설치해야 하는, 삐삐 소리로 화재를 알려주는 감지기는?","c":["연기감지기 수신기","단독경보형 감지기","열감지기 통합형","방화문 감지기"],"a":1,"e":"단독경보형 감지기는 수신기 없이 감지기 자체에서 삐삐 소리를 내어 화재를 알리는 장치로, 일반 주택에도 설치가 의무화되어 있다."},{"q":"감지기와 발신기의 신호를 받아 경보를 울리고 소화 설비를 작동시키는, 화재경보시스템의 두뇌 역할을 하는 기계는?","c":["발신기","유도등","수신기","완강기"],"a":2,"e":"수신기는 감지기와 발신기에서 보내온 신호를 받아 종합적으로 판단하고 경보와 소화 설비를 작동시키는 화재 시스템의 핵심 장치이다."},{"q":"큰 건물이나 아파트 복도 벽면에 설치되어 있으며, 문을 열면 호스가 나오는 소화 설비는?","c":["스프링클러","완강기","감지기함","옥내소화전"],"a":3,"e":"옥내소화전은 건물 벽면에 설치된 함 안에 호스와 밸브가 있어, 문을 열고 호스를 연결해 물을 뿌려 불을 끌 수 있는 소화 설비이다."},{"q":"불이 나면 열을 감지해 천장에서 자동으로 물이 쏟아지는 설비는?","c":["스프링클러","옥내소화전","제연설비","완강기"],"a":0,"e":"스프링클러는 천장에 설치되어 화재의 열을 감지하면 자동으로 물을 분사해 불을 초기에 진압하는 설비이다."},{"q":"소화기의 안전핀을 뽑은 다음, 호스는 어느 방향을 향하게 해야 하는가?","c":["하늘 쪽","불이 난 쪽","자신의 몸 쪽","반대 방향"],"a":1,"e":"안전핀을 뽑은 뒤에는 호스(노즐)를 불이 난 쪽으로 향하게 잡고, 바람을 등진 상태에서 분사해야 한다."},{"q":"소화기를 사용했는데도 불이 계속 커진다면 어떻게 해야 하는가?","c":["소화기를 하나 더 가져온다","물을 계속 붓는다","재빠르게 대피한다","불 앞에서 상황을 지켜본다"],"a":2,"e":"소화기로 진화가 되지 않고 불이 계속 커진다면 더 이상 지체하지 말고 즉시 안전한 곳으로 대피해야 한다."},{"q":"소화기를 보관할 때, 넘어지지 않도록 어떤 곳에 두어야 하는가?","c":["경사진 곳","높은 선반 위","좁은 틈","평평한 곳"],"a":3,"e":"소화기는 넘어지거나 굴러다니지 않도록 평평하고 안정된 곳에 세워서 보관해야 한다."},{"q":"책상, 옷, 나무처럼 일반 가연물이 타는 화재를 무엇이라 부르는가?","c":["A급 화재","B급 화재","C급 화재","K급 화재"],"a":0,"e":"A급 화재는 종이, 나무, 섬유 등 일반 가연물이 타는 화재로, 가장 흔하게 발생하는 화재 유형이다."},{"q":"가스나 기름 같은 유류에 의해 일어나는 화재를 무엇이라 부르는가?","c":["A급 화재","B급 화재","C급 화재","K급 화재"],"a":1,"e":"B급 화재는 휘발유, 등유 같은 유류나 가스가 타는 화재로, 물로 끄면 불이 번질 수 있어 주의해야 한다."},{"q":"텔레비전, 변압기 같은 전기 기기에서 일어나는 화재를 무엇이라 부르는가?","c":["A급 화재","B급 화재","C급 화재","K급 화재"],"a":2,"e":"C급 화재는 전기 기기에서 발생하는 화재로, 감전 위험이 있어 물을 사용하지 않고 전용 소화기로 꺼야 한다."},{"q":"식용유 등 동식물유를 다루는 조리기구에서 일어나는 화재를 무엇이라 부르는가?","c":["A급 화재","B급 화재","C급 화재","K급 화재"],"a":3,"e":"K급 화재는 식용유 같은 조리용 기름에서 발생하는 화재로, 일반 소화기보다 K급 전용 소화기를 사용해야 안전하다."},{"q":"A급, B급, C급 화재를 모두 끌 수 있도록 만들어진 소화기는?","c":["ABC 소화기","K급 소화기","이산화탄소 소화기","포말 소화기"],"a":0,"e":"ABC 소화기는 분말 소화약제를 사용해 일반 화재(A급), 유류 화재(B급), 전기 화재(C급)를 모두 진압할 수 있어 가정에서 널리 쓰인다."},{"q":"음식점, 호텔 등의 주방 시설에 설치가 의무화되어 있는 소화기 종류는?","c":["ABC 소화기","K급 소화기","이산화탄소 소화기","분말 소화기"],"a":1,"e":"K급 소화기는 식용유 화재에 특화된 소화기로, 화재 위험이 큰 음식점이나 호텔 주방에는 설치가 의무화되어 있다."},{"q":"소화기 손잡이 부근에 있으며, 내부 가스 압력을 점검할 수 있는 장치는?","c":["안전핀","호스 노즐","압력 게이지","받침대"],"a":2,"e":"압력 게이지는 소화기 내부 압력을 눈으로 확인할 수 있게 해주는 장치로, 정상 사용 가능 여부를 바로 점검할 수 있다."},{"q":"소화기 압력 게이지 바늘이 노란색을 가리킬 때는 어떤 상태인가?","c":["정상","압력 과다","고장으로 폐기","가스 부족(충전 필요)"],"a":3,"e":"압력 게이지가 노란색이면 소화기 내부 가스가 부족한 상태이므로 충전이 필요하다."},{"q":"소화기 압력 게이지 바늘이 빨간색을 가리킬 때는 어떻게 해야 하는가?","c":["폭발 위험이 있어 폐기한다","그대로 사용한다","충전소에 맡긴다","흔들어서 사용한다"],"a":0,"e":"압력 게이지가 빨간색이면 내부 압력이 너무 높아 폭발 위험이 있으므로 사용하지 말고 안전하게 폐기해야 한다."},{"q":"정상적으로 관리하더라도 몇 년이 지난 분말 소화기는 교체해야 하는가?","c":["3년","10년","5년","20년"],"a":1,"e":"분말 소화기는 정상적으로 관리해도 내구연한인 10년이 지나면 성능이 떨어지므로 교체해야 한다."},{"q":"내구연한이 지난 소화기가 성능확인검사를 통과하면, 1회에 한해 몇 년까지 연장 사용이 가능한가?","c":["1년","5년","3년","10년"],"a":2,"e":"내구연한이 지난 소화기라도 성능확인검사에 합격하면 1회에 한해 3년까지 연장하여 사용할 수 있다."},{"q":"소화기를 보관하기 좋은 장소의 온도 기준은 얼마 이하인가?","c":["10도 이하","50도 이하","70도 이하","30도 이하"],"a":3,"e":"소화기는 직사광선과 고온을 피해 30도 이하의 서늘한 곳에 보관해야 성능이 오래 유지된다."},{"q":"가정에서 소화기가 가장 많이 사용되는 대표적인 장소는?","c":["주방","거실","화장실","현관"],"a":0,"e":"주방은 가스레인지와 기름을 사용하는 조리 과정에서 화재가 자주 발생해 소화기가 가장 많이 사용되는 공간이다."},{"q":"소화기를 사용할 때, 손잡이를 움켜쥐고 불을 향해 어떻게 뿌려야 하는가?","c":["한 곳에 집중해서","빗자루로 쓸듯이 골고루","위에서 아래로 한 번에","최대한 멀리서 뿌리고 도망"],"a":1,"e":"소화기를 분사할 때는 손잡이를 움켜쥔 채 불의 아래쪽을 빗자루로 쓸듯이 좌우로 골고루 뿌려야 효과적으로 불을 끌 수 있다."},{"q":"소화기를 사용할 때 불에 너무 가까이 다가가면 안 되는 이유가 되는 위험은?","c":["소화기가 무거워짐","소화약제 낭비","불에 데일 위험","연기 냄새"],"a":2,"e":"불에 너무 가까이 다가가면 화상을 입을 위험이 크므로, 적당한 거리를 두고 소화기를 분사해야 한다."},{"q":"소화기를 보관할 때 절대 하면 안 되는 행동은?","c":["눈에 잘 띄는 곳에 두기","정기적으로 점검하기","평평한 곳에 세워두기","다른 물건을 위에 올려놓기"],"a":3,"e":"소화기 위에 다른 물건을 올려두면 위급 상황에서 바로 꺼내 사용하기 어려우므로 절대 그렇게 해서는 안 된다."}] },
  "6": { label: "6. 피난시설", data: [{"q":"불이 났을 때 밖으로 안전하게 탈출할 수 있도록 도와주는 시설과 기구를 통틀어 무엇이라고 하는가?","c":["피난시설","경보설비","소화설비","방재센터"],"a":0,"e":"피난시설은 화재나 재난이 발생했을 때 사람들이 안전하게 밖으로 대피할 수 있도록 돕는 계단, 유도등, 완강기 등의 시설과 기구를 모두 아우르는 말이다."},{"q":"건물 안에 있는 사람들이 화재 시 안전하게 밖으로 나갈 수 있도록 만든 계단은?","c":["엘리베이터","피난 계단","에스컬레이터","비상용 승강기"],"a":1,"e":"피난 계단은 화재 시 정전이나 연기로 사용할 수 없는 엘리베이터 대신, 사람들이 걸어서 안전하게 대피할 수 있도록 만든 계단이다."},{"q":"초고층 건물 옥상에 설치되어, 헬리콥터가 착륙해 사람들을 구조할 수 있도록 만든 시설은?","c":["옥상 정원","비상 발전실","헬리콥터 착륙장","저수조"],"a":2,"e":"초고층 건물에서는 지상으로 대피하기 어려운 경우를 대비해 옥상에 헬리콥터 착륙장을 설치하여 인명을 구조할 수 있도록 한다."},{"q":"화재나 비상 상황에서 대피할 방향을 불빛으로 알려주는 조명 장치는?","c":["발신기","감지기","스프링클러","유도등"],"a":3,"e":"유도등은 화재 등 비상시 사람들이 대피할 방향을 알려주는 조명 장치로, 정전이 되어도 자체 축전지 덕분에 계속 켜져 있다."},{"q":"화재가 다른 곳으로 번지는 것을 막고 대피 통로 역할을 하는, 항상 닫혀 있어야 하는 문은?","c":["방화문","셔터문","자동문","환기구"],"a":0,"e":"방화문은 불과 연기가 다른 구역으로 번지지 않도록 막아주는 문으로, 대피 통로를 확보하기 위해 평소에도 닫힌 상태를 유지해야 한다."},{"q":"아파트 베란다에 설치되어 있는, 밧줄을 이용해 몸을 천천히 내려가게 해주는 피난기구는?","c":["구조대","완강기","피난사다리","공기안전매트"],"a":1,"e":"완강기는 아파트 베란다 등에 설치되어 있는 대표적인 피난기구로, 지지대에 벨트를 걸고 몸에 착용한 뒤 천천히 내려가며 대피할 수 있다."},{"q":"피난 계단에 절대로 쌓아두면 안 되는 것은?","c":["소화기","비상 조명등","물건","유도등"],"a":2,"e":"피난 계단에 물건을 쌓아두면 화재 시 대피로가 막혀 큰 인명 피해로 이어질 수 있으므로 항상 비워두어야 한다."},{"q":"건물의 가장 위쪽에 있는 넓은 공간으로, 대피 장소로 활용할 수 있는 곳은?","c":["지하 주차장","기계실","엘리베이터 홀","옥상 광장"],"a":3,"e":"고층 건물에서 아래로 대피하기 어려운 경우, 넓게 트인 옥상 광장으로 이동해 구조를 기다릴 수 있다."},{"q":"유도등과 함께 대피 방향을 그림으로 알려주는 안내판은?","c":["유도표지","경고표지","금지표지","안전보건표지"],"a":0,"e":"유도표지는 유도등처럼 전기로 켜지지는 않지만, 화살표와 사람 그림 등으로 대피 방향을 알려주는 안내판이다."},{"q":"유도등이 정전 상황에서도 최소 20분 이상 꺼지지 않고 켜져 있을 수 있는 이유는?","c":["건전지를 매일 갈아서","자체 축전지가 있어서","태양광으로 충전해서","별도의 발전기와 연결되어서"],"a":1,"e":"유도등 안에는 자체 축전지(배터리)가 내장되어 있어, 건물의 전기가 끊겨도 스스로 전기를 공급하며 최소 20분 이상 켜져 있을 수 있다."},{"q":"방화문은 평소에 어떤 상태를 유지해야 하는가?","c":["열린 상태","반쯤 열린 상태","닫힌 상태","계절에 따라 다르게"],"a":2,"e":"방화문은 화재 시 불과 연기의 확산을 막는 역할을 하기 때문에, 사용하지 않을 때는 항상 닫힌 상태를 유지해야 제 기능을 할 수 있다."},{"q":"통로가 막히거나 불길 때문에 나갈 수 없을 때, 창문을 통해 걸어서 안전하게 내려갈 수 있도록 설치하는 피난기구는?","c":["완강기","구조대","공기안전매트","피난 사다리"],"a":3,"e":"피난 사다리는 창문 등에 걸쳐 설치해 계단처럼 딛고 내려갈 수 있는 피난기구로, 통로를 이용할 수 없을 때 유용하다."},{"q":"출입문 위쪽에 설치되어 비상구 위치를 알려주는 유도등의 이름은?","c":["피난구 유도등","통로 유도등","객석 유도등","복도 유도등"],"a":0,"e":"피난구 유도등은 비상구나 출입문 위쪽에 설치되어, 그곳이 대피할 수 있는 출입구임을 알려주는 역할을 한다."},{"q":"낮게 엎드려 이동할 때도 잘 보이도록, 바닥에서 1m 이하 높이에 설치하는 유도등은?","c":["피난구 유도등","통로 유도등","객석 유도등","비상 조명등"],"a":1,"e":"통로 유도등은 복도나 계단 등에서 바닥 가까이 설치되어, 연기 때문에 낮게 엎드려 이동할 때도 대피 방향을 확인할 수 있게 해준다."},{"q":"극장이나 공연장의 객석 통로 바닥이나 벽에 설치된 유도등은?","c":["통로 유도등","피난구 유도등","객석 유도등","비상벨"],"a":2,"e":"객석 유도등은 어두운 극장이나 공연장에서 관객이 통로를 안전하게 찾아 이동할 수 있도록 객석 통로의 바닥이나 벽에 설치한다."},{"q":"복도나 계단 등에 설치되어 대피 방향을 그림으로 안내하는 유도표지는?","c":["피난구 유도표지","객석 유도표지","비상 안내표지","통로 유도표지"],"a":3,"e":"통로 유도표지는 복도나 계단 벽면 등에 부착되어, 화살표 등으로 대피 방향을 안내하는 표지이다."},{"q":"어린이집이나 유치원에서 많이 사용하는, 미끄럼틀처럼 생긴 피난기구는?","c":["미끄럼대","피난사다리","구조대","완강기"],"a":0,"e":"미끄럼대는 어린 아이들이 쉽고 빠르게 대피할 수 있도록 미끄럼틀 형태로 만든 피난기구로, 어린이집이나 유치원 등에서 주로 사용한다."},{"q":"창문에서 땅까지 설치하여, 자루 모양의 통로를 타고 미끄러져 내려오는 피난기구는?","c":["완강기","구조대","피난사다리","공기안전매트"],"a":1,"e":"구조대는 헝겊 등으로 만든 자루 모양의 통로를 창문에서 지상까지 설치해, 그 안으로 미끄러져 내려오며 대피하는 피난기구이다."},{"q":"출입구나 피난 경로 위에 설치되어 비상구 방향을 그림으로 알려주는 유도표지는?","c":["통로 유도표지","객석 유도표지","피난구 유도표지","안전 수칙 표지"],"a":2,"e":"피난구 유도표지는 출입구나 비상구 위쪽에 붙어 있는 그림 표지로, 정전 시에도 위치를 알아볼 수 있도록 되어 있다."},{"q":"완강기를 사용할 때, 벨트를 착용해야 하는 신체 부위는?","c":["허리","다리","팔","가슴"],"a":3,"e":"완강기를 사용할 때는 벨트를 겨드랑이 아래 가슴 부분에 단단히 매어 몸을 지지한 뒤 천천히 내려가야 안전하다."},{"q":"3층 이상 건물에서 밖으로 긴급히 뛰어내려야 할 때 사용하는, 공기를 넣어 부풀리는 피난기구는?","c":["공기 안전매트","구조대","완강기","미끄럼대"],"a":0,"e":"공기 안전매트는 공기를 채워 부풀린 뒤 그 위로 뛰어내려 충격을 흡수하도록 만든 피난기구로, 다른 대피 방법이 없을 때 최후의 수단으로 사용한다."},{"q":"방화문 근처에 절대로 두면 안 되는 것은?","c":["소화기","통로를 막는 물건","유도등","비상 조명등"],"a":1,"e":"방화문 주변에 물건을 쌓아두면 문이 제대로 닫히지 않거나 대피로가 막혀 화재 확산을 막지 못하게 되므로 절대 두어서는 안 된다."},{"q":"피난 계단이나 승강기 같은 시설을 이용할 수 없을 때 대신 사용하는, 사다리·완강기·구조대 등을 통틀어 부르는 말은?","c":["소화설비","경보설비","피난기구","안전시설"],"a":2,"e":"피난기구는 정상적인 피난 시설을 이용할 수 없는 상황에서 대신 사용하는 사다리, 완강기, 구조대, 공기안전매트 등을 통틀어 이르는 말이다."}] },
  "7": { label: "7. 화재는 언제 많이 일어날까요", data: [{"q":"우리나라에서 하루에 약 몇 건의 화재가 발생하는가?","c":["약 100건","약 10건","약 500건","약 1000건"],"a":0,"e":"소방청 통계에 따르면 우리나라에서는 하루 평균 약 100건 정도의 화재가 발생하고 있다."},{"q":"우리나라에서 1년에 약 몇 건의 화재가 발생하는가?","c":["약 4천 건","약 4만 건","약 40만 건","약 400건"],"a":1,"e":"하루 평균 약 100건씩 화재가 발생하면, 1년으로 따졌을 때 약 4만 건에 이르는 화재가 발생하는 셈이다."},{"q":"화재 사고 중 가장 많이 발생하는 장소는 어디인가?","c":["공장","학교","집(주택)","산"],"a":2,"e":"화재는 주방이나 전기기구 사용이 잦은 주택에서 부주의로 인해 가장 많이 발생한다."},{"q":"소방의 날로 지정된 날짜는 언제인가?","c":["11월 19일","1월 19일","9월 11일","11월 9일"],"a":3,"e":"소방의 날은 화재 신고 전화번호인 119를 기념하여 11월 9일로 정해졌다."},{"q":"화재가 특히 많이 발생하는 계절 중, 꽃이 피는 계절은 언제인가?","c":["봄","여름","가을","겨울"],"a":0,"e":"봄에는 건조한 날씨와 강한 바람으로 산불과 들불이 자주 발생하며, 화재 위험이 크게 높아진다."},{"q":"화재가 특히 많이 발생하는 계절 중, 눈이 오는 계절은 언제인가?","c":["여름","겨울","가을","장마철"],"a":1,"e":"겨울에는 난로, 전기장판 등 난방기구 사용이 늘어나면서 화재가 자주 발생한다."},{"q":"겨울이 오기 전, 화재 예방을 강조하기 위해 정한 달은 언제인가?","c":["9월","10월","11월","12월"],"a":2,"e":"11월은 본격적인 겨울철 난방을 앞두고 화재 예방을 미리 강조하기 위해 '불조심 강조의 달'로 정해져 있다."},{"q":"집에서 나는 화재의 가장 큰 원인은 무엇인가?","c":["방화","낙뢰","기계적 요인","부주의"],"a":3,"e":"조리 중 자리를 비우거나 전기기구를 켜둔 채 방치하는 등 사람의 부주의가 가정 화재의 가장 큰 원인이다."},{"q":"화재 사고가 많이 발생하는 장소로, 집 이외에 도로를 다니는 이것에서도 화재가 난다. 무엇일까?","c":["차량","다리","신호등","인도"],"a":0,"e":"자동차는 엔진 과열이나 전기 배선 문제 등으로 주행 중이나 정차 중에도 화재가 발생할 수 있다."},{"q":"화재 사고가 많이 발생하는 장소로, 물건을 만드는 이곳에서도 화재가 난다. 무엇일까?","c":["도서관","공장","미술관","놀이터"],"a":1,"e":"공장은 기계 설비와 화학물질을 많이 다루기 때문에 작은 부주의나 기계 결함으로도 큰 화재가 일어날 수 있다."},{"q":"11월을 이렇게 부르며 화재 예방을 미리 강조하는 표현은 무엇인가?","c":["소방 안전의 날","소방의 주간","불조심 강조의 달","화재 예방 주간"],"a":2,"e":"11월은 겨울철 화재를 예방하기 위해 '불조심 강조의 달'로 지정되어 다양한 캠페인과 교육이 진행된다."},{"q":"소방의 날(11월 9일)에 화재 예방을 위해 여는 여러 행사를 무엇이라 부르는가?","c":["박람회","축제","세미나","캠페인"],"a":3,"e":"소방의 날에는 소방서와 지자체가 화재 예방 캠페인을 열어 시민들에게 안전 수칙을 알린다."},{"q":"11월 9일이 소방의 날로 정해진 것과 관련 있는, 화재 신고 전화번호는 무엇인가?","c":["119","112","122","114"],"a":0,"e":"11월 9일(11.9)의 숫자가 화재·구조 신고 전화번호인 119와 같아서 이 날이 소방의 날로 지정되었다."}] },
  "8-1": { label: "8-1. 공공장소 화재 안전수칙", data: [{"q":"사람이 많이 모이는 공공장소에서 불이 나면 피해가 어떻게 될 수 있는가?","c":["크게 발생할 수 있다","매우 작게 끝난다","전혀 없다","자동으로 진압된다"],"a":0,"e":"공공장소는 많은 사람이 밀집해 있어 화재가 나면 대피가 어려워지고 피해가 크게 발생할 수 있다."},{"q":"건물이나 극장에 갈 때 미리 확인해야 하는, 비상구 위치가 표시된 안내도는?","c":["관람 안내도","피난 안내도","좌석 배치도","시설 이용 안내판"],"a":1,"e":"피난 안내도는 건물 내 비상구와 대피 경로를 그림으로 표시한 것으로, 화재 시 신속한 대피를 위해 미리 확인해두어야 한다."},{"q":"지하철에서 화재가 발생했을 때 신고해야 하는 전화번호는?","c":["112","110","119","114"],"a":2,"e":"화재 신고는 소방서로 연결되는 119번으로 해야 하며, 지하철 화재도 마찬가지로 119에 신고해야 한다."},{"q":"지하상가에서 불을 발견했을 때 가장 먼저 눌러야 하는 것은?","c":["엘리베이터 버튼","자동문 버튼","조명 스위치","화재 경보기"],"a":3,"e":"불을 발견하면 가장 먼저 화재 경보기(발신기)를 눌러 주변 사람들에게 화재 사실을 빠르게 알려야 한다."},{"q":"지하철 좌석 양옆 아래쪽에 있으며, 비상시 출입문을 수동으로 열 수 있게 해주는 장치는?","c":["비상콕(비상 코크)","비상벨","소화기","안전 손잡이"],"a":0,"e":"비상콕(비상 코크)은 지하철 좌석 아래에 설치되어 있으며, 이를 당기면 출입문의 자동 잠금이 풀려 수동으로 열 수 있다."},{"q":"지하철에서 대피할 때, 비상콕과 함께 미리 위치를 확인해두어야 하는 소화 도구는?","c":["비상벨","소화기","손전등","구명조끼"],"a":1,"e":"지하철 객실에는 소화기가 비치되어 있으므로, 평소 비상콕과 함께 위치를 확인해두면 유사시 빠르게 대응할 수 있다."},{"q":"지하철에서 화재가 발생했을 때, 승무원의 지시에 따라 어떻게 대피해야 하는가?","c":["최대한 천천히","각자 알아서","차분하고 신속하게","자리에 계속 앉아서"],"a":2,"e":"지하철 화재 시에는 당황하지 말고 승무원의 안내 방송과 지시에 따라 차분하면서도 신속하게 대피해야 한다."},{"q":"지하철 선로에 내려서 이동해야 할 때, 반드시 주의해야 하는 것은?","c":["바닥의 물기","조명 밝기","선로 온도","다른 열차"],"a":3,"e":"선로로 대피할 때는 반대편에서 다른 열차가 올 수 있으므로 열차 진입 여부를 반드시 확인하며 이동해야 한다."},{"q":"지하철 출입문을 수동으로 열 때, 비상콕과 함께 사용할 수 있는 장치는?","c":["비상 개폐 핸들","화재 경보기","압력 게이지","송풍 장치"],"a":0,"e":"비상콕으로 잠금을 해제한 뒤에는 문 옆의 비상 개폐 핸들을 이용해 출입문을 양옆으로 밀어 열 수 있다."},{"q":"지하상가처럼 구조가 복잡한 곳에서 화재가 나면 잃어버리기 쉬운 감각은?","c":["청각","방향 감각","미각","촉각"],"a":1,"e":"지하상가는 통로가 복잡하고 연기로 시야가 가려지기 쉬워, 화재 시 방향 감각을 잃고 헤매기 쉽다."},{"q":"지하상가에서 대피할 때, 비상구는 보통 어느 방향에 위치해 있는가?","c":["천장 중앙","바닥 아래","양방향(측면)","출입구 정면만"],"a":2,"e":"지하상가는 화재 시 어느 한쪽이 막혀도 대피할 수 있도록 통로 양쪽 측면에 비상구가 분산 설치되어 있다."},{"q":"지하상가에서 화재가 발생했을 때, 어느 방향으로 대피해야 하는가?","c":["연기가 짙은 방향","화재가 발생한 방향","가장 가까운 계단 반대 방향","공기가 유입되는 방향"],"a":3,"e":"연기와 열기는 화재 발생 지점에서 퍼져 나가므로, 신선한 공기가 들어오는 방향을 확인해 그쪽으로 대피해야 안전하다."},{"q":"밀폐된 지하상가에서 화재가 나면 무엇이 급속도로 확산될 수 있는가?","c":["연기와 열기","소음","진동","냄새만"],"a":0,"e":"지하상가는 환기가 잘 되지 않는 밀폐된 구조라서 화재가 나면 연기와 열기가 매우 빠르게 퍼져 위험하다."},{"q":"지하상가에서 화재가 발생해 여러 비상구가 보일 때, 어떻게 대피해야 하는가?","c":["가장 가까운 사람을 따라간다","침착하게 한 방향을 정해서 대피한다","여러 방향을 번갈아 시도한다","제자리에서 기다린다"],"a":1,"e":"여러 비상구가 있을 때 우왕좌왕하지 않고 침착하게 안전한 한 방향을 정해 신속히 대피하는 것이 중요하다."},{"q":"지하철·지하상가에서 화재가 발생했을 때 가장 중요하게 강조되는 마음가짐은?","c":["빠른 판단력만","완력","침착함","경쟁심"],"a":2,"e":"밀폐되고 복잡한 공간일수록 당황하면 오히려 위험이 커지므로, 침착함을 유지하는 것이 화재 대처의 가장 중요한 기본이다."}] },
  "8-2": { label: "8-2. 학교·가정 화재 안전수칙", data: [{"q":"급식 시간에 뜨거운 국이나 반찬을 옮길 때, 화상을 입지 않으려면 어떻게 움직여야 하는가?","c":["천천히 조심해서","최대한 빠르게","눈을 감고","한 손으로만"],"a":0,"e":"뜨거운 음식을 옮길 때 서두르면 엎지르기 쉬워 화상 위험이 커지므로, 두 손으로 천천히 조심해서 옮겨야 한다."},{"q":"과학 실습 시간에 염산처럼 피부에 닿으면 화상을 입힐 수 있는 물질을 무엇이라고 하는가?","c":["소화 약제","화학 약품","세정제","방부제"],"a":1,"e":"염산, 황산 등 화학 약품은 피부에 닿으면 화학 화상을 입힐 수 있어 과학 실습 시간에 특히 조심해서 다루어야 한다."},{"q":"화재 대피 훈련을 할 때, 교실 문 앞에서 어떻게 서서 이동해야 하는가?","c":["자유롭게 흩어져서","가장 빠른 친구부터 뛰어서","한 줄로 서서 질서 있게","선생님을 앞질러서"],"a":2,"e":"여러 명이 한꺼번에 문으로 몰리면 넘어지거나 다칠 수 있으므로, 한 줄로 서서 질서 있게 이동해야 안전하게 대피할 수 있다."},{"q":"화재 대피 훈련이나 실제 화재 시, 대피한 뒤 절대로 다시 들어가면 안 되는 곳은?","c":["운동장","강당 앞","놀이터","교실(건물 안)"],"a":3,"e":"물건을 두고 왔거나 친구가 걱정되어도, 이미 대피한 건물이나 교실 안으로 다시 들어가면 매우 위험하므로 절대 돌아가서는 안 된다."},{"q":"음식을 조리하다가 자리를 비우면 어떤 사고가 많이 발생하는가?","c":["화재","감전","붕괴","익사"],"a":0,"e":"가스불이나 인덕션을 켜 둔 채 자리를 비우면 음식이 타면서 불이 옮겨붙어 화재로 이어지는 경우가 매우 많다."},{"q":"화학 약품이 몸에 튀어 화상을 입었을 때, 가장 먼저 해야 할 일은?","c":["혼자 약을 발라보기","큰 소리로 어른에게 도움 요청하기","가만히 참고 기다리기","약품을 만져서 확인하기"],"a":1,"e":"화학 약품 화상은 스스로 처치하기 위험하므로, 가장 먼저 큰 소리로 주변 어른에게 알려 빠르게 도움을 받아야 한다."},{"q":"화학 약품에 오염된 환자의 옷을 벗길 때 올바른 방법은?","c":["힘껏 잡아당겨 벗긴다","물에 적신 뒤 벗긴다","가위로 잘라서 제거한다","그대로 둔다"],"a":2,"e":"옷을 억지로 벗기면 약품이 다른 피부에 닿거나 상처를 자극할 수 있으므로, 가위로 잘라서 조심스럽게 제거해야 한다."},{"q":"화학 약품이 묻은 피부는 어떻게 처치해야 하는가?","c":["마른 수건으로 닦아낸다","연고를 먼저 바른다","뜨거운 물로 씻어낸다","흐르는 차가운 물로 충분히 씻어낸다"],"a":3,"e":"화학 약품은 흐르는 차가운 물로 충분히 씻어내야 약품이 피부에 더 이상 손상을 주지 않고 씻겨 나간다."},{"q":"난로나 가스레인지 주변에 탈 수 있는 물건을 둘 때, 최소 얼마나 거리를 두어야 하는가?","c":["1.2m 이상","10cm 이상","30cm 이상","50cm 이상"],"a":0,"e":"커튼, 이불, 종이 등 탈 수 있는 물건은 난로나 가스레인지에서 최소 1.2m 이상 떨어뜨려 놓아야 화재를 예방할 수 있다."},{"q":"전기기구를 사용하던 중 타는 냄새나 연기가 난다면 가장 먼저 무엇을 해야 하는가?","c":["물을 뿌린다","전원 플러그를 재빨리 뽑는다","그대로 계속 사용한다","냄새의 원인을 확인하러 기구를 만진다"],"a":1,"e":"타는 냄새나 연기는 화재의 전조 증상일 수 있으므로, 즉시 전원 플러그를 뽑아 전기 공급을 차단해야 한다."},{"q":"화상 환자를 처치하는 사람이 손을 보호하기 위해 착용해야 하는 것은?","c":["목장갑","비닐봉지","고무장갑","수건"],"a":2,"e":"고무장갑을 착용하면 처치자의 손을 화학 약품이나 오염물로부터 보호하면서 환자를 안전하게 도울 수 있다."},{"q":"화학 약품을 충분히 씻어낸 상처는 어떻게 응급처치해야 하는가?","c":["연고를 두껍게 바른다","반창고로 꽉 감는다","그냥 놔둔다","깨끗하고 마른 천으로 덮고 병원에 간다"],"a":3,"e":"씻어낸 상처는 깨끗하고 마른 천으로 가볍게 덮어 감염을 막고, 반드시 병원으로 가서 전문적인 치료를 받아야 한다."},{"q":"화상을 입은 상처에 절대로 하면 안 되는 행동은?","c":["된장이나 연고 등을 함부로 바르는 것","찬물로 식히는 것","깨끗한 천으로 덮는 것","병원에 가는 것"],"a":0,"e":"된장이나 치약, 연고 등을 함부로 바르면 세균 감염 위험이 커지고 상태를 정확히 확인하기도 어려워지므로 절대 발라서는 안 된다."},{"q":"가정에서 담배를 피운 후 남은 불씨가 이불 위에 떨어지면 어떤 위험이 생기는가?","c":["냄새가 사라진다","불이 날 수 있다","아무 문제 없다","이불이 더 따뜻해진다"],"a":1,"e":"담배의 불티는 매우 작아 보이지만 이불이나 옷 같은 섬유에 떨어지면 서서히 타들어가다 큰 화재로 이어질 수 있다."},{"q":"화재 대피 훈련을 마친 뒤, 선생님의 지시가 있기 전까지 절대 하면 안 되는 행동은?","c":["줄을 서서 기다리는 것","인원을 점검받는 것","제멋대로 흩어지는 것","조용히 대기하는 것"],"a":2,"e":"대피 후에도 선생님의 지시 없이 흩어지면 인원 점검이 어려워지고 다시 위험한 곳으로 갈 수도 있으므로 안내가 있을 때까지 자리를 지켜야 한다."},{"q":"난로 같은 열기구를 켜 둔 채로 절대 하면 안 되는 행동은?","c":["창문을 여는 것","온도를 낮추는 것","가까이에서 숙제하는 것","집을 비우고 외출하는 것"],"a":3,"e":"난로를 켜 둔 채 집을 비우면 주변 물건에 불이 옮겨붙어도 초기에 대처할 수 없어 큰불로 번질 위험이 크다."},{"q":"화학 약품을 씻어낸 물을 바로 버려야 하는 이유는?","c":["다른 사람이 만져 2차 화상을 입을 수 있어서","물이 아까워서","냄새가 나서","색깔이 변해서"],"a":0,"e":"약품이 섞인 물이 남아 있으면 다른 사람의 피부에 닿아 화상을 입힐 수 있으므로 안전한 곳에 바로 버려야 한다."},{"q":"외출하기 전, 화재 예방을 위해 반드시 확인해야 하는 두 가지는?","c":["텔레비전 채널과 조명 밝기","가스 밸브 잠김과 조리기구 꺼짐 여부","냉장고 온도와 세탁기 상태","커튼 색깔과 창문 모양"],"a":1,"e":"가스 밸브가 열려 있거나 조리기구 전원이 켜져 있으면 화재로 이어질 수 있으므로, 외출 전 반드시 잠금과 꺼짐 상태를 확인해야 한다."},{"q":"화재에 대비해 온 가족이 함께 세우고 실제로 연습까지 해봐야 하는 것은?","c":["여행 계획","식사 계획","화재 대피 계획","청소 계획"],"a":2,"e":"화재 대피 계획은 세워두기만 해서는 소용없고, 가족이 함께 실제로 훈련해 보아야 위급 상황에서 몸이 기억하고 신속히 움직일 수 있다."},{"q":"대피 후 가족이 서로를 쉽게 찾을 수 있도록, 미리 정해두어야 하는 것은?","c":["가장 가까운 편의점","이웃집 초인종 번호","동네 놀이터 이름","집 밖의 특정한 집결 장소"],"a":3,"e":"화재 시 가족이 뿔뿔이 흩어져 대피할 수 있으므로, 집 밖의 특정한 장소를 미리 정해두면 서로의 안전을 빠르게 확인할 수 있다."}] },
  "8-3": { label: "8-3. 건물 붕괴·물놀이 사고 대처", data: [{"q":"건물이 갑자기 무너지는 사고를 무엇이라고 하는가?","c":["건물 붕괴","건물 침수","건물 화재","건물 정전"],"a":0,"e":"건물 붕괴는 노후화나 부실 공사 등의 이유로 건물의 구조물이 갑자기 무너져 내리는 사고를 말한다."},{"q":"건물 붕괴의 징조 중 하나로, 벽이나 바닥에서 들려오는 소리는?","c":["맑고 경쾌한 소리","갈라지는 소리","조용해지는 소리","반복되는 음악 소리"],"a":1,"e":"벽이나 바닥에서 갈라지는 듯한 소리가 들리면 구조물에 균열이 생기고 있다는 신호일 수 있으므로 즉시 대피를 준비해야 한다."},{"q":"붕괴 위험을 미리 알아차릴 수 있는 신호로, 갑자기 불안해하며 짖는 대상은?","c":["전등","알람 시계","동물","텔레비전"],"a":2,"e":"동물은 사람보다 진동이나 소리에 민감해서, 건물이 무너지기 전 이상한 낌새를 느끼고 갑자기 불안해하며 짖기도 한다."},{"q":"구조를 기다릴 때, 자신의 위치를 알리기 위해 사용하면 좋은 소리 나는 도구는?","c":["확성기","드럼","종이","호루라기"],"a":3,"e":"호루라기는 목소리보다 멀리, 오래 소리를 낼 수 있어 구조대에게 자신의 위치를 알리는 데 효과적인 도구이다."},{"q":"물놀이를 시작하기 전, 몸을 풀기 위해 반드시 해야 하는 것은?","c":["준비운동","식사","낮잠","일광욕"],"a":0,"e":"찬물에 갑자기 들어가면 심장에 무리가 갈 수 있으므로, 준비운동으로 몸을 미리 풀어주어야 안전하게 물놀이를 할 수 있다."},{"q":"물놀이 도중 저체온증이 생기면 몸에 나타나는 증상은?","c":["몸이 뜨거워지고 땀이 난다","몸이 떨리고 입술이 파래진다","눈이 감기고 잠이 온다","피부가 붉어지고 가려워진다"],"a":1,"e":"저체온증에 걸리면 체온이 떨어지면서 몸이 심하게 떨리고 입술이 파랗게 변하므로, 이런 증상이 보이면 즉시 물 밖으로 나와 몸을 따뜻하게 해야 한다."},{"q":"물에 빠졌을 때 가장 먼저 해야 할 행동은?","c":["숨을 참고 잠수하기","팔다리를 세게 휘젓기","큰 소리로 소리 지르기","물을 계속 마시기"],"a":2,"e":"물에 빠졌을 때는 크게 소리를 질러 주변 사람에게 위급 상황을 빨리 알려야 도움을 받을 수 있다."},{"q":"물에 빠진 사람을 발견했을 때, 절대 하면 안 되는 행동은?","c":["큰 소리로 도움을 요청하는 것","구명 튜브를 던지는 것","119에 신고하는 것","직접 물에 뛰어드는 것"],"a":3,"e":"수영을 잘하더라도 직접 뛰어들면 물에 빠진 사람이 구조자를 붙잡아 함께 위험해질 수 있으므로, 직접 뛰어들지 않고 구명 튜브 등을 던져야 한다."},{"q":"건물 붕괴의 징조 중 하나로, 건물 바닥에 나타나는 변화는?","c":["갈라지거나 움푹 꺼지는 것","반짝반짝 빛나는 것","시원해지는 것","색깔이 밝아지는 것"],"a":0,"e":"바닥이 갈라지거나 움푹 꺼지는 함몰 현상은 건물 구조물이 무너지기 직전에 나타날 수 있는 위험한 징조이다."},{"q":"건물 붕괴로 대피할 때, 머리를 보호하기 위해 사용할 수 있는 물건은?","c":["부드러운 쿠션","가방이나 책 같은 딱딱한 물건","비닐봉지","젖은 수건"],"a":1,"e":"떨어지는 잔해로부터 머리를 지키기 위해, 가방이나 책처럼 딱딱한 물건으로 머리 위를 감싸며 대피해야 한다."},{"q":"건물 붕괴로 대피가 어려울 때, 견디는 힘이 강한 벽체가 있어 상대적으로 안전한 대피 장소는?","c":["넓은 유리창 앞","베란다 난간 옆","엘리베이터 홀이나 계단실","가구가 많은 방 중앙"],"a":2,"e":"엘리베이터 홀이나 계단실은 구조적으로 튼튼한 벽체로 둘러싸여 있어, 다른 공간보다 붕괴 충격을 견디는 힘이 강한 편이다."},{"q":"붕괴 현장에서 분진과 먼지를 마시지 않도록 코와 입을 가리는 데 사용할 수 있는 것은?","c":["물이 담긴 컵","비닐봉지","신문지 뭉치","마른 손수건이나 옷"],"a":3,"e":"붕괴 현장에서는 물기 없는 마른 손수건이나 옷으로 코와 입을 가려 먼지와 분진을 들이마시지 않도록 해야 한다."},{"q":"물놀이 전 식사를 했다면, 최소 얼마나 소화시킨 후 물에 들어가야 하는가?","c":["30분","5분","2시간","3시간"],"a":0,"e":"식사 직후에는 소화가 덜 되어 배가 아프거나 쥐가 날 수 있으므로, 최소 30분 정도는 쉰 후에 물에 들어가야 한다."},{"q":"물에 들어갈 때, 심장에서 먼 부위부터 물을 적시는 방법에서 가장 먼저 적셔야 하는 부위는?","c":["가슴","다리","머리","팔"],"a":1,"e":"찬물에 갑자기 들어가면 심장에 부담을 줄 수 있어, 심장에서 먼 다리부터 천천히 물을 적신 뒤 들어가야 한다."},{"q":"물에 빠졌을 때, 체력 소모를 줄이며 물 위에 뜨는 데 도움이 되는 자세는?","c":["엎드려 헤엄치기","선 채로 발버둥치기","새우등뜨기 자세","팔다리 쭉 펴고 눕기만 하기"],"a":2,"e":"새우등뜨기 자세는 몸에 힘을 빼고 등을 구부린 채 뜨는 자세로, 체력을 아끼면서 물 위에 떠 있을 수 있게 해준다."},{"q":"물에 빠진 사람을 구할 때, 직접 뛰어들지 않고 던져 주어야 하는 물건은?","c":["돌멩이","수건","우산","구명 튜브"],"a":3,"e":"구명 튜브를 던져 물에 빠진 사람이 붙잡고 뜰 수 있게 해주면, 직접 뛰어들지 않고도 안전하게 도울 수 있다."},{"q":"붕괴 상황에서 대피할 때 피해야 하는 장소는?","c":["유리창이나 선반처럼 파손되기 쉬운 곳","넓게 트인 복도","계단실 입구","출입문 근처"],"a":0,"e":"유리창이나 선반 등은 흔들림에 쉽게 깨지거나 떨어질 수 있어, 대피할 때는 이런 파손되기 쉬운 물건 근처를 피해야 한다."},{"q":"붕괴 현장에서 구조를 기다릴 때, 휴대전화는 어떻게 사용해야 배터리를 아낄 수 있는가?","c":["계속 켜서 음악을 듣는다","필요할 때만 켜서 사용한다","화면 밝기를 최대로 한다","여러 앱을 동시에 켜 둔다"],"a":1,"e":"구조까지 시간이 걸릴 수 있으므로, 신고나 연락이 꼭 필요할 때만 휴대전화를 켜서 배터리를 아껴야 한다."},{"q":"붕괴 현장에서 추가 붕괴를 피하기 위해 대피해야 하는 곳은?","c":["넓은 유리창 옆","가장 높은 층","창문이 없는 단단한 벽 옆이나 테이블 아래","엘리베이터 안"],"a":2,"e":"추가 붕괴가 일어날 수 있으므로, 창문이 없어 파편이 덜 날아오는 단단한 벽 옆이나 테이블 아래처럼 몸을 보호할 수 있는 곳으로 피해야 한다."},{"q":"물놀이 중 비나 천둥·번개가 칠 때 반드시 해야 할 행동은?","c":["우산을 쓰고 계속 논다","물속으로 더 깊이 들어간다","나무 아래로 대피한다","물놀이를 즉시 중지한다"],"a":3,"e":"물속에서는 낙뢰에 감전될 위험이 매우 크므로, 비나 천둥·번개가 치면 즉시 물놀이를 멈추고 안전한 실내로 대피해야 한다."},{"q":"바닷가에서 큰 파도가 덮칠 때, 오히려 안전한 대처 방법은?","c":["숨을 참고 깊이 잠수하기","파도를 등지고 서 있기","팔을 흔들며 소리치기","파도 반대로 헤엄치기"],"a":0,"e":"큰 파도가 덮칠 때 그대로 맞서면 크게 휩쓸릴 수 있으므로, 숨을 참고 깊이 잠수해 파도의 힘을 피하는 것이 더 안전하다."},{"q":"해안선에서 40~50m까지 빠르게 떠내려가게 만드는, 바다 쪽으로 거꾸로 흐르는 위험한 물살은?","c":["해일","이안류","조수 간만","파랑"],"a":1,"e":"이안류는 해안에서 먼바다 쪽으로 빠르게 흐르는 물살로, 휩쓸리면 순식간에 해안에서 멀리 떠내려갈 수 있어 매우 위험하다."},{"q":"이안류에 휩쓸렸을 때, 벗어나기 위해 헤엄쳐야 하는 방향은?","c":["물살과 정반대 방향","물살이 흐르는 방향 그대로","물살과 45도 방향","해안과 수직인 방향으로 계속 저항"],"a":2,"e":"이안류는 폭이 좁으므로, 물살을 거스르지 말고 45도 방향으로 비스듬히 헤엄쳐 나오면 물살의 영향에서 벗어날 수 있다."},{"q":"물속에서 수초에 몸이 감겼을 때 올바른 대처 방법은?","c":["힘껏 발버둥쳐서 빠져나온다","숨을 참고 가만히 있는다","수초를 손으로 세게 잡아당긴다","발버둥치지 않고 부드럽게 수직으로 움직인다"],"a":3,"e":"수초에 감겼을 때 발버둥치면 오히려 더 심하게 엉킬 수 있으므로, 침착하게 부드럽고 천천히 수직으로 움직여 빠져나와야 한다."},{"q":"건물 붕괴 시 대피할 때, 한꺼번에 몰리면 위험한 장소는?","c":["비상구","넓은 로비","계단 난간","창문가"],"a":0,"e":"여러 사람이 비상구로 한꺼번에 몰리면 서로 밀리고 넘어져 오히려 대피가 늦어지고 다칠 수 있으므로 질서 있게 이동해야 한다."},{"q":"붕괴 현장에 갇혀 구조를 기다릴 때, 체력을 유지하기 위해 반드시 찾아야 하는 두 가지는?","c":["휴대전화와 충전기","물과 음식","라디오와 손전등","이불과 베개"],"a":1,"e":"구조까지 시간이 걸릴 수 있으므로, 주변에서 물과 음식을 찾아 체력을 유지하는 것이 생존에 중요하다."},{"q":"물놀이 사고에 대비해 소방서에서 미리 배워두면 좋은 응급처치 기술은?","c":["수영 신기록 세우기","다이빙 기술","심폐소생술(CPR)","잠수 시간 늘리기"],"a":2,"e":"물놀이 사고로 심장과 호흡이 멎은 사람을 구할 수 있도록, 소방서 등에서 심폐소생술을 미리 배워두면 큰 도움이 된다."},{"q":"물속에서 물을 먹지 않으려고 격하게 움직이면 어떤 문제가 생기는가?","c":["몸이 더 따뜻해진다","숨쉬기가 더 편해진다","더 잘 뜬다","체력이 더 빨리 줄어든다"],"a":3,"e":"물속에서 격하게 움직이면 힘을 많이 써서 체력이 빠르게 소모되어 오히려 더 위험해질 수 있으므로, 힘을 빼고 침착하게 대응해야 한다."},{"q":"물에 빠진 사람을 구조할 때, 구명 튜브를 던진 다음 이용해 끌어당기면 좋은 도구는?","c":["막대나 끈","무거운 돌","젖은 수건","우산"],"a":0,"e":"구명 튜브를 던진 뒤 긴 막대나 끈을 이용해 끌어당기면, 직접 물에 들어가지 않고도 안전하게 구조를 도울 수 있다."}] },
  "8-4": { label: "8-4. 다중이용시설 안전수칙", data: [{"q":"놀이터에서 유리 조각이나 돌에 다치지 않으려면 반드시 신어야 하는 것은 무엇인가?","c":["신발","장갑","모자","목도리"],"a":0,"e":"놀이터 바닥에는 유리 조각이나 돌멩이 등이 있을 수 있어 맨발로 다니면 다칠 위험이 크므로 반드시 신발을 신고 놀아야 한다."},{"q":"그네를 탈 때 절대 하면 안 되는 행동은?","c":["그네가 완전히 멈춘 뒤 내리기","두 손으로 줄을 꼭 잡기","그네가 움직이는 중간에 뛰어내리기","다리를 굽혀 앉기"],"a":2,"e":"그네가 흔들리는 중간에 뛰어내리면 몸의 균형을 잃고 크게 넘어지거나 다칠 수 있으므로, 그네가 멈춘 뒤에 내려야 한다."},{"q":"공연장이나 행사장에 입장할 때 반드시 지켜야 하는 것은?","c":["질서","속도","소음","경쟁"],"a":0,"e":"입장할 때 서로 밀치거나 새치기를 하면 넘어짐 사고나 압사 사고로 이어질 수 있으므로 줄을 서서 질서를 지켜야 한다."},{"q":"화재 위험이 있어 행사장에서 함부로 사용하면 안 되는 것은?","c":["우산","폭죽","손수건","가방"],"a":1,"e":"폭죽은 불꽃이 튀어 옷이나 주변 물건에 옮겨붙을 수 있어 지정된 장소와 방법이 아니면 함부로 사용해서는 안 된다."},{"q":"에스컬레이터나 무빙워크를 탈 때 신발끈이나 옷자락이 끼지 않도록 조심해야 하는 부분은?","c":["손잡이","틈새(발판 사이)","계단 난간","출입구"],"a":1,"e":"에스컬레이터 발판과 옆면 사이의 틈새에 신발끈이나 옷자락이 끼면 크게 다칠 수 있으므로 노란 안전선 안쪽에 서서 조심해야 한다."},{"q":"끈이 달린 옷을 입고 놀이기구를 타면 위험한 이유는?","c":["옷이 젖을 수 있어서","놀이기구에 끈이 낄 수 있어서","옷이 더러워져서","체온이 떨어져서"],"a":1,"e":"헐렁하거나 끈이 달린 옷은 놀이기구의 회전 부분이나 틈에 끼어 몸이 끌려가는 사고로 이어질 수 있어 위험하다."},{"q":"시소처럼 흔들리는 놀이기구를 탈 때 두 손으로 꼭 잡아야 하는 것은?","c":["옆 친구의 옷","손잡이","자신의 무릎","바닥"],"a":1,"e":"흔들리는 놀이기구에서 손잡이를 꼭 잡지 않으면 균형을 잃고 떨어질 위험이 있으므로 두 손으로 손잡이를 꽉 잡아야 한다."},{"q":"미끄럼틀에서 내려올 때 안전한 방법은?","c":["여러 명이 한꺼번에 탄다","앞사람이 다 내려간 뒤 한 사람씩 탄다","거꾸로 올라간다","서서 미끄러진다"],"a":1,"e":"앞 친구가 완전히 내려가기 전에 뒤따라 타면 부딪혀 다칠 수 있으므로 반드시 한 사람씩 순서를 지켜 타야 한다."},{"q":"공연장에서 입장할 때 앞사람을 밀치면 발생할 수 있는 위험한 사고는?","c":["감전 사고","압사 사고","화상 사고","질식 사고"],"a":1,"e":"좁은 통로에서 서로 밀치면 많은 사람이 한꺼번에 눌리는 압사 사고로 이어질 수 있어 절대 밀지 말고 질서를 지켜야 한다."},{"q":"회전문을 급하게 이용할 때 특히 조심해야 하는 신체 부위는?","c":["손","무릎","어깨","허리"],"a":0,"e":"회전문을 서둘러 통과하려다 문틈에 손이 끼는 사고가 자주 발생하므로 천천히 여유를 두고 이용해야 한다."},{"q":"공연장에서 화재 등 위급 상황으로 안내원의 지시에 따라 이동할 때 취해야 할 자세는?","c":["몸을 낮춘 자세","까치발 자세","팔을 벌린 자세","제자리에서 뛰는 자세"],"a":0,"e":"연기는 위쪽으로 퍼지기 때문에 몸을 낮추고 천천히 이동해야 연기를 덜 마시고 안전하게 대피할 수 있다."},{"q":"공연이 시작되기 전, 화재 등 위급 상황에서 지켜야 할 절차를 안내하는 것을 무엇이라 하는가?","c":["관람 예절","비상 상황 행동 요령","공연 시간표","입장권 확인"],"a":1,"e":"공연 시작 전 안내되는 비상 상황 행동 요령에는 비상구 위치와 대피 방법 등이 담겨 있어 미리 잘 들어두어야 한다."},{"q":"행사를 더 잘 보려고 관람석이 아닌 옥상이나 담벼락 위에 올라가면 안 되는 이유는?","c":["시야가 나빠져서","2차·3차 피해로 이어질 수 있어서","입장료가 더 들어서","소리가 잘 안 들려서"],"a":1,"e":"지정되지 않은 곳에 올라가면 추락하거나 구조물이 무너지는 등 2차·3차 피해로 이어질 수 있어 매우 위험하다."},{"q":"에스컬레이터를 탈 때 손잡이 밖으로 절대 내밀면 안 되는 신체 부위는?","c":["머리","발끝","무릎","손목"],"a":0,"e":"에스컬레이터 옆면과 천장, 구조물 사이에 머리를 내밀면 부딪히거나 끼는 사고로 이어질 수 있어 매우 위험하다."},{"q":"마트나 백화점 복도에서 뛰어다니면 부딪힐 위험이 있는 것은?","c":["전시물이나 진열대 모서리","계산대 직원","출입문 유리","엘리베이터 버튼"],"a":0,"e":"복도에서 뛰다가 진열대 모서리나 전시물에 부딪히면 크게 다칠 수 있으므로 실내에서는 뛰지 말고 천천히 걸어야 한다."},{"q":"건물마다 위치가 다르기 때문에 공연장에 갈 때마다 미리 확인해 두어야 하는 것은?","c":["매점 위치","비상구(비상 탈출로)","화장실 위치","좌석 번호"],"a":1,"e":"공연장마다 비상구 위치가 다르므로, 입장하자마자 가까운 비상구가 어디에 있는지 미리 확인해 두면 위급 상황에서 빠르게 대피할 수 있다."},{"q":"에스컬레이터나 무빙워크에서 절대 하면 안 되는 행동은?","c":["손잡이를 잡는 것","한 줄로 서는 것","정해진 진행 방향과 반대로 걷는 것","앞을 보고 서는 것"],"a":2,"e":"진행 방향과 반대로 걷거나 뛰면 다른 이용자와 부딪히거나 넘어져 크게 다칠 수 있으므로 정해진 방향으로만 이용해야 한다."},{"q":"회전문을 이용할 때 들어가기 전에 반드시 확인해야 하는 것은?","c":["문이 완전히 열려 있는지","문의 색깔","문 앞의 광고","문의 재질"],"a":0,"e":"회전문의 칸이 완전히 열리지 않은 상태에서 들어가면 문에 부딪히거나 끼일 수 있으므로 충분히 열린 것을 확인하고 들어가야 한다."},{"q":"마트 바닥에 떨어진 액체 때문에 미끄러질 수 있으므로 어떻게 걸어야 하는가?","c":["빠르게 뛰어서","천천히 조심해서","눈을 감고","한쪽 다리로"],"a":1,"e":"바닥에 흘린 물이나 음료 등으로 미끄러지면 크게 넘어질 수 있으므로 항상 주변을 살피며 천천히 걸어야 한다."}] },
  "8-5": { label: "8-5. 산불 안전수칙", data: [{"q":"산불이 집 근처로 번질 때 예방을 위해 집 주변에 미리 뿌려두면 좋은 것은?","c":["물","기름","모래","페인트"],"a":0,"e":"집 주변에 물을 미리 뿌려 놓으면 불이 옮겨붙는 것을 늦추거나 막는 데 도움이 된다."},{"q":"산불이 주택가로 번지기 시작하면 가장 먼저 해야 할 일은?","c":["집안 물건 정리하기","안전한 곳으로 대피하기","소방차 색깔 확인하기","불을 직접 끄러 가기"],"a":1,"e":"산불이 주택가까지 번지면 매우 위험하므로 무엇보다 먼저 자신과 가족의 안전을 위해 대피해야 한다."},{"q":"등산 중 산불을 발견하면 가장 먼저 해야 할 일은?","c":["사진을 찍는다","119나 산림청에 신고한다","혼자 불을 끄려고 한다","계속 등산을 한다"],"a":1,"e":"산불을 발견하면 스스로 끄려 하지 말고 즉시 119나 산림 관련 기관에 신고하여 빠른 진화가 이루어지도록 해야 한다."},{"q":"산불 예방을 위해 절대 들어가면 안 되는 지역은?","c":["산책로","통제 지역","등산로 입구","전망대"],"a":1,"e":"산불 위험이 높은 시기나 장소에 지정된 통제 지역에 들어가면 산불 발생 위험이 커지고 본인도 위험해지므로 절대 들어가면 안 된다."},{"q":"산에서 절대 소지하거나 사용하면 안 되는 것은?","c":["물병","라이터·담배","등산화","우비"],"a":1,"e":"산에서 라이터나 담배를 사용하면 작은 불씨가 마른 나뭇잎이나 낙엽에 옮겨붙어 큰 산불로 번질 수 있어 절대 소지·사용하면 안 된다."},{"q":"산불이 집으로 번지려 할 때, 집 안으로 불씨와 연기가 들어오지 않도록 반드시 닫아야 하는 것은?","c":["문과 창문","냉장고 문","커튼만","신발장"],"a":0,"e":"문과 창문을 꼭 닫아야 불씨와 연기가 집 안으로 들어오는 것을 막을 수 있다."},{"q":"산불이 집 근처로 번질 때, 폭발 위험이 있어 미리 치워야 하는 물건은 가스통과 무엇인가?","c":["유류(기름)","이불","화분","신발"],"a":0,"e":"가스통과 유류(기름)는 불이 닿으면 폭발할 위험이 크므로 산불이 다가오기 전에 안전한 곳으로 미리 옮겨 두어야 한다."},{"q":"산불의 크기가 작을 때, 나뭇가지로 두드리는 것과 함께 불을 덮어서 끌 수 있는 것은?","c":["흙","종이","나뭇잎","비닐"],"a":0,"e":"작은 산불은 나뭇가지로 두드리거나 흙을 덮어 산소를 차단하는 방법으로 끌 수 있지만, 불이 커지면 즉시 대피해야 한다."},{"q":"산불이 커져서 진화가 어려울 때, 벗어나야 하는 것은?","c":["산불의 진행 방향","등산로","계곡물","바람이 불어오는 반대쪽"],"a":0,"e":"산불이 번지는 진행 방향에 있으면 매우 위험하므로 불길이 향하는 방향에서 재빨리 벗어나 대피해야 한다."},{"q":"허용된 지역이 아니면 산에서 절대 하면 안 되는 두 가지 활동은?","c":["사진 촬영과 휴식","취사와 야영","등산과 하산","관찰과 기록"],"a":1,"e":"허가되지 않은 곳에서 취사나 야영을 하면 불씨 관리가 어려워 산불로 이어지기 쉬우므로 지정된 장소가 아니면 절대 해서는 안 된다."},{"q":"대피할 때, 이웃 주민에게 산불 위험 상황을 어떻게 알려야 하는가?","c":["조용히 눈짓으로","큰 소리로","문자로만","알리지 않는다"],"a":1,"e":"산불처럼 급박한 상황에서는 큰 소리로 이웃에게 알려 함께 신속하게 대피할 수 있도록 해야 한다."},{"q":"거동이 불편한 이웃이 있다면 도움을 받을 수 있도록 누구에게 알려야 하는가?","c":["진화대원(공무원)","동네 어린이","반려동물","택배 기사"],"a":0,"e":"혼자 대피하기 어려운 이웃이 있다면 진화대원이나 공무원 등에게 즉시 알려 도움을 받을 수 있도록 해야 한다."},{"q":"안전한 곳으로 대피한 뒤, 진화 소식을 확인하기 위해 집중해서 살펴야 하는 것은?","c":["재난문자(방송)","친구의 SNS","날씨 앱의 온도","인터넷 쇼핑 정보"],"a":0,"e":"대피 후에는 재난문자나 방송을 통해 산불 진화 상황과 안전 정보를 계속 확인해야 한다."},{"q":"산행 중 산불 신고 방법 안내는 주로 등산로 입구의 어디에 붙어 있어 산행 전 확인해야 하는가?","c":["현수막","안내견 목걸이","등산화 라벨","지도 뒷면"],"a":0,"e":"등산로 입구에는 산불 신고 전화번호 등이 적힌 현수막이 붙어 있는 경우가 많으므로 산행 전에 미리 확인해 두면 좋다."},{"q":"산불을 피해 대피하지 못했을 때, 바람을 어떻게 하고 낮게 엎드려야 하는가?","c":["등지고","마주 보고","옆으로 하고","위로 보고"],"a":0,"e":"바람을 등지면 불길과 연기가 자신 쪽으로 덜 오게 되어 낮게 엎드렸을 때 더 안전하다."},{"q":"산불에 대피하지 못했을 때, 낮게 엎드리기 전에 주변에서 제거해야 하는 것은?","c":["가연성 물질","돌멩이","흙","나무 그늘"],"a":0,"e":"주변에 마른 나뭇잎이나 낙엽 같은 가연성 물질이 있으면 불이 옮겨붙기 쉬우므로 미리 치우고 엎드려야 한다."},{"q":"산불에 대피할 때, 산불보다 어떤 위치의 장소로 재빨리 이동해야 하는가?","c":["낮은 장소","불이 있는 곳과 같은 높이","높은 봉우리","나무 위"],"a":0,"e":"불은 위쪽으로 빠르게 번지는 성질이 있으므로 산불보다 낮은 지대로 이동해야 상대적으로 안전하다."},{"q":"산림과 가까운 곳에서 절대 태우면 안 되는, 논이나 밭의 둘레를 무엇이라 하는가?","c":["논두렁","제방","울타리","방죽"],"a":0,"e":"논두렁을 태우다가 불이 산림으로 옮겨붙는 것이 산불의 대표적인 원인 중 하나이므로 산림 근처에서는 절대 태워서는 안 된다."},{"q":"산불 통제 지역에 들어가면 산불 위험 외에도 어떤 위험이 커지는가?","c":["크게 다칠 위험","길을 잃지 않을 위험","시원해질 위험","비를 만날 위험"],"a":0,"e":"통제 지역은 산불이 발생했거나 발생 위험이 매우 큰 곳으로, 화재뿐 아니라 낙석이나 붕괴 등으로 크게 다칠 위험도 함께 커진다."}] },
  "9-1": { label: "9-1. 지진·낙뢰 안전수칙", data: [{"q":"땅속 거대한 암반이 갑자기 갈라지면서 땅이 흔들리는 현상을 무엇이라 하는가?","c":["지진","태풍","홍수","황사"],"a":0,"e":"지진은 땅속 깊은 곳의 암반이 갑자기 어긋나거나 갈라지면서 그 충격이 땅을 흔드는 자연 현상이다."},{"q":"학교 운동장에서 지진을 느꼈을 때 대피해야 하는 곳은?","c":["건물 출입구 앞","나무 그늘 아래","운동장 한가운데","축대나 담장 옆"],"a":2,"e":"건물이나 나무, 담장 근처는 무너지거나 떨어지는 물체에 다칠 위험이 있으므로 아무것도 없는 운동장 한가운데로 이동해 몸을 낮춰야 한다."},{"q":"구름 안에 있는 전기가 방전되면서 발생하는 기상 현상은?","c":["번개","무지개","황사","이슬"],"a":0,"e":"번개는 구름 속에 쌓인 전기가 순간적으로 방전되면서 강한 빛과 소리를 내는 기상 현상이다."},{"q":"번개가 구름과 땅 사이에서 발생하는 경우를 무엇이라 하는가?","c":["낙뢰(벼락)","일식","오로라","해일"],"a":0,"e":"구름과 구름 사이가 아니라 구름과 땅 사이에서 발생하는 번개를 낙뢰 또는 벼락이라고 하며, 사람이나 건물에 큰 피해를 줄 수 있다."},{"q":"야외에서 낙뢰가 칠 때, 우선적으로 대피해야 하는 곳은?","c":["큰 나무 아래","피뢰침이 설치된 건물","넓은 운동장 한가운데","우산을 쓴 채 야외"],"a":1,"e":"피뢰침이 설치된 건물은 낙뢰가 피뢰침을 통해 땅으로 흘러가도록 설계되어 있어 안전하게 대피할 수 있는 장소이다."},{"q":"거리에서 지진이 났을 때, 가방 등으로 보호해야 하는 신체 부위는?","c":["머리","발목","손목","허리"],"a":0,"e":"지진이 나면 유리 파편이나 간판 등이 떨어질 수 있으므로 가방이나 손으로 머리를 보호하며 이동해야 한다."},{"q":"지진이 났을 때 거리에서 가까이 가면 위험한, 넘어지기 쉬운 것은?","c":["자판기나 문기둥","보도블록","가로수 낙엽","횡단보도 선"],"a":0,"e":"자판기나 문기둥처럼 세워져 있는 구조물은 지진의 흔들림에 쉽게 넘어질 수 있으므로 가까이 가지 않아야 한다."},{"q":"차를 타고 있을 때 지진이 나면, 넘어지지 않도록 꽉 잡아야 하는 것은?","c":["손잡이","운전대를 직접 조작","창문","안전벨트 버클"],"a":0,"e":"차 안에서 지진이 나면 흔들림으로 넘어지거나 부딪히지 않도록 손잡이를 꽉 잡고, 운전자는 안전한 곳에 차를 세운 뒤 상황을 살펴야 한다."},{"q":"산 근처나 급경사지에서 지진이 나면 흙이 무너지는 재해를 무엇이라 하는가?","c":["산사태","해일","황사","가뭄"],"a":0,"e":"지진의 흔들림으로 산비탈의 흙과 바위가 무너져 내리는 것을 산사태라고 하며, 지진 발생 시 산 근처에서는 특히 주의해야 한다."},{"q":"학교에서 낙뢰가 칠 때, 감전 위험이 높아 절대 가면 안 되는 물기 있는 장소는?","c":["교실","화장실","도서관","강당"],"a":1,"e":"물은 전기가 잘 통하기 때문에 낙뢰가 칠 때 물기가 많은 화장실 같은 곳은 감전 위험이 높아 가까이 가면 안 된다."},{"q":"사람이 낙뢰를 직접 맞아 감전되는 것을 무엇이라 하는가?","c":["직격뇌","접촉뇌격","측면섬락","보폭전압"],"a":0,"e":"직격뇌는 사람의 몸에 번개가 직접 떨어지는 가장 위험한 낙뢰 유형이다."},{"q":"사람이 손에 들고 있던 우산 같은 물체에 낙뢰가 떨어져 감전되는 유형을 무엇이라 하는가?","c":["직격뇌","접촉뇌격","측면섬락","보폭전압"],"a":1,"e":"접촉뇌격은 사람이 쥐고 있거나 접촉하고 있는 물체에 벼락이 떨어져 그 물체를 통해 감전되는 경우를 말한다."},{"q":"낙뢰가 나무 같은 물체에 떨어진 뒤, 그 물체와 사람 사이로 전류가 튀어 흐르는 유형은?","c":["직격뇌","접촉뇌격","측면섬락","보폭전압"],"a":2,"e":"측면섬락은 번개를 맞은 나무나 구조물에서 옆에 있는 사람에게로 전류가 옮겨 튀는 경우로, 나무 아래 피신하면 위험한 이유이기도 하다."},{"q":"낙뢰로 인한 전류가 땅을 타고 흐를 때, 두 다리 사이의 전위차로 감전되는 유형은?","c":["직격뇌","접촉뇌격","측면섬락","보폭전압"],"a":3,"e":"보폭전압은 벼락이 땅에 떨어진 뒤 전류가 땅속으로 퍼져 나가면서 두 발 사이에 전압 차이가 생겨 감전되는 현상이다."},{"q":"낙뢰가 칠 때 학교에서 절대 기대면 안 되는 두 가지는?","c":["책상과 의자","벽과 기둥","칠판과 게시판","사물함과 신발장"],"a":1,"e":"벽이나 기둥은 건물 외부와 연결된 금속 배관이나 철근을 통해 전류가 흐를 수 있어 낙뢰 시에는 기대지 않는 것이 안전하다."},{"q":"낙뢰가 칠 때 가까이하면 안 되는, 우산이나 야영도구처럼 전기가 잘 통하는 재질의 물건은?","c":["금속 제품","나무 제품","고무 제품","플라스틱 제품"],"a":0,"e":"금속은 전기가 매우 잘 통하기 때문에 낙뢰가 칠 때 금속으로 된 물건을 들고 있으면 감전될 위험이 커진다."},{"q":"낙뢰가 칠 때 가까이 가면 안 되는, 높이 솟은 사물 두 가지는?","c":["나무·전신주","벤치·자전거 거치대","우체통·가로등 밑동","화단·보도블록"],"a":0,"e":"나무나 전신주처럼 주변보다 높이 솟은 물체는 번개가 떨어지기 쉬워 그 근처는 매우 위험하다."},{"q":"낙뢰가 칠 때 전기가 잘 통해서 가까이 가면 안 되는 곳은?","c":["강이나 호수","실내 체육관","지하 주차장","건물 로비"],"a":0,"e":"물은 전기를 잘 전달하기 때문에 낙뢰가 칠 때 강이나 호수 근처에 있으면 감전 위험이 매우 크다."},{"q":"낙뢰가 칠 때 학교에서 학생 스스로 판단하지 말고 반드시 따라야 하는 것은?","c":["친구들의 행동","선생님의 지시","인터넷 정보","라디오 음악"],"a":1,"e":"위급한 상황일수록 스스로 판단해 행동하기보다 선생님의 지시에 따라 질서 있게 움직이는 것이 안전하다."}] },
  "9-2": { label: "9-2. 태풍 안전수칙", data: [{"q":"열대 바다에서 발생한 저기압 구름이 발달하여, 강한 바람과 많은 비를 동반하는 자연재해는?","c":["태풍","황사","가뭄","한파"],"a":0,"e":"태풍은 열대 해상에서 생긴 저기압이 발달하면서 강한 바람과 폭우를 몰고 오는 자연재해로, 큰 피해를 줄 수 있다."},{"q":"우리나라에 태풍이 특히 많이 발생하는 계절은?","c":["겨울","여름","봄","가을 늦게"],"a":1,"e":"태풍은 바닷물의 온도가 높아지는 여름철에 열대 해상에서 주로 발생해 우리나라로 접근한다."},{"q":"태풍이 불 때 집 안에서 반드시 해두어야 하는 것은?","c":["창문을 열어두기","커튼을 걷기","창문을 잠그기","화분을 밖에 내놓기"],"a":2,"e":"창문을 잠그지 않으면 강한 바람에 창문이 흔들리다 깨질 수 있으므로, 태풍이 오기 전 창문을 단단히 잠가야 한다."},{"q":"태풍 정보를 얻기 위해 집에서 확인할 수 있는 것들은?","c":["일기장·달력·시계","냉장고·세탁기·청소기","책·그림·사진","TV·라디오·휴대전화"],"a":3,"e":"TV, 라디오, 휴대전화의 재난 문자 등을 통해 태풍의 이동 경로와 예상 피해 등 최신 정보를 실시간으로 확인할 수 있다."},{"q":"태풍이 다가올 때 가장 좋은 행동은?","c":["외출을 삼가는 것","등산을 가는 것","바닷가로 놀러 가는 것","캠핑을 떠나는 것"],"a":0,"e":"태풍이 다가오면 강풍과 폭우로 인한 사고 위험이 크므로, 꼭 필요한 경우가 아니면 외출을 삼가고 집 안에 머무는 것이 가장 안전하다."},{"q":"태풍의 강한 바람 때문에 도로에서 자주 떨어지는 것들은?","c":["맨홀 뚜껑","간판이나 나뭇가지","가로수 뿌리","도로 표지판 기둥"],"a":1,"e":"강한 바람이 불면 제대로 고정되지 않은 간판이나 나뭇가지가 떨어질 수 있어, 태풍이 부는 도로를 지날 때는 위쪽을 조심해야 한다."},{"q":"창문을 보강할 때, 테이프와 함께 붙이면 도움이 되는 것은?","c":["마른 낙엽","비닐봉지","젖은 신문지","드라이아이스"],"a":2,"e":"테이프와 함께 젖은 신문지를 창문에 붙이면 유리가 깨지더라도 파편이 크게 흩어지는 것을 막아주는 효과가 있다."},{"q":"도로에 물이 잠겨 있을 때 해야 할 행동은?","c":["조심스럽게 그냥 지나가기","물웅덩이 깊이를 재보기","빠르게 뛰어서 건너기","그 길을 피해서 돌아가기"],"a":3,"e":"물에 잠긴 도로는 깊이를 가늠하기 어렵고 맨홀 뚜껑이 열려 있을 수도 있어 매우 위험하므로, 반드시 피해서 다른 길로 가야 한다."},{"q":"태풍이 지나갈 때, 아무리 작아 보여도 절대 건너면 안 되는 곳은?","c":["개울","마당","골목길","횡단보도"],"a":0,"e":"태풍으로 비가 많이 내리면 작은 개울도 순식간에 물이 불어나 물살이 거세지므로 절대 건너서는 안 된다."},{"q":"산에서 태풍을 만났을 때, 벗어나기 어렵다면 이동해야 하는 곳은?","c":["가장 낮은 곳","가장 높은 곳","계곡 근처","나무 아래"],"a":1,"e":"산에서는 계곡이나 낮은 곳으로 갑자기 물이 불어나거나 산사태가 날 수 있으므로, 벗어나기 어렵다면 되도록 높은 곳으로 이동해야 한다."},{"q":"창문에 테이프를 붙일 때, 안전을 더하기 위한 방법은?","c":["테이프 없이 신문지만 붙이기","테이프를 한 번만 살짝 붙이기","테이프를 이중으로 부착하기","테이프 색깔을 다르게 하기"],"a":2,"e":"테이프를 한 번이 아니라 이중으로 붙이면 유리가 더 튼튼하게 고정되어, 강풍에도 잘 깨지지 않고 깨지더라도 파편이 덜 흩어진다."},{"q":"태풍이 지나가는 도로에서 접근하면 안 되는, 무너질 위험이 있는 곳은?","c":["넓은 광장","횡단보도 앞","버스 정류장","위험 축대나 대형 공사장"],"a":3,"e":"많은 비로 지반이 약해지면 축대나 공사장 가림막이 무너질 수 있으므로 이런 곳에는 절대 가까이 가면 안 된다."},{"q":"비가 그친 후에도 산에서 계속 주의 깊게 살펴야 하는 이유가 되는 재해는?","c":["산사태","가뭄","산불","황사"],"a":0,"e":"비가 그친 직후에도 빗물이 스며들어 약해진 지반이 무너지는 산사태가 발생할 수 있으므로 계속 주의해야 한다."},{"q":"계곡에서 물살이 거셀 때, 건너지 않고 해야 할 행동은?","c":["빠르게 뛰어서 건너기","돌아서 다른 길로 가기(우회하기)","손을 잡고 함께 건너기","물살이 약해질 때까지 그 자리에서 기다리기"],"a":1,"e":"물살이 거센 계곡을 무리하게 건너려 하면 휩쓸릴 위험이 크므로, 안전한 다른 길로 돌아가는 우회가 가장 안전한 방법이다."},{"q":"태풍에 대비하기 위해 기상예보에서 확인해야 하는 정보는?","c":["내일의 기온","다음 주 날씨","태풍의 이동 경로","작년 태풍 기록"],"a":2,"e":"태풍이 우리 지역으로 오는지, 언제 어느 방향으로 지나가는지 알아야 미리 대비할 수 있으므로 이동 경로를 계속 확인해야 한다."},{"q":"많은 비로 지반이 약해지면서 산사태 위협이 오히려 커지는 시점은?","c":["비가 내리기 시작할 때","태풍이 오기 전날","맑은 날 한낮","비가 그친 후"],"a":3,"e":"비가 그친 직후에도 스며든 빗물 때문에 지반이 계속 약해져 있어, 오히려 이 시기에 산사태 위험이 크게 남아 있다."},{"q":"도로에 세워져 있으며, 태풍이 불 때 넘어질 위험이 있어 접근하면 안 되는 간판을 무엇이라고 하는가?","c":["입간판","현수막","이정표","가로등"],"a":0,"e":"입간판은 바닥에 세워 놓은 형태의 간판으로 고정이 약해 강풍에 쉽게 넘어질 수 있으므로 가까이 가면 안 된다."},{"q":"태풍이 지나갈 때 가장 안전한 장소는?","c":["해변","집","산 정상","다리 위"],"a":1,"e":"태풍이 부는 동안에는 강풍과 폭우, 낙하물 위험이 크므로 집 안에 머무르며 창문에서 떨어져 있는 것이 가장 안전하다."}] },
  "9-3": { label: "9-3. 홍수·황사 안전수칙", data: [{"q":"폭우로 인해 강과 하천의 물이 불어나 넘치는 현상을 무엇이라 하는가?","c":["홍수","가뭄","황사","한파"],"a":0,"e":"홍수는 많은 비가 짧은 시간에 내려 강과 하천의 물이 넘쳐흐르는 현상으로, 저지대 침수 등의 피해를 일으킬 수 있다."},{"q":"저지대에 있을 때 홍수가 나면 빠르게 이동해야 하는 곳은?","c":["높은 곳","지하실","강가","다리 아래"],"a":0,"e":"저지대는 물이 빠르게 차오를 수 있으므로 홍수가 나면 신속히 높은 곳으로 이동해 안전을 확보해야 한다."},{"q":"흙먼지가 날아와 사람과 농작물에 피해를 주는 자연 현상은?","c":["황사","장마","폭설","안개"],"a":0,"e":"황사는 중국이나 몽골의 사막 지역에서 발생한 흙먼지가 바람을 타고 날아와 호흡기와 농작물 등에 피해를 주는 현상이다."},{"q":"황사가 발생하면 집에서 반드시 닫아 두어야 하는 것은?","c":["창문과 문","냉장고 문","신발장","베란다 커튼만"],"a":0,"e":"황사 먼지가 집 안으로 들어오지 못하도록 창문과 문을 꼭 닫아 두어야 한다."},{"q":"황사가 있을 때 외출을 어떻게 해야 하는가?","c":["가능한 삼가기","평소보다 자주 하기","마스크 없이 하기","밤에만 하기"],"a":0,"e":"황사 먼지는 호흡기에 나쁜 영향을 주므로 황사가 심할 때는 외출을 되도록 자제하는 것이 좋다."},{"q":"홍수가 났을 때, 누구의 지시에 따라 대피해야 하는가?","c":["또래 친구","공공기관 안내자","인터넷 방송인","이웃집 강아지"],"a":1,"e":"홍수 상황에서는 상황을 정확히 파악하고 있는 공공기관 안내자의 지시에 따라 침착하게 대피해야 안전하다."},{"q":"도로에서 홍수가 났을 때, 가까이 가면 안 되는 것은?","c":["흐르는 물(밀려온 물)","가로등","신호등","보도블록"],"a":0,"e":"빠르게 흐르는 물은 작아 보여도 사람을 넘어뜨릴 만큼 힘이 세고 맨홀 등 위험 요소를 가릴 수 있어 가까이 가면 안 된다."},{"q":"물이 흐르는 곳을 통과할 때 발밑을 살피며 조심해야 하는 두 가지 위험은?","c":["돌과 맨홀","우산과 장화","가방과 신발끈","계단과 난간"],"a":0,"e":"물이 차오르면 바닥의 돌이나 뚜껑이 열린 맨홀이 보이지 않아 발을 헛디디거나 빠질 위험이 있으므로 발밑을 잘 살펴야 한다."},{"q":"황사가 발생했을 때 외출 시 반드시 착용해야 하는 것들은?","c":["마스크와 보호안경","우산과 장화","목도리와 장갑","선글라스와 모자만"],"a":0,"e":"황사 먼지가 호흡기와 눈에 들어가지 않도록 외출 시에는 마스크와 보호안경(고글)을 착용하는 것이 좋다."},{"q":"집에 돌아온 뒤, 몸에 붙은 황사 먼지를 없애기 위해 해야 하는 것들은?","c":["손 씻기와 세수(샤워)","이불 털기만","환기만 하기","옷 그대로 눕기"],"a":0,"e":"황사 먼지가 몸에 남아 있으면 호흡기나 피부에 문제를 일으킬 수 있으므로 귀가 후에는 손을 씻고 세수나 샤워를 해야 한다."},{"q":"홍수 상황을 파악하기 위해 TV·라디오·핸드폰으로 확인해야 하는 기상 정보는?","c":["강수량","기온","풍향","자외선 지수"],"a":0,"e":"강수량 정보를 통해 비가 얼마나 내렸고 앞으로 얼마나 더 내릴지 파악하면 홍수 위험을 미리 대비할 수 있다."},{"q":"집에서 홍수를 겪을 때, 추운 날씨에 특히 조심해야 하는 신체 변화는?","c":["체온이 떨어지는 것","시력이 좋아지는 것","식욕이 느는 것","키가 자라는 것"],"a":0,"e":"물에 젖은 채로 추운 곳에 오래 있으면 체온이 급격히 떨어져 저체온증이 생길 수 있으므로 몸을 따뜻하게 유지해야 한다."},{"q":"계곡이나 하천의 물이 갑자기 많아졌을 때, 누구에게 알려야 하는가?","c":["어른들","동물들","친구들끼리만","알릴 필요 없다"],"a":0,"e":"계곡물이 갑자기 불어나는 것은 상류 지역에 많은 비가 내렸다는 신호일 수 있으므로 즉시 어른들에게 알려 대피해야 한다."},{"q":"황사가 농작물이나 과일나무에 피해를 주는 이유는 잎의 무엇을 막기 때문인가?","c":["숨쉬는 구멍(기공)","뿌리","줄기","꽃가루"],"a":0,"e":"황사 먼지가 잎에 쌓이면 잎이 숨을 쉬는 작은 구멍인 기공을 막아 광합성을 방해하고 농작물에 피해를 준다."},{"q":"황사 발생 시 외출할 때 입으면 좋은 옷의 특징은?","c":["소매가 긴 옷","소매가 짧은 옷","얇고 비치는 옷","맨살이 많이 드러나는 옷"],"a":0,"e":"소매가 긴 옷을 입으면 피부가 황사 먼지에 직접 닿는 것을 줄일 수 있어 외출 시 도움이 된다."},{"q":"홍수는 전 세계적으로 가장 많이 발생하는 무엇으로 꼽히는가?","c":["재난(자연재해)","축제","관광 상품","스포츠 경기"],"a":0,"e":"홍수는 전 세계 여러 나라에서 가장 빈번하게 발생하는 자연재난 중 하나로 꼽힐 만큼 피해 규모가 크다."},{"q":"황사가 다른 자연재해보다 방심하면 안 되는 이유는 발생 빈도가 높고 어떻다는 점 때문인가?","c":["오래 지속된다는 점","한순간에 끝난다는 점","예측이 쉽다는 점","피해가 없다는 점"],"a":0,"e":"황사는 자주 발생할 뿐 아니라 한번 시작되면 여러 날 지속되는 경우가 많아 꾸준히 대비하는 자세가 필요하다."},{"q":"황사 먼지가 몸에 계속 쌓이면 큰 무리를 주는 신체 부위는?","c":["기관지","손톱","머리카락","눈썹"],"a":0,"e":"미세한 황사 먼지를 계속 들이마시면 기관지에 염증이 생기거나 호흡기 질환이 악화될 수 있다."},{"q":"귀가할 때, 옷에 붙은 황사 먼지를 어떻게 한 뒤 집에 들어가야 하는가?","c":["세심하게 턴 뒤","그대로 입은 채","물에 적신 뒤","뒤집어 입은 뒤"],"a":0,"e":"옷에 묻은 황사 먼지를 집에 들어가기 전에 세심하게 털어내야 먼지가 집 안까지 들어오는 것을 줄일 수 있다."}] },
  "특1": { label: "특별편1. 하임리히법", data: [{"q":"음식물이 목에 걸려 숨을 쉬지 못할 때 실시하는 응급처치법은?","c":["하임리히법","심폐소생술","인공호흡법","지혈법"],"a":0,"e":"하임리히법은 목에 이물질이 걸려 기도가 막혔을 때, 복부를 압박해 이물질을 밖으로 밀어내는 응급처치법이다."},{"q":"하임리히법을 실시할 때, 처치자는 환자의 어느 방향에 서야 하는가?","c":["정면","등쪽","옆쪽","위쪽"],"a":1,"e":"하임리히법을 할 때는 처치자가 환자의 뒤(등쪽)에 서서 양팔로 환자의 몸을 감싸듯이 안아야 한다."},{"q":"하임리히법을 할 때, 두 손은 환자의 명치와 어디 사이에 두어야 하는가?","c":["가슴","허리","배꼽","골반"],"a":2,"e":"주먹을 쥔 손은 환자의 명치와 배꼽 사이, 즉 윗배 중앙에 위치시켜야 이물질을 효과적으로 밀어낼 수 있다."},{"q":"하임리히법을 실시할 때, 처치자의 다리는 어느 정도 벌려야 안정적인 자세가 되는가?","c":["모으고 서기","최대한 넓게","한쪽 다리만 앞으로","어깨너비 정도"],"a":3,"e":"처치자는 다리를 어깨너비 정도로 벌리고 무릎을 살짝 굽혀야 힘을 효과적으로 전달하면서도 안정적인 자세를 유지할 수 있다."},{"q":"하임리히법을 하는 도중 환자가 아프다고 해도 절대 하면 안 되는 행동은?","c":["압박을 약하게 하기","119에 신고하기","계속 압박하기","자세를 바꾸기"],"a":0,"e":"환자가 아파해도 이물질이 나올 때까지는 압박을 약하게 해서는 안 되며, 최대한 강한 힘으로 계속 시도해야 한다."},{"q":"하임리히법을 할 때, 처치자는 팔을 환자의 어느 부위 안쪽으로 넣어야 하는가?","c":["목 뒤","양 겨드랑이","허리 아래","무릎 사이"],"a":1,"e":"처치자는 환자의 뒤에서 양팔을 환자의 양 겨드랑이 안쪽으로 넣어 몸을 감싸듯이 잡아야 한다."},{"q":"하임리히법에서 주먹을 쥘 때, 환자의 몸에 먼저 닿아야 하는 손가락은?","c":["검지","새끼손가락","엄지","중지"],"a":2,"e":"한쪽 손은 엄지손가락이 먼저 환자의 명치와 배꼽 사이에 닿도록 주먹을 쥐고 압박 위치를 잡아야 한다."},{"q":"주먹을 쥔 손 위에 다른 손을 얹은 뒤, 환자는 어떻게 감싸듯 잡아야 하는가?","c":["한 팔로","손목만으로","손가락 끝으로","양팔로"],"a":3,"e":"다른 손은 주먹 쥔 손 위에 얹고, 양팔로 환자의 몸통 전체를 감싸듯이 잡은 뒤 힘껏 안쪽 위로 당겨 압박한다."},{"q":"하임리히법을 안정적으로 실시하기 위해 처치자의 무릎은 어떻게 해야 하는가?","c":["살짝 굽히기","곧게 펴기","최대한 굽히기","한쪽만 굽히기"],"a":0,"e":"무릎을 살짝 굽히면 무게중심이 낮아져 환자를 지탱하기 쉽고, 강한 힘을 실어 압박하기에도 안정적인 자세가 된다."},{"q":"하임리히법을 할 때, 환자의 상체는 똑바로 세우기보다 어떤 자세가 좋은가?","c":["뒤로 젖힌 자세","앞으로 기울인 자세","옆으로 기울인 자세","완전히 눕힌 자세"],"a":1,"e":"환자의 상체를 살짝 앞으로 기울이면 이물질이 중력의 도움을 받아 입 밖으로 더 잘 배출될 수 있다."},{"q":"하임리히법으로 명치 끝을 주먹으로 밀어올릴 때 필요한 힘의 세기는?","c":["약한 힘","보통 힘","최대의 힘","힘을 주지 않아도 됨"],"a":2,"e":"이물질을 확실히 밀어내기 위해서는 주저하지 말고 최대의 힘으로 빠르고 강하게 위쪽으로 밀어올려야 한다."},{"q":"하임리히법에서 압박을 가해야 하는 배 부위 전체를 무엇이라 부르는가?","c":["흉부","골반부","등부","복부"],"a":3,"e":"하임리히법은 복부(배)를 순간적으로 강하게 압박해 횡격막을 밀어올림으로써 기도의 이물질을 배출시키는 방법이다."},{"q":"하임리히법을 하는 도중 환자가 아프다고 말해도 계속해야 하는 이유가 되는 상황은?","c":["숨을 못 쉬는 위급 상황이기 때문","환자가 진정될 때까지","보호자가 원해서","시간을 채우기 위해"],"a":0,"e":"이물질이 기도를 막아 숨을 못 쉬는 것은 생명이 위급한 상황이므로, 통증보다 생명을 구하는 것이 우선이라 계속 시도해야 한다."}] },
  "특2": { label: "특별편2. 아파트 화재 대피", data: [{"q":"아파트 화재의 가장 흔한 원인은 무엇을 하는 중에 가장 많이 발생하는가?","c":["음식물 조리","독서","청소","세탁"],"a":0,"e":"아파트 화재는 음식을 조리하는 중에 가장 많이 발생하므로 조리 중에는 자리를 비우지 않는 것이 중요하다."},{"q":"아파트 화재 발생 시, 불이 크게 번지지 않도록 초기에 사용하는 대표적인 도구는?","c":["소화기","청소기","선풍기","가습기"],"a":0,"e":"화재 초기에 소화기를 사용하면 불이 커지기 전에 진화할 수 있어 각 세대에 소화기를 비치해 두는 것이 중요하다."},{"q":"아파트 화재 사망자 중 39.1%가 어떤 상황에서 사망했는가?","c":["대피 중","취침 중","외출 중","조리 중"],"a":0,"e":"아파트 화재 사망자의 상당수가 잘못된 방법으로 대피하다가 연기를 마시는 등의 이유로 목숨을 잃었으므로 올바른 대피 요령을 알아두는 것이 중요하다."},{"q":"화재 시 절대 이용하면 안 되는, 연기가 집중되고 정전으로 갇힐 위험이 있는 이동 수단은?","c":["엘리베이터","계단","비상 사다리","완강기"],"a":0,"e":"화재가 나면 엘리베이터는 연기가 몰릴 수 있고 정전으로 갇힐 위험이 있으므로 반드시 계단을 이용해 대피해야 한다."},{"q":"대피할 때 연기를 마시지 않도록 입과 코를 가리는 데 사용하는 것은?","c":["물에 적신 수건","마른 신문지","비닐봉지","부채"],"a":0,"e":"물에 적신 수건으로 코와 입을 막으면 연기 속 유해 물질을 어느 정도 걸러내어 마시는 양을 줄일 수 있다."},{"q":"아파트에서 불이 나면, 불이 번지는 범위는 대부분 불이 난 곳과 어디로 한정되는가?","c":["같은 세대(불이 난 측)","건물 전체","옆 동 전체","지하 주차장 전체"],"a":0,"e":"아파트는 세대 간 방화 구조가 되어 있어 불이 난 세대에서 다른 세대로 곧바로 불이 번지는 경우는 드물고, 대부분 같은 세대 안에 한정된다."},{"q":"화재가 다른 세대에서 났고 우리 집에 연기·화염이 들어오지 않을 때, 가장 먼저 해야 할 행동은?","c":["집 문을 닫기","창문을 활짝 열기","무조건 계단으로 뛰어가기","엘리베이터를 부르기"],"a":0,"e":"다른 세대의 화재로 우리 집에 아직 연기가 들어오지 않았다면, 출입문을 닫아 연기 유입을 막고 상황을 지켜보는 것이 안전할 수 있다."},{"q":"집에 머무르며 상황을 살필 때 계속 들어야 하는 것은?","c":["안내방송","음악 방송","친구의 전화","텔레비전 드라마"],"a":0,"e":"아파트 화재 시 관리사무소나 소방대의 안내방송에는 대피 여부와 방법에 대한 중요한 정보가 담겨 있으므로 계속 귀 기울여야 한다."},{"q":"아파트 화재로 인한 사망 대부분의 직접적인 원인은 무엇인가?","c":["연기 흡입","건물 붕괴","폭발","감전"],"a":0,"e":"화재 사망 사고의 대부분은 불에 타서가 아니라 유독 연기를 마셔 질식하는 것이 직접적인 원인이므로 자세를 낮추고 대피하는 것이 중요하다."},{"q":"최상층에 살 경우, 옥상으로 대피하기 전에 반드시 확인해야 하는 것은?","c":["옥상 출입문이 열리는지","엘리베이터 위치","이웃집 초인종","우편함 번호"],"a":0,"e":"옥상 출입문이 잠겨 있으면 대피할 수 없으므로, 최상층 주민은 평소 옥상 출입문 상태를 미리 확인해 두어야 한다."},{"q":"자기 집에서 대피할 때, 나가면서 반드시 닫아야 하는 것은?","c":["출입문","냉장고 문","베란다 창문만","신발장 문"],"a":0,"e":"대피하며 출입문을 닫으면 불과 연기가 복도나 계단으로 번지는 것을 늦출 수 있어 다른 사람들의 대피에도 도움이 된다."},{"q":"안전하게 대피한 뒤, 다른 사람에게 화재를 알리기 위해 눌러야 하는 것은?","c":["비상벨","초인종","엘리베이터 버튼","우편함"],"a":0,"e":"복도나 계단에 있는 비상벨을 누르면 건물 전체에 화재 사실을 빠르게 알려 다른 주민들도 대피할 수 있게 된다."},{"q":"2005년 이후 지어진 4층 이상 아파트 발코니에 있는, 방화문으로 된 대피 장소를 무엇이라 하는가?","c":["대피 공간","다용도실","보일러실","펜트리"],"a":0,"e":"대피 공간은 화재 시 대피하지 못했을 때 잠시 몸을 피할 수 있도록 방화문과 내화 구조로 만들어진 공간이다."},{"q":"대피 공간은 열·연기·불꽃으로부터 최소 얼마 동안 보호해 주는가?","c":["30분 이상","5분 이상","3시간 이상","1분 이상"],"a":0,"e":"대피 공간은 화재의 열과 연기, 불꽃을 최소 30분 이상 막아주도록 설계되어 있어 그 시간 동안 구조를 기다릴 수 있다."},{"q":"대피 공간에 절대 하면 안 되는 행동은?","c":["물건을 쌓아두는 것","방화문을 닫아두는 것","비워두는 것","환기하는 것"],"a":0,"e":"대피 공간에 물건을 쌓아두면 정작 필요할 때 들어가거나 문을 닫지 못해 대피 공간의 역할을 하지 못하게 되므로 절대 물건을 두면 안 된다."},{"q":"2005년 이전 지어진 아파트의 발코니 사이에 있는, 쉽게 부술 수 있는 얇은 경계벽을 무엇이라 하는가?","c":["경량칸막이","방화문","내력벽","방음벽"],"a":0,"e":"경량칸막이는 옆 세대로 대피할 수 있도록 쉽게 부술 수 있게 만든 얇은 벽으로, 대피 공간이 없는 오래된 아파트에 설치되어 있다."},{"q":"어르신이나 신체적 약자가 있는 집에서 경량칸막이를 부술 때 사용하면 좋은 도구는?","c":["망치(파괴도구)","젓가락","빗자루","우산"],"a":0,"e":"경량칸막이는 손이나 발로도 부술 수 있지만, 힘이 약한 어르신이나 신체적 약자는 망치 같은 파괴도구를 미리 준비해 두면 더 쉽게 부술 수 있다."},{"q":"발코니를 통해 위아래 세대를 연결하는, 간이사다리가 있는 피난 설비를 무엇이라 하는가?","c":["하향식 피난구","완강기","구조대","경량칸막이"],"a":0,"e":"하향식 피난구는 발코니 바닥에 설치된 덮개를 열면 간이사다리가 내려와 아래층 세대로 대피할 수 있게 해주는 설비이다."},{"q":"대피 공간이 없을 때, 문을 닫은 뒤 틈새를 막는 데 사용하는 것은?","c":["젖은 수건","마른 신문지","비닐봉지","플라스틱 판"],"a":0,"e":"문을 닫은 뒤 틈새로 연기가 들어오지 않도록 물에 적신 수건으로 막으면 연기 유입을 줄이는 데 도움이 된다."},{"q":"아파트마다 구조가 다르기 때문에, 화재에 대비해 미리 알아두어야 하는 가장 기본적인 것은?","c":["대피 경로와 방법","관리비 납부 방법","택배함 위치","엘리베이터 정기점검일"],"a":0,"e":"아파트마다 계단, 대피 공간, 하향식 피난구 등의 구조가 다르므로 평소에 우리 집의 대피 경로와 방법을 미리 알아두어야 한다."}] },
  "특3": { label: "특별편3. 승강기 사고 대처", data: [{"q":"정전으로 승강기가 갑자기 멈췄을 때, 자동으로 켜지는 조명은?","c":["비상 조명","형광등","손전등","가로등"],"a":0,"e":"대부분의 승강기에는 정전 시 자동으로 켜지는 비상 조명이 설치되어 있어, 갇힌 상태에서도 완전한 어둠 속에 있지 않도록 해준다."},{"q":"승강기가 갑자기 멈췄을 때, 가장 먼저 유지해야 하는 마음가짐은?","c":["빠른 판단력","침착함","경계심","용맹함"],"a":1,"e":"승강기가 멈추면 당황하기 쉽지만, 침착함을 유지해야 비상벨이나 통화 장치 등을 이용해 올바르게 상황에 대처할 수 있다."},{"q":"승강기는 완전히 밀폐된 공간이 아니기 때문에 걱정하지 않아도 되는 위험은?","c":["정전","추락","질식","고립"],"a":2,"e":"승강기 안에는 환기구가 있어 공기가 어느 정도 통하기 때문에, 완전히 밀폐되어 숨이 막히는 질식 위험은 크지 않다."},{"q":"승강기에 갇혔을 때, 안전 장치 덕분에 크게 걱정하지 않아도 되는 사고는?","c":["화재","정전","고립","추락"],"a":3,"e":"승강기에는 로프가 끊어져도 작동하는 비상 정지 장치 등 여러 안전 장치가 있어, 갑자기 바닥으로 떨어지는 추락 사고는 거의 일어나지 않는다."},{"q":"승강기에 갇혔을 때, 낮은 자세를 유지하며 꼭 잡아야 하는 것은?","c":["안전 손잡이","비상벨","조명 스위치","환풍구"],"a":0,"e":"갑작스러운 흔들림에 넘어지지 않도록, 승강기 내부의 안전 손잡이를 꼭 잡고 낮은 자세를 유지하는 것이 좋다."},{"q":"승강기에 갇힌 사실을 가장 먼저 알려야 하는 곳은?","c":["경찰서","관리실","친구","이웃집"],"a":1,"e":"승강기 안 비상벨을 눌러 건물 관리실에 먼저 연락하면, 관리실에서 상황을 파악하고 신속하게 조치를 취할 수 있다."},{"q":"관리실과 연락이 되지 않을 때, 승강기의 비상 통화 장치가 자동으로 연결되는 곳은?","c":["경찰서 민원실","가스 안전 공사","승강기 유지 관리 업체나 119 구조대","기상청"],"a":2,"e":"관리실 응답이 없으면 비상 통화 장치가 자동으로 승강기 유지 관리 업체나 119 구조대로 연결되어 도움을 받을 수 있다."},{"q":"통화 장치가 작동하지 않을 때, 휴대전화로 연락할 수 있는 것은?","c":["일기 예보","119 안전 지도","가스 안전 앱","비상 연락망"],"a":3,"e":"승강기 안에 붙어 있는 비상 연락망을 통해 휴대전화로 직접 연락하면 도움을 요청할 수 있다."},{"q":"휴대전화로 구조 요청을 할 때, 위치 파악을 쉽게 해주는 승강기에 부착된 정보는?","c":["승강기 고유 번호","제조 회사 이름","설치 날짜","무게 제한"],"a":0,"e":"승강기마다 부착된 고유 번호를 알려주면, 구조대가 정확한 위치의 승강기를 빠르게 찾아 출동할 수 있다."},{"q":"휴대전화도 통화 장치도 사용할 수 없을 때, 갇혀 있음을 알리기 위해 해야 하는 행동은?","c":["조용히 기다리기","승강기 벽 두드리기","문을 세게 발로 차기","불을 끄고 자기"],"a":1,"e":"연락할 방법이 전혀 없을 때는 승강기 벽을 두드려 소리를 내어, 밖에 있는 사람들에게 갇혀 있다는 사실을 알려야 한다."},{"q":"승강기에 갇혔을 때 절대 하면 안 되는 행동은?","c":["비상벨을 누르는 것","안전 손잡이를 잡는 것","당황해서 안에서 뛰어다니는 것","침착하게 기다리는 것"],"a":2,"e":"좁은 승강기 안에서 당황해 뛰어다니면 넘어지거나 다칠 수 있으므로, 침착하게 자리를 지키고 있어야 한다."},{"q":"승강기에 갇혔을 때 절대 하면 안 되는 행동은?","c":["비상 연락망을 확인하는 것","벽을 두드리는 것","도움을 요청하는 것","문에 기대거나 문을 미는 것"],"a":3,"e":"문에 기대거나 밀면 갑자기 움직일 경우 끼이거나 다칠 위험이 있으므로 문 쪽에 기대지 않아야 한다."},{"q":"승강기에 갇혔을 때 절대 하면 안 되는 행동은?","c":["무리하게 문을 강제로 열려고 하는 것","관리실에 연락하는 것","벽을 두드려 위치를 알리는 것","안전 손잡이를 잡는 것"],"a":0,"e":"문을 억지로 열려고 하면 승강기가 갑자기 움직이거나 틈에 몸이 끼는 등 큰 사고로 이어질 수 있으므로 절대 시도하면 안 된다."},{"q":"승강기 탑승 중 화재가 발생했다는 것을 알았을 때, 가장 먼저 눌러야 하는 것은?","c":["맨 위층 버튼","모든 층 버튼","닫힘 버튼","경보 정지 버튼"],"a":1,"e":"화재를 느끼면 가장 가까운 층에서 빨리 내리기 위해, 승강기 안의 모든 층 버튼을 눌러 가장 먼저 도착하는 층에서 내려야 한다."},{"q":"화재 발생 시 승강기에서 가장 먼저 도착하는 층에 내린 뒤, 이용해야 하는 대피 통로는?","c":["에스컬레이터","다른 승강기","계단","비상용 승강기"],"a":2,"e":"화재 시에는 승강기가 언제 멈추거나 오작동할지 알 수 없으므로, 내린 층에서부터는 반드시 계단을 이용해 대피해야 한다."}] },
  "특4": { label: "특별편4. 캠핑장 안전수칙", data: [{"q":"텐트를 칠 때 침수 위험이 있어 피해야 하는 지대는?","c":["낮은 지대","평평한 잔디밭","높은 언덕 아래 평지","캠핑장 지정 구역"],"a":0,"e":"낮은 지대는 비가 많이 오면 물이 고이거나 갑자기 불어나 텐트가 물에 잠길 위험이 있으므로 피해야 한다."},{"q":"텐트를 칠 때 갑자기 물이 불어날 수 있어 피해야 하는 곳은?","c":["물가 주변","숲속 그늘","평지 중앙","입구 근처"],"a":0,"e":"계곡이나 하천 등 물가 주변은 비가 오면 물이 순식간에 불어날 수 있어 텐트를 치기에 위험한 장소이다."},{"q":"캠핑장에서 화재를 예방하기 위해 불 피우는 자리 주변 바닥에 미리 뿌려두면 좋은 것은?","c":["물","기름","모래만","낙엽"],"a":0,"e":"불을 피우는 자리 주변 바닥에 미리 물을 뿌려두면 불씨가 옮겨붙는 것을 막는 데 도움이 된다."},{"q":"밀폐된 텐트 안에서 난로를 사용하면 안 되는 이유가 되는 중독 위험은?","c":["일산화탄소 중독","산소 과다","저체온증","탈수 증상"],"a":0,"e":"밀폐된 텐트 안에서 난로를 켜면 산소가 부족해지면서 일산화탄소가 발생해 중독 사고로 이어질 수 있어 매우 위험하다."},{"q":"캠핑을 갈 때 기상 변화를 확인하기 위해 주기적으로 살펴야 하는 것은?","c":["일기예보","캠핑장 이용 요금","주변 맛집 정보","다른 사람의 후기"],"a":0,"e":"캠핑 중에는 날씨가 갑자기 나빠질 수 있으므로 일기예보를 주기적으로 확인해 미리 대비해야 한다."},{"q":"텐트를 칠 때 산사태 위험이 있어 피해야 하는 지형은 언덕이나 어떤 곳인가?","c":["절벽(안벽)","넓은 공터","포장된 도로","잔디 광장"],"a":0,"e":"언덕이나 절벽 근처는 비가 많이 오면 흙이 무너지는 산사태 위험이 있어 텐트를 치기에 적절하지 않다."},{"q":"텐트가 날아가지 않도록, 스토퍼와 함께 사용해 줄을 고정하는 도구는?","c":["팩","우산","랜턴","돗자리"],"a":0,"e":"팩은 텐트 줄을 땅에 단단히 고정하는 도구로, 스토퍼와 함께 사용하면 강한 바람에도 텐트가 날아가지 않도록 도와준다."},{"q":"밤에 텐트 줄에 걸려 넘어지지 않도록 부착하는 것은?","c":["야광줄(야광테이프)","방충망","돗자리","텐트 지붕"],"a":0,"e":"어두운 밤에는 텐트 줄이 잘 보이지 않아 걸려 넘어지기 쉬우므로 야광줄이나 야광테이프를 붙여 잘 보이게 해야 한다."},{"q":"음식을 조리할 때, 화기와 텐트 사이에 유지해야 하는 것은?","c":["안전거리","같은 높이","같은 방향","최소한의 거리"],"a":0,"e":"화기와 텐트가 너무 가까우면 불이 옮겨붙을 위험이 있으므로 충분한 안전거리를 유지하고 조리해야 한다."},{"q":"불을 다 사용한 뒤, 남은 불씨가 없는지 확인하고 물이나 흙으로 하는 정리를 무엇이라 하는가?","c":["잔불 정리","텐트 정리","쓰레기 분리수거","장비 점검"],"a":0,"e":"불을 다 사용한 후에는 남은 불씨가 바람에 날려 다시 불이 붙지 않도록 물이나 흙을 덮어 완전히 끄는 잔불 정리를 반드시 해야 한다."},{"q":"가스버너보다 큰 불판을 사용하면 안 되는 이유가 되는 사고는?","c":["폭발 사고","저체온증","일사병","벌레 물림"],"a":0,"e":"가스버너의 화력에 비해 너무 큰 불판을 사용하면 열이 고르게 전달되지 않고 가스통이 과열되어 폭발 사고로 이어질 수 있다."},{"q":"캠핑장에서 불을 피울 때, 아무 곳이 아니라 반드시 어디에서만 피워야 하는가?","c":["지정된 장소","텐트 바로 옆","나무 아래","바람이 많이 부는 곳"],"a":0,"e":"불은 화재 예방을 위해 캠핑장에서 정해 놓은 지정된 장소에서만 피워야 하며, 다른 곳에서 함부로 불을 피우면 안 된다."},{"q":"난로 같은 전열기구를 설치할 때, 넘어지지 않도록 어떤 곳에 두어야 하는가?","c":["평평한 곳","경사진 곳","텐트 안쪽 구석","이불 위"],"a":0,"e":"전열기구를 경사지거나 불안정한 곳에 두면 넘어져 화재로 이어질 수 있으므로 반드시 평평한 곳에 안정적으로 두어야 한다."},{"q":"어두운 곳에서 전열기구나 물건에 발이 채이지 않도록 붙이는 것은?","c":["야광 밴드","방수 테이프","고무줄","고정핀"],"a":0,"e":"야광 밴드를 물건에 붙여 두면 어두운 밤에도 잘 보여 발에 걸려 넘어지거나 다치는 사고를 예방할 수 있다."},{"q":"일산화탄소 중독을 막기 위해 텐트 안에 설치해야 하는 장치는?","c":["일산화탄소 감지 경보기","연기 감지기만","온도계","제습기"],"a":0,"e":"일산화탄소는 냄새와 색이 없어 사람이 스스로 알아차리기 어려우므로, 텐트 안에 일산화탄소 감지 경보기를 설치해 두는 것이 안전하다."},{"q":"밀폐된 텐트를 주기적으로 어떻게 해주어야 일산화탄소 중독을 막을 수 있는가?","c":["환기","난방","소독","조명 조절"],"a":0,"e":"텐트를 주기적으로 환기시켜 신선한 공기가 들어오게 하면 일산화탄소가 텐트 안에 쌓이는 것을 막을 수 있다."},{"q":"갑자기 비가 많이 오면 낮은 지대에 친 텐트에서 생길 수 있는 문제는?","c":["침수","일사병","정전기","벌레 발생"],"a":0,"e":"낮은 지대에 텐트를 쳤을 경우 비가 많이 내리면 순식간에 물이 차올라 텐트가 침수될 수 있어 위험하다."},{"q":"기상이 갑자기 나빠지면, 캠핑장을 정리하고 어떤 지형으로 대피해야 하는가?","c":["고지대","계곡 안쪽","하천 근처","텐트 안"],"a":0,"e":"기상이 갑자기 악화되어 물이 불어날 위험이 있으면 낮은 곳을 벗어나 안전한 고지대로 신속히 대피해야 한다."},{"q":"갑작스러운 기온 변화로 인해 떨어질 수 있는 몸의 상태는?","c":["체온","시력","청력","키"],"a":0,"e":"캠핑 중 갑작스러운 기온 변화에 대비하지 못하면 체온이 떨어져 저체온증 같은 위험한 상황이 생길 수 있다."}] }
};

function showCategoryScreen() {
  clearInterval(timerInterval);
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('select-screen').classList.add('hidden');
  document.getElementById('gogo-select-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('category-screen').classList.remove('hidden');
}

function showGogoSelectScreen() {
  currentMode = 'gogo';
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('category-screen').classList.add('hidden');
  document.getElementById('select-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('gogo-select-screen').classList.remove('hidden');
  const grid = document.getElementById('gogo-topic-grid');
  grid.innerHTML = '';
  Object.keys(GOGO).forEach(key => {
    const box = document.createElement('div');
    box.className = 'round-box';
    box.onclick = () => startGogoTopic(key);
    box.innerHTML = `<div class="r-num" style="font-size:1.05rem;line-height:1.35;">${GOGO[key].label}</div><div class="r-name">총 ${GOGO[key].data.length}문제</div>`;
    grid.appendChild(box);
  });
}

function startGogoTopic(key) {
  currentMode = 'gogo';
  currentRoundKey = key;
  DATA = GOGO[key].data.slice();
  idx = 0; wrongList = []; answered = false; isRetryRound = false; finishTime = 0;
  document.getElementById('gogo-select-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  document.getElementById('round-pill').textContent = GOGO[key].label;
  document.getElementById('q-total').textContent = DATA.length;
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
  showQuestion();
}

</script>
