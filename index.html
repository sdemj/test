<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>불조심 퀴즈게임 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; min-height: 100vh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Jua', 'Malgun Gothic', sans-serif;
    background: radial-gradient(circle at top left, rgba(255,196,110,0.35) 0%, transparent 30%),
                radial-gradient(circle at top right, rgba(255,140,170,0.35) 0%, transparent 32%),
                linear-gradient(180deg, #ff8a65 0%, #ff5e62 45%, #d84343 100%);
    color: #3b2a2a; padding: 24px 12px;
  }
  .hidden { display: none !important; }
  .screen { width: 100%; display: flex; align-items: center; justify-content: center; }
  .card {
    background: #fffaf3; border: 5px solid #3b2a2a; border-radius: 28px;
    box-shadow: 0 14px 0 rgba(59,42,42,0.25), 0 24px 40px rgba(0,0,0,0.25);
    padding: 40px 46px; box-sizing: border-box; text-align: center;
  }
  .big-title { font-size: 2.4rem; text-align: center; color: #ffdd57;
    -webkit-text-stroke: 5px #b23a2c; paint-order: stroke fill;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,0.2)); margin: 0 0 10px; }
  .subtitle { text-align:center; font-size: 1.05rem; color:#7a5c3e; margin-bottom: 26px; }
  .btn {
    font-family: 'Jua', sans-serif; border: 4px solid #3b2a2a; border-radius: 9999px;
    padding: 13px 34px; font-size: 1.15rem; cursor: pointer; color: #3b2a2a;
    box-shadow: 0 6px 0 rgba(59,42,42,0.4); transition: all 0.15s ease;
  }
  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(59,42,42,0.4); }
  .btn-primary { background: linear-gradient(180deg,#ffe08a,#ffb347); }
  .btn-secondary { background: #ffffff; }

  /* 회차 선택 화면 */
  #select-screen .card { width: 640px; max-width: 94vw; }
  .round-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:18px; margin-top: 12px; }
  .round-box {
    background: linear-gradient(160deg,#fff6e8,#ffe3c2); border:4px solid #3b2a2a; border-radius:20px;
    padding: 22px 14px; text-align:center; cursor:pointer; box-shadow: 0 6px 0 rgba(59,42,42,0.35);
    transition: all 0.15s ease; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .round-box:hover { transform: translateY(-4px); border-color:#ff5e62; }
  .round-box .r-num { font-size:1.8rem; color:#d84343; }
  .round-box .r-name { font-size:0.92rem; color:#5a4230; line-height:1.3; }

  #game-screen { width: 100%; }
  .game-wrapper { width: 760px; max-width: 96vw; margin: 0 auto; }
  .game-card {
    background:#fffaf3; border:5px solid #3b2a2a; border-radius:28px;
    box-shadow:0 14px 0 rgba(59,42,42,0.25), 0 24px 40px rgba(0,0,0,0.25); overflow:hidden;
  }
  .game-header {
    background:#ffd9a0; border-bottom:4px solid #3b2a2a; padding:14px 22px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap: wrap; gap: 8px;
  }
  .info-pill { background:rgba(255,255,255,0.75); border:3px solid #3b2a2a; border-radius:14px; padding:6px 14px; font-size:0.95rem; }
  .game-body { padding: 26px 30px 34px; }
  .question-box {
    background:#ffe3c2; border:4px solid #3b2a2a; border-radius:20px; padding:22px 24px; margin-bottom:20px;
    font-size:1.18rem; text-align:center; line-height:1.55; color:#3b2a2a;
  }
  .choices-grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .choice-btn {
    font-family: 'Jua', sans-serif; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; justify-content:center;
    text-align:center; min-height: 64px; padding: 10px 14px; border-radius:16px; border:4px solid #3b2a2a;
    background: linear-gradient(180deg,#fff3d6,#ffdd8a); font-size:1.02rem; color:#3b2a2a;
    box-shadow: 0 6px 0 #d99a3e; transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .choice-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { background: linear-gradient(180deg,#b9f0b0,#7ed673); box-shadow: 0 6px 0 #4b9e42; }
  .choice-btn.wrong { background: linear-gradient(180deg,#f5b3b3,#e97676); box-shadow: 0 6px 0 #b23a3a; }

  .explain-box {
    margin-top: 22px; background: #eaf7ea; border: 3px solid #4b9e42; border-radius: 18px; padding: 18px 22px;
  }
  .explain-title { color:#2e7d32; font-weight:bold; font-size:1.1rem; margin-bottom:8px; border-bottom: 2px solid #cfe8cf; padding-bottom:6px; }
  #explain-answer { font-weight:bold; margin-bottom:8px; }
  #explain-text { line-height:1.6; color:#333; margin-bottom: 16px; font-size: 0.98rem; }

  #result-screen .card { min-width: 340px; width: 640px; max-width: 94vw; }
  .result-title { font-size: 1.9rem; color:#d84343; margin:10px 0 20px; }
  .result-stats { display:flex; gap:12px; width:100%; margin-bottom: 24px; }
  .result-stats > div { flex:1; background:#ffe3c2; border:3px solid #3b2a2a; border-radius:14px; padding:14px 6px; }
  .result-stats .label { font-size:0.82rem; color:#7a5c3e; }
  .result-stats .value { font-size:1.25rem; color:#3b2a2a; margin-top: 4px; }
  #wrong-wrap { text-align: left; width: 100%; margin-bottom: 20px; }
  .wrong-title { font-weight: bold; color: #b23a2c; margin-bottom: 10px; text-align:center; }
  #wrong-list { max-height: 260px; overflow-y: auto; background: #fff3ec; border: 3px solid #3b2a2a; border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; }
  .wrong-item { padding: 8px 0; border-bottom: 1px dashed #e0c9b8; font-size: 0.92rem; line-height: 1.5; }
  .wrong-item:last-child { border-bottom: none; }
  .wrong-item .wq { font-weight: bold; margin-bottom: 3px; }
  .wrong-item .wmine { color: #b23a3a; }
  .wrong-item .wcorrect { color: #2e7d32; }
  .result-btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>

<div id="start-screen" class="screen">
  <div class="card">
    <div class="big-title">🔥 불조심 퀴즈게임 🔥</div>
    <div class="subtitle">「초등학생용 불조심 길라잡이」 기반<br>4지선다 퀴즈 · 회차를 골라 풀어보세요</div>
    <button class="btn btn-primary" onclick="showCategoryScreen()">시작하기</button>
  </div>
</div>

<div id="category-screen" class="screen hidden">
  <div class="card" style="width:640px;max-width:94vw;">
    <div class="big-title" style="font-size:1.9rem;">무엇을 풀어볼까요?</div>
    <div class="round-grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="round-box" onclick="showGogoSelectScreen()">
        <div class="r-num">🎯 고고전진</div>
        <div class="r-name">주제별 힌트 맞히기 게임</div>
      </div>
      <div class="round-box" onclick="showSelectScreen()">
        <div class="r-num">📝 연습문제</div>
        <div class="r-name">1~12회 4지선다 퀴즈</div>
      </div>
    </div>
  </div>
</div>

<div id="select-screen" class="screen hidden">
  <div class="card">
    <div class="big-title" style="font-size:1.9rem;">회차를 선택하세요</div>
    <div class="round-grid" id="round-grid"></div>
    <button class="btn btn-secondary" style="margin-top:20px;" onclick="showCategoryScreen()">← 뒤로</button>
  </div>
</div>

<div id="gogo-select-screen" class="screen hidden">
  <div class="card" style="width:820px;max-width:96vw;">
    <div class="big-title" style="font-size:1.9rem;">고고전진 주제를 선택하세요</div>
    <div class="round-grid" id="gogo-topic-grid" style="grid-template-columns:repeat(3,1fr);"></div>
    <button class="btn btn-secondary" style="margin-top:20px;" onclick="showCategoryScreen()">← 뒤로</button>
  </div>
</div>

<div id="game-screen" class="screen hidden">
  <div class="game-wrapper">
    <div class="game-card">
      <div class="game-header">
        <div class="info-pill" id="round-pill">1회</div>
        <div class="info-pill">문제 <span id="q-index">1</span>/<span id="q-total">25</span></div>
        <div class="info-pill">⏱ <span id="timer">00:00</span></div>
      </div>
      <div class="game-body">
        <div class="question-box" id="question-box"></div>
        <div class="choices-grid" id="choices-grid"></div>
        <div class="explain-box hidden" id="explain-box">
          <div class="explain-title">정답 및 해설</div>
          <div id="explain-answer"></div>
          <div id="explain-text"></div>
          <div style="text-align:center;"><button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">다음 문제</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="result-screen" class="screen hidden">
  <div class="card">
    <div style="font-size:2.6rem;">🏆</div>
    <div class="result-title" id="result-title">퀴즈 완료!</div>
    <div class="result-stats">
      <div><div class="label">걸린 시간</div><div class="value" id="result-time">00:00</div></div>
      <div><div class="label">마친 시간</div><div class="value" id="result-finish">-</div></div>
    </div>
    <div id="wrong-wrap" class="hidden">
      <div class="wrong-title">틀린 문제 (<span id="wrong-count">0</span>개)</div>
      <div id="wrong-list"></div>
      <button class="btn btn-primary" id="retry-wrong-btn" onclick="retryWrong()">틀린 문제만 다시 풀기</button>
    </div>
    <div class="result-btns">
      <button class="btn btn-secondary" onclick="restartRound()">이 회차 처음부터 다시</button>
      <button class="btn btn-secondary" onclick="backToSelect()">다른 회차 선택하기</button>
    </div>
  </div>
</div>

<script>
const ROUNDS = {
  "1": { label: "1회", data: [
{q:"불이 일어나기 위해 반드시 필요한 세 가지 요소가 아닌 것은?", c:["불꽃(점화원)","산소","이산화탄소","가연물(연료)"], a:2, e:"불의 3요소는 불꽃(점화원)·산소·가연물(연료)이다. 이산화탄소는 오히려 산소를 차단하는 질식소화에 쓰이는 기체다."},
{q:"다음 중 '가연물'에 대한 설명으로 올바른 것은?", c:["불을 붙일 수 있는 모든 것","불에 타기 쉬운 물질이나 물건","불이 난 뒤 남는 재","물을 뿌려 불을 끄는 재료"], a:1, e:"가연물이란 불에 타기 쉬운 물질이나 물건을 말한다. '불을 붙일 수 있는 모든 것'은 점화원의 정의다."},
{q:"최근 5년간(2021~2025년) 화재원인 통계에서 가장 높은 비율을 차지하는 원인은?", c:["전기적요인","부주의","기계적요인","방화"], a:1, e:"소방청 국가화재정보센터 통계(2021~2025)에 따르면 부주의로 인한 화재가 46.5%로 가장 많다."},
{q:"최근 5년간 화재원인 통계에서 두 번째로 높은 비율을 차지하는 원인은?", c:["부주의","전기적요인","미상","화학적요인"], a:1, e:"전기적요인이 27.0%로 2위를 차지한다. 뒤이어 미상(8.5%), 기계적요인(10.1%) 순이다."},
{q:"하나의 콘센트에 여러 전기기구를 꽂아 적정 용량을 초과하는 현상을 무엇이라 하는가?", c:["누전","과부하","정전","감전"], a:1, e:"과부하는 하나의 콘센트에 여러 전기기구를 꽂아 적정용량을 초과하는 현상으로, 지나친 열이 발생해 불이 날 수 있다."},
{q:"전기가 전선이나 전기기구에서 새어 나가는 현상을 무엇이라 하는가?", c:["누전","과부하","과열","스파크"], a:0, e:"누전은 전기가 전선이나 전기기구 등에서 새는 것으로, 수도관에서 물이 새는 것에 비유할 수 있다. 감전되거나 불이 날 수 있다."},
{q:"전기기구를 살 때 반드시 확인해야 하는 국가 인증 표시는?", c:["KC마크","친환경마크","품질보증서","제조번호"], a:0, e:"전기기구는 ㉿ 마크나 'KC' 자가 표시된 국가 인증 제품을 사용해야 한다. 인증받지 않은 제품은 불이 날 위험이 있다."},
{q:"누전차단기는 얼마나 자주 점검해야 하는가?", c:["매주 1회","매월 1회 이상","매년 1회","고장났을 때만"], a:1, e:"누전차단기는 매월 1회 이상 정기적으로 점검해야 한다. 시험용 버튼을 눌러 스위치가 아래로 떨어지는지 확인한다."},
{q:"감전된 사람을 발견했을 때 가장 먼저 해야 할 일은?", c:["직접 손으로 잡아당겨 떼어놓는다","어른들께 알려 도움을 청한다","물을 뿌려 열을 식힌다","무시하고 지나간다"], a:1, e:"감전된 사람을 발견하면 직접 만지지 말고 먼저 어른들께 알려 도움을 청해야 한다."},
{q:"감전된 사람을 전기로부터 떼어놓을 때 안전하게 사용할 수 있는 도구는?", c:["젖은 수건","고무장갑이나 나무 막대","금속 막대","맨손"], a:1, e:"전기 차단이 어려우면 고무장갑이나 나무 막대처럼 전기가 통하지 않는 도구를 이용해 사람을 떼어 놓아야 한다."},
{q:"가정에서 사용하는 가스연료 중 '메탄가스'가 주성분인 것은?", c:["액화석유가스(LPG)","액화천연가스(LNG)","부탄가스","프로판가스"], a:1, e:"액화천연가스(LNG)의 주성분은 메탄가스이며, 도시가스회사가 배관으로 공급하는 도시가스는 주로 LNG이다."},
{q:"공기보다 가벼운 액화천연가스(LNG) 누설경보기는 어디에 설치해야 하는가?", c:["바닥에서 30cm 이내","천장에서 30cm 이내","창문 옆","아무 곳이나"], a:1, e:"LNG는 공기보다 가벼우므로 가스가 위로 모이기 때문에 천장에서 30cm 이내에 경보기를 설치해야 한다."},
{q:"공기보다 무거운 액화석유가스(LPG) 누설경보기는 어디에 설치해야 하는가?", c:["천장에서 30cm 이내","바닥에서 30cm 이내","창문 위","문 앞"], a:1, e:"LPG는 공기보다 무거워 아래로 가라앉으므로 바닥에서 30cm 이내에 경보기를 설치해야 한다."},
{q:"가스가 새는 것을 발견했을 때 절대 하면 안 되는 행동은?", c:["창문과 출입문을 연다","점화스위치와 밸브를 잠근다","전등 스위치를 켜거나 끈다","어른들께 알린다"], a:2, e:"전등, 컴퓨터 등 전기기구의 스위치를 켜거나 끄면 전기불꽃이 생겨 새어나온 가스가 폭발할 위험이 있으므로 절대 만지면 안 된다."},
{q:"유류화재의 특징으로 옳지 않은 것은?", c:["불이 붙기 쉽다","물보다 가벼워 물 위에 뜬다","물을 뿌리면 쉽게 꺼진다","유증기는 공기보다 무겁다"], a:2, e:"유류화재는 물을 뿌려도 불이 잘 꺼지지 않으며, 오히려 기름이 물 위에 떠서 불이 더 번질 수 있다. 소화기를 사용해야 한다."},
{q:"유류화재가 발생했을 때 올바른 대처법은?", c:["물을 뿌린다","소화기를 사용한다","부채질로 끈다","그대로 둔다"], a:1, e:"유류화재는 물로는 끄기 어려우므로 소화기를 사용해야 한다."},
{q:"불장난은 주로 몇 세 어린이들 사이에서 많이 일어난다고 하는가?", c:["1~2세","3~7세","10~12세","13세 이상"], a:1, e:"불장난은 3~7세 사이의 어린이들이 일으키는 경우가 많으므로, 어린 동생이 불장난을 하려 하면 엄하게 타일러야 한다."},
{q:"'방화'에 대한 설명으로 옳지 않은 것은?", c:["나쁜 마음을 먹고 일부러 불을 지르는 것이다","방화범만 처벌받고 도와준 사람은 처벌받지 않는다","보험금을 노리고 불을 지르기도 한다","방화를 준비만 해도 처벌받는다"], a:1, e:"방화범뿐 아니라 방화를 실패한 사람, 준비한 사람, 방화범을 도와준 사람까지 모두 법에 의해 처벌받는다."},
{q:"산불이 우리나라에서 가장 많이 발생하는 계절은?", c:["봄","여름","가을","겨울"], a:0, e:"봄철에는 습도 50% 미만인 날이 다른 계절보다 많아 산불의 약 60% 정도가 봄에 발생한다."},
{q:"산불이 거의 발생하지 않는 습도 조건은?", c:["40% 이하","50% 내외","60% 이상","습도와 관계없음"], a:2, e:"습도가 60% 이상이면 산불이 거의 발생하지 않고, 40% 이하이면 급속히 연소할 위험이 크다."},
{q:"산불에 영향을 미치는 3가지 요소가 아닌 것은?", c:["연료","지형","기상조건","인구밀도"], a:3, e:"산불에 영향을 미치는 3요소는 연료, 지형, 기상조건(강우량·바람·습도·온도)이다."},
{q:"불을 끄는 방법 중, 산소를 차단하여 불을 끄는 방법은?", c:["냉각소화","제거소화","질식소화","냉동소화"], a:2, e:"질식소화는 모래나 담요 등으로 불타는 물체를 덮어 산소를 차단해서 불을 끄는 방법이다."},
{q:"공기 중 산소 농도가 몇 % 이하가 되면 불꽃이 꺼지는가?", c:["10% 이하","15% 이하","21% 이하","25% 이하"], a:1, e:"공기 중에는 보통 21%의 산소가 있으며, 산소 농도가 15% 이하가 되면 불꽃은 꺼진다."},
{q:"불이 났을 때 가장 먼저 해야 할 행동으로 알맞은 것은?", c:["값비싼 물건부터 챙긴다","\"불이야!\"라고 큰 소리로 외친다","조용히 혼자 대피한다","사진을 찍어 SNS에 올린다"], a:1, e:"불이 나면 제일 먼저 주위에 알려야 하므로 \"불이야!\"라고 큰 소리로 외쳐야 한다."},
{q:"옷에 불이 붙었을 때 지켜야 할 3단계 행동요령(STOP-DROP-ROLL)의 순서로 옳은 것은?", c:["구르기 → 엎드리기 → 멈추기","멈추기 → 엎드리기 → 구르기","엎드리기 → 멈추기 → 구르기","멈추기 → 구르기 → 엎드리기"], a:1, e:"멈추세요(STOP) → 엎드리세요(DROP) → 구르세요(ROLL) 순서로, 손으로 얼굴을 가리고 좌우로 굴러 불을 꺼야 한다."}
  ]},
  "2": { label: "2회", data: [
{q:"대피할 때 절대 이용하면 안 되는 이동 수단은?", c:["계단","비상구","엘리베이터","발코니"], a:2, e:"불이 나서 전기가 꺼지면 엘리베이터 안에 갇힐 위험이 있으므로 계단이나 비상구를 이용해야 한다."},
{q:"연기 속을 대피할 때 올바른 자세는?", c:["서서 빠르게 걷는다","최대한 자세를 낮춘다","뛰어서 이동한다","위를 보며 걷는다"], a:1, e:"연기는 위로 올라가고 찬 공기는 아래에 있으므로, 자세를 최대한 낮추어야 숨쉬기가 편해진다."},
{q:"실내에 갇혔을 때, 다른 곳에서 불이 난 경우 문을 열기 전에 먼저 확인해야 할 것은?", c:["창문 밖 상황","문 손잡이가 뜨거운지","연기 색깔","시계"], a:1, e:"문 손잡이나 문을 손으로 살짝 만져보아 뜨거우면 문을 열지 말아야 한다. 불길이 실내로 들어올 수 있기 때문이다."},
{q:"119에 화재 신고를 할 때 말하지 않아도 되는 것은?", c:["정확한 주소","화재 원인(아는 경우)","가까운 큰 건물 이름","자신이 좋아하는 음식"], a:3, e:"119 신고 시에는 정확한 주소, 가까운 큰 건물 이름, 알고 있다면 화재 원인을 또박또박 말해야 한다."},
{q:"119 장난전화를 하면 안 되는 이유로 옳지 않은 것은?", c:["법에 의해 처벌받을 수 있다","실제 화재현장 출동이 늦어질 수 있다","진짜 신고자가 오해받을 수 있다","소방관들이 심심하지 않아서 좋다"], a:3, e:"장난전화는 법에 의해 처벌받는 중대한 범죄이며, 실제 화재 출동을 늦추고 진짜 신고자까지 오해받게 만든다."},
{q:"마른 수건 4겹을 겹쳐서 코와 입을 막으면 연기를 약 몇 % 제거할 수 있는가?", c:["10%","40%","70%","100%"], a:1, e:"마른 수건도 4겹이면 연기를 약 40% 정도 제거할 수 있고, 8겹이면 자극성가스도 제거할 수 있다."},
{q:"물에 젖은 수건이나 마른 수건으로도 제거할 수 없는 기체는?", c:["암모니아","염화수소가스","일산화탄소","수증기"], a:2, e:"일산화탄소는 물에 젖은 수건이나 마른 수건 어느 것으로도 제거할 수 없는 기체이다."},
{q:"화상을 입었을 때 응급처치로 올바른 것은?", c:["얼음으로 문지른다","흐르는 찬물로 20분 이상 식힌다","약솜으로 덮는다","소주나 된장을 바른다"], a:1, e:"화상을 입으면 흐르는 찬물로 20분 이상 식힌 뒤 병원 치료를 받아야 한다. 수돗물을 세게 틀면 안 된다."},
{q:"화상 부위에 얼음을 사용하면 안 되는 이유는?", c:["피부의 혈액순환에 지장을 줄 수 있어서","통증이 심해져서","흉터가 예뻐져서","냄새가 나서"], a:0, e:"얼음은 피부의 혈액순환에 지장을 줄 수 있으므로 화상에 사용하면 안 된다."},
{q:"피부의 표피층만 손상되어 붉게 변하고 5~10일 후 흉터 없이 낫는 화상 단계는?", c:["1도 화상","2도 화상","3도 화상","4도 화상"], a:0, e:"1도 화상은 표피층만 손상되어 붉게 변하고 따끔거리며, 5~10일 후 흉터 없이 낫는다."},
{q:"진피까지 손상되어 물집이 생기고 2주~1개월 정도 치료가 필요한 화상 단계는?", c:["1도 화상","2도 화상","3도 화상","화상이 아님"], a:1, e:"2도 화상은 진피까지 상하여 물집이 생기고 매우 아프며, 전문의 치료가 필요하고 2주~1개월 정도 지나야 낫는다."},
{q:"심폐소생술에서 가슴압박의 올바른 깊이와 속도는?", c:["약 2cm, 분당 60회","약 5cm, 분당 100~120회","약 10cm, 분당 200회","깊이는 상관없이 최대한 빠르게"], a:1, e:"가슴압박은 깊이 약 5cm, 속도 분당 100~120회가 적당하다."},
{q:"심폐소생술에서 가슴압박과 인공호흡의 비율은?", c:["15:1","30:2","5:1","10:2"], a:1, e:"가슴압박 30회와 인공호흡 2회를 반복한다. 인공호흡이 어렵다면 가슴압박만 반복해도 된다."},
{q:"심정지 발생 후 몇 분 이내에 조치하지 않으면 뇌손상이 발생하는가?", c:["1~2분","4~5분","10~15분","30분"], a:1, e:"심정지 발생 후 4~5분 내에 아무 조치가 없으면 뇌손상이 일어나므로 초기 대응이 매우 중요하다."},
{q:"자동심장충격기(AED) 패드를 부착하는 위치로 옳은 것은?", c:["양쪽 발바닥","오른쪽 쇄골 아래와 왼쪽 겨드랑이선","이마와 뒷목","양쪽 손바닥"], a:1, e:"패드 1은 오른쪽 쇄골 아래, 패드 2는 왼쪽 젖꼭지 아래의 중간 겨드랑이선에 부착한다."},
{q:"압사 사고를 예방하기 위한 행동으로 옳지 않은 것은?", c:["앞사람과 간격을 유지한다","먼저 가려고 뛰지 않는다","답답하면 앞사람을 밀친다","가방을 앞으로 멘다"], a:2, e:"답답하더라도 앞사람을 밀지 않고 질서 있게 행동해야 압사 사고를 예방할 수 있다."},
{q:"사람이 급하게 한쪽으로 몰리며 발생하는 것을 무엇이라 하는가?", c:["군중 압착","군중 쏠림","군중 정체","군중 이동"], a:1, e:"군중 쏠림은 사람이 급하게 한쪽으로 몰리며 발생하고, 군중 압착은 사방이 꽉 막힌 공간에서 발생한다."},
{q:"소방시설 중 불이 난 것을 자동으로 감지해 수신기로 신호를 보내는 것은?", c:["발신기","감지기","수신기","유도등"], a:1, e:"감지기는 천장에 설치되어 불이 난 것을 자동으로 감지하고 이 정보를 수신기로 보내는 기구이다."},
{q:"사람이 직접 눌러야 화재를 알릴 수 있는 소방시설은?", c:["감지기","발신기","스프링클러","완강기"], a:1, e:"감지기는 스스로 벨을 울려 알리지만, 발신기는 사람이 꼭 눌러 주어야 화재를 알릴 수 있다."},
{q:"단독경보형감지기에 대한 설명으로 옳지 않은 것은?", c:["전선 연결 없이 건전지로 작동한다","\"삐삐~\" 소리로 위험을 알린다","아파트와 기숙사도 설치 의무 대상이다","어른의 도움을 받아 설치한다"], a:2, e:"주택용 소방시설 의무 설치 대상은 아파트 및 기숙사를 제외한 주택이다."},
{q:"식용유 등 동식물유를 사용하는 조리기구에서 일어난 화재는 무슨 급 화재인가?", c:["A급","B급","C급","K급"], a:3, e:"K급 화재는 주방, 조리실에서 식용유 같은 동식물유를 다루는 조리기구에서 일어난 화재이다."},
{q:"전기용품에서 일어난 화재는 몇 급 화재로 분류되는가?", c:["A급","B급","C급","K급"], a:2, e:"C급 화재는 텔레비전, 변압기 등 전기용품을 사용하는 도중 전기로 인해 일어나는 불이다."},
{q:"소화기 압력게이지 바늘이 초록색을 가리킬 때의 의미는?", c:["압력 부족","정상","압력 과다","고장"], a:1, e:"압력게이지 바늘이 초록색이면 정상, 노란색이면 부족, 빨간색이면 압력이 지나치게 높은 것이다."},
{q:"소화기 사용법의 순서로 올바른 것은?", c:["안전핀 뽑기 → 소화기 옮기기 → 호스 향하기 → 손잡이 쥐기","소화기 옮기기 → 안전핀 뽑기 → 바람(문) 등지고 호스 향하기 → 손잡이 쥐고 뿌리기","손잡이 쥐기 → 안전핀 뽑기 → 소화기 옮기기 → 호스 향하기","호스 향하기 → 안전핀 뽑기 → 소화기 옮기기 → 손잡이 쥐기"], a:1, e:"소화기를 불이 난 곳으로 옮기고 → 안전핀을 뽑고 → 바람(실외)이나 문(실내)을 등지고 호스를 향한 뒤 → 손잡이를 쥐고 빗자루로 쓸 듯이 뿌린다."},
{q:"정상적으로 관리·보관한 분말소화기의 일반적인 교체 주기는?", c:["3년","5년","10년","20년"], a:2, e:"정상적으로 관리·보관했더라도 10년이 경과한 분말소화기는 교체해야 하며, 성능확인 검사를 받으면 1회에 한해 3년 연장할 수 있다."}
  ]},
  "3": { label: "3회", data: [
{q:"화재나 비상시 대피할 방향을 알려주는 표시등으로, 정전 시에도 최소 20분 이상 작동하는 것은?", c:["유도등","발신기","스프링클러","감지기"], a:0, e:"유도등은 정전 등으로 전원이 끊어져도 자체 축전지에 의해 최소 20분 이상 작동한다."},
{q:"통로 유도등은 바닥으로부터 몇 m 이하에 설치되는가?", c:["1m 이하","2m 이하","3m 이하","설치 위치 무관"], a:0, e:"통로 유도등은 낮게 엎드렸을 때도 통로가 잘 보이도록 바닥으로부터 1m 이하에 설치된다."},
{q:"화재 확산을 막고 항상 닫힌 상태를 유지해야 하는 문은?", c:["현관문","방화문","창문","자동문"], a:1, e:"방화문은 화재 확산을 막는 역할을 하므로 항상 닫힌 상태를 유지해야 하며 주변에 물건을 두면 안 된다."},
{q:"어린이집이나 유치원에서 주로 사용하는 피난기구로, 미끄럼틀처럼 생긴 것은?", c:["완강기","구조대","미끄럼대","피난사다리"], a:2, e:"미끄럼대는 건물의 창이나 베란다에 미끄럼틀처럼 설치되며 어린이집·유치원 등에서 많이 사용된다."},
{q:"벨트를 가슴에 매면 자동으로 내려오는 피난기구로, 호텔방 등에 설치되는 것은?", c:["피난사다리","완강기","공기안전매트","구조대"], a:1, e:"완강기는 벨트를 가슴에 매면 체중에 의해 자동으로 내려오는 피난기구로, 호텔방 등에 설치된다."},
{q:"공기안전매트를 사용할 때 지켜야 할 주의사항은?", c:["어린이 혼자 뛰어내려도 된다","반드시 소방대원의 지시에 따라 사용한다","아무 층에서나 자유롭게 사용한다","신발을 신고 뛰어내려야 한다"], a:1, e:"공기안전매트는 반드시 소방대원이나 구조대원의 지시에 따라 사용해야 하며, 어린이가 스스로 뛰어내리면 매우 위험하다."},
{q:"최근 5년간 우리나라에서 1년에 발생하는 화재 건수는 약 얼마인가?", c:["약 4천 건","약 4만 건","약 40만 건","약 4백 건"], a:1, e:"최근 5년간 자료 기준으로 1년에 약 4만여 건의 화재가 발생한다."},
{q:"하루 평균 몇 건의 화재가 발생하는가?", c:["약 10건","약 50건","약 109건","약 500건"], a:2, e:"1년에 약 4만여 건이 발생하므로 하루에 약 109건씩 발생하는 셈이다."},
{q:"'불조심 강조의 달'로 정해진 달은?", c:["1월","5월","9월","11월"], a:3, e:"봄과 겨울에 화재가 많이 일어나기 때문에 겨울이 시작되기 전인 11월을 '불조심 강조의 달'로 정하고 있다."},
{q:"'소방의 날'은 몇 월 며칠인가?", c:["11월 9일","1월 19일","9월 11일","12월 25일"], a:0, e:"매년 11월 9일은 화재신고 번호 119를 기념한 '소방의 날'이다."},
{q:"최근 5년간 월별 화재 통계에서 화재가 가장 많이 발생한 달은?", c:["3월","6월","9월","12월"], a:0, e:"최근 5년간 월별 통계에서 3월(3,744건)이 가장 많고, 9월(2,572건)이 가장 적다."},
{q:"지하철에서 화재가 발생했을 때, 출입문을 열기 위해 좌석 양옆 아래쪽에 있는 장치는?", c:["비상벨","비상콕","소화기","화재감지기"], a:1, e:"좌석 양 옆 아래쪽에 위치한 비상콕을 몸 쪽으로 당긴 후 출입문을 열고 밖으로 나갈 수 있다."},
{q:"건물 붕괴 징조로 볼 수 없는 것은?", c:["바닥이 갈라지거나 함몰될 때","벽에서 갈라지는 소리가 날 때","동물들이 불안해할 때","날씨가 맑아질 때"], a:3, e:"건물 붕괴 징조는 바닥의 갈라짐·함몰, 벽·바닥의 갈라지는 소리, 동물들의 불안한 행동 등이다. 날씨와는 관계가 없다."},
{q:"붕괴된 건물에 갇혔을 때 해야 할 행동으로 옳지 않은 것은?", c:["파이프나 벽을 두드려 위치를 알린다","큰 소리로 계속 고함을 지른다","마른 손수건으로 코와 입을 가린다","창문 없는 단단한 벽 옆으로 대피한다"], a:1, e:"무리한 행동이나 고함을 지르는 등 불필요하게 체력을 낭비하지 않아야 한다."},
{q:"물놀이 전 준비운동과 함께, 식사 후 최소 얼마의 시간이 지난 후 물에 들어가야 하는가?", c:["5분","30분","2시간","6시간"], a:1, e:"밥을 먹은 뒤에는 최소 30분은 소화시킨 후 물놀이를 해야 한다."},
{q:"수영하기에 알맞은 수온으로 제시된 것은?", c:["15~16℃","25~26℃","35~36℃","45~46℃"], a:1, e:"차가운 물에서의 수영은 저체온증을 일으킬 수 있으므로, 수영하기 알맞은 수온은 25~26℃이다."},
{q:"'이안류'에 휩쓸렸을 때 벗어나는 방법으로 옳은 것은?", c:["흐름을 거슬러 해변으로 직진한다","좌우 45도 방향으로 헤엄쳐 나온다","물속으로 잠수해 버틴다","큰 소리로만 도움을 요청하고 가만히 있는다"], a:1, e:"이안류(거꾸로 파도)는 흐름에 대항하면 위험하며, 처음부터 좌우 45도 방향으로 헤엄쳐 빠져나오는 것이 안전하다."},
{q:"그네를 탈 때 지켜야 할 안전수칙으로 옳은 것은?", c:["줄을 놓고 두 손을 흔든다","줄을 꼭 잡고 도중에 뛰어내리지 않는다","서서 그네를 탄다","여러 명이 한 번에 탄다"], a:1, e:"그네를 탈 때에는 반드시 줄을 꼭 잡고 도중에 뛰어내리면 안 된다."},
{q:"백화점 에스컬레이터 이용 시 주의할 점으로 옳지 않은 것은?", c:["신발끈이 틈새에 끼지 않게 조심한다","손잡이 밖으로 머리를 내밀지 않는다","진행 방향을 거슬러 오르내려도 된다","진열대 모서리에 부딪히지 않게 조심한다"], a:2, e:"무빙워크나 에스컬레이터에서는 진행방향을 거슬러 오르내리면 안 된다."},
{q:"산불이 주택가로 번질 때 해야 할 행동으로 옳지 않은 것은?", c:["집 주위에 물을 뿌린다","문과 창문을 닫는다","가스통이나 유류를 그대로 둔다","안전한 장소로 대피한다"], a:2, e:"불이 붙거나 폭발 위험이 높은 가스통, 유류, 낙엽 등은 미리 제거해야 한다."},
{q:"땅속 거대한 암반이 갑자기 갈라지며 땅이 흔들리는 자연 현상은?", c:["지진","낙뢰","태풍","홍수"], a:0, e:"지진은 땅속의 거대한 암반이 갑자기 갈라지면서 그 충격으로 땅이 흔들리는 현상이다."},
{q:"지진이 발생했을 때 운동장에 있다면 어떻게 해야 하는가?", c:["건물 벽에 바짝 붙는다","나무 위로 올라간다","운동장 가운데에 엎드린다","자동차 위로 올라간다"], a:2, e:"건물의 유리창이나 담이 무너질 수 있으므로 건물이나 나무 가까이 가지 말고 운동장 가운데에 엎드려야 한다."},
{q:"낙뢰가 칠 때 야외에서 절대 하지 말아야 할 행동은?", c:["피뢰침이 있는 건물로 대피한다","나무 아래로 피한다","몸을 낮춘다","금속제품을 멀리한다"], a:1, e:"나무나 전신주 등 높은 사물 근처는 낙뢰를 맞기 쉬우므로 나무 아래로 피하면 안 된다."},
{q:"태풍이 올 때 집에서 해야 할 행동으로 옳지 않은 것은?", c:["창문을 꼭 잠근다","유리창에 테이프를 붙인다","노약자와 어린이를 밖에 내보낸다","TV·라디오로 기상상황을 확인한다"], a:2, e:"노약자와 어린이는 태풍이 지나갈 때까지 집 밖으로 나가지 말아야 한다."},
{q:"황사가 발생했을 때 외출 시 착용해야 할 것으로 옳지 않은 것은?", c:["마스크","보호 안경","소매가 짧은 옷","소매가 긴 옷"], a:2, e:"황사가 있을 때 외출하면 소매가 긴 옷을 입고 보호용 안경과 마스크를 착용해야 한다."}
  ]},
  "4": { label: "4회", data: [
{q:"음식물이 기도에 걸려 숨을 쉬지 못할 때 사용하는 응급처치법은?", c:["심폐소생술","하임리히법","인공호흡","RICE 요법"], a:1, e:"하임리히법은 배를 안쪽과 위쪽으로 밀어 올려, 목에 걸린 이물질이 밖으로 나오도록 돕는 응급처치 방법이다."},
{q:"하임리히법을 시작하기 전, 먼저 등을 두드리는 횟수는?", c:["1번","3번","5번 정도","10번"], a:2, e:"환자의 몸을 앞으로 살짝 숙이게 하고 양쪽 어깨뼈 사이를 5번 정도 세게 두드린 뒤에도 이물질이 나오지 않으면 하임리히법을 시작한다."},
{q:"하임리히법을 할 때 두 손을 위치해야 하는 곳은?", c:["가슴 정중앙","배꼽과 명치 사이","등 뒤 척추","목 부위"], a:1, e:"하임리히법을 할 때 두 손은 배꼽과 명치 사이의 가운데에 두고 안쪽·위쪽으로 밀어 올린다."},
{q:"하임리히법은 이물질이 나오는지 확인하며 최대 몇 번까지 반복하는가?", c:["2번","5번","10번","20번"], a:1, e:"한 번 하고 멈추는 것이 아니라 이물질이 나오는지 확인하며 최대 5번까지 반복한다."},
{q:"임산부나 배가 많이 나온 사람에게 하임리히법을 할 때 눌러야 하는 부위는?", c:["배","가슴뼈 아래쪽","목","등"], a:1, e:"임산부나 배가 많이 나온 사람은 배 대신 가슴뼈 아래쪽을 밀어주어야 한다."},
{q:"하임리히법을 하면 안 되는 대상은?", c:["성인","1세 미만의 아기","임산부","노인"], a:1, e:"1세 미만의 아기에게는 하임리히법을 하면 안 되며, 숨을 쉬지 못하면 즉시 어른을 부르고 119에 신고해야 한다."},
{q:"아파트 화재 대피의 핵심 원칙으로 강조되는 문구는?", c:["무조건 빨리 뛰어나가기","불나면 살펴서 대피","무조건 창밖으로 뛰어내리기","불나면 숨어서 기다리기"], a:1, e:"아파트 화재는 불이 난 곳과 연기가 퍼지는 방향에 따라 안전한 행동이 다르므로 '불나면 살펴서 대피'가 핵심 원칙이다."},
{q:"소방청 통계에 따르면 아파트 화재 인명피해의 약 39%가 발생한 상황은?", c:["잠자는 중","대피 중","조리 중","청소 중"], a:1, e:"최근 3년간(2023~2025년) 아파트 화재 인명피해 통계에서 약 39%가 대피 중에 발생했다."},
{q:"다른 집에서 불이 났지만 우리 집으로 연기가 들어오지 않을 때 해야 할 행동은?", c:["무조건 빨리 밖으로 나간다","창문과 현관문을 닫고 집 안에서 기다린다","엘리베이터를 타고 대피한다","창밖으로 뛰어내린다"], a:1, e:"연기나 불이 우리 집으로 들어오지 않는다면 무리하게 밖으로 나가지 말고 창문과 현관문을 닫은 채 집 안에서 기다려야 한다."},
{q:"우리 집 안에서 불이 나 대피가 가능한 경우, 절대 이용하면 안 되는 것은?", c:["계단","엘리베이터","젖은 수건","낮은 자세"], a:1, e:"불이 나면 엘리베이터가 멈춰 안에 갇힐 수 있으므로 절대 타지 않고 계단을 이용해야 한다."},
{q:"아파트에서 대피가 어려운 경우 우선적으로 이용해야 할 장소가 아닌 것은?", c:["대피공간","하향식 피난구","경량칸막이","옥상 물탱크"], a:3, e:"대피가 어려우면 대피공간, 하향식 피난구, 경량칸막이를 순서대로 이용해 옆집이나 아래층으로 피해야 한다."},
{q:"옆집과의 경계에 설치된, 부수면 옆집으로 대피할 수 있는 가벼운 칸막이는?", c:["방화문","경량칸막이","대피공간","하향식 피난구"], a:1, e:"경량칸막이는 앞에 놓인 물건을 치우고 부수면 옆집으로 피할 수 있는 가벼운 칸막이다."},
{q:"위층에서 아래층으로 대피할 수 있도록 만든 시설로, 어른의 도움이 필요한 것은?", c:["하향식 피난구","완강기","피난사다리","구조대"], a:0, e:"하향식 피난구는 어른의 도움을 받아 위층에서 아래층으로 이동할 수 있는 피난시설이다."},
{q:"승강기(엘리베이터)가 갑자기 멈췄을 때 가장 먼저 눌러야 하는 것은?", c:["119 신고","비상통화장치(인터폰) 버튼","문 열림 버튼","아무 버튼이나 계속 누르기"], a:1, e:"승강기가 멈추면 가장 먼저 승강기 안에 있는 비상통화장치(인터폰) 버튼을 눌러 갇힌 사실을 알려야 한다."},
{q:"인터폰이 연결되지 않을 때, 휴대전화로 신고하며 함께 알려야 하는 정보는?", c:["자신의 생일","승강기 고유번호","좋아하는 색깔","학교 이름"], a:1, e:"승강기 안에 적힌 승강기 고유번호를 알려주면 구조대원들이 위치를 더 빠르고 정확하게 찾을 수 있다."},
{q:"승강기에 갇혔을 때 절대 하면 안 되는 행동이 아닌 것은?", c:["문에 기대거나 세게 밀기","문을 억지로 열려고 하기","안에서 뛰어다니기","침착하게 구조를 기다리기"], a:3, e:"침착함을 유지하며 구조를 기다리는 것이 가장 안전한 행동이다. 뛰거나 문에 기대거나 억지로 여는 행동은 위험하다."},
{q:"승강기를 타고 이동하는 중 화재가 난 것을 알았을 때 가장 먼저 해야 할 행동은?", c:["문을 억지로 연다","모든 층의 버튼을 누른다","큰 소리로 노래를 부른다","가만히 있는다"], a:1, e:"모든 층의 버튼을 눌러 승강기 문이 먼저 열리는 층에서 내린 뒤 계단을 이용해 대피해야 한다."},
{q:"화재가 발생했을 때 승강기 이용에 대한 원칙으로 옳은 것은?", c:["무조건 승강기를 타고 빨리 이동한다","승강기를 타면 안 되고 계단을 이용해야 한다","1층에서만 승강기를 탈 수 있다","화재와 승강기는 관계없다"], a:1, e:"불이 났을 때는 승강기를 타면 안 되며 반드시 계단을 이용해야 한다."},
{q:"캠핑장에서 텐트를 설치할 때 피해야 할 장소가 아닌 것은?", c:["계곡이나 하천 주변","언덕이나 절벽 근처","바닥이 평평하고 안전한 곳","물이 갑자기 불어날 수 있는 낮은 곳"], a:2, e:"바닥이 평평하고 안전한 곳은 텐트를 설치하기에 적절한 장소이며, 나머지는 침수·붕괴 위험이 있어 피해야 한다."},
{q:"캠핑장에서 고기를 구울 때 너무 큰 불판을 사용하면 위험한 이유는?", c:["고기가 빨리 탄다","부탄가스통이 뜨거워져 폭발할 수 있다","연기가 많이 난다","맛이 없어진다"], a:1, e:"불판의 열 때문에 부탄가스통이 뜨거워져 폭발할 수 있으므로 알맞은 크기의 조리기구를 사용해야 한다."},
{q:"텐트 안에서 난로나 화로를 켜고 자면 안 되는 가장 큰 이유는?", c:["시끄러워서","일산화탄소 중독 위험이 있어서","전기요금이 많이 나와서","텐트가 더러워져서"], a:1, e:"밀폐된 텐트 안에서 화기를 사용하면 화재뿐 아니라 일산화탄소 중독으로 질식할 수 있다."},
{q:"캠핑장에서 불을 다 사용한 후 반드시 해야 할 일은?", c:["그대로 두고 잠을 잔다","물이나 흙을 덮어 잔불을 정리한다","쓰레기와 함께 태운다","다음 사람을 위해 남겨둔다"], a:1, e:"불을 다 쓴 후에는 남은 불씨가 없는지 확인하고 물이나 흙을 덮어 잔불 정리를 확실히 해야 한다."},
{q:"우리 집 화재안전 체크리스트에서, 커튼 등 탈 수 있는 물건과 전열기 사이에 두어야 할 최소 거리는?", c:["0.5m 이상","1.2m 이상","3m 이상","거리는 상관없음"], a:1, e:"난로나 가스레인지 주위에는 탈 수 있는 물건과 최소 1.2m 이상 거리를 두어야 한다."},
{q:"가스레인지 사용 후 반드시 잠가 두어야 하는 것은?", c:["창문","중간밸브","냉장고 문","현관문"], a:1, e:"가스 사용 후에는 점화스위치와 중간밸브를 반드시 잠가야 한다."},
{q:"화재 대피 후 가족이 다시 모이기로 미리 정해두는 이유는?", c:["심심하지 않으려고","누가 불에 갇혔는지 쉽게 알 수 있으려고","사진을 찍으려고","간식을 나눠 먹으려고"], a:1, e:"대피 후 집 밖의 장소를 정해 모이면 누가 불에 갇혔는지 쉽게 알 수 있다."}
  ]},
  "5": { label: "5회", data: [
{q:"소방관이 하는 일이 아닌 것은?", c:["화재를 진압한다","119 구급활동을 한다","화재예방 교육을 한다","학생들의 성적을 매긴다"], a:3, e:"소방관은 소방시설 점검, 화재 진압, 119 구급활동, 화재예방 교육 등을 한다."},
{q:"한국화재보험협회(KFPA)는 몇 년도에 설립되었는가?", c:["1963년","1973년","1997년","2003년"], a:1, e:"KFPA는 '화재로 인한 재해보상과 보험가입에 관한 법률'에 따라 1973년에 설립되었다."},
{q:"한국화재보험협회(KFPA)가 무료 안전점검을 실시하는 대상 건물 기준으로 알맞은 것은?", c:["5층 이상 건물","11층 이상 건물","단독주택","모든 자동차"], a:1, e:"KFPA는 아파트, 학교, 병원, 백화점, 11층 이상의 건물 등 일정 규모 이상의 시설에 무료 안전점검을 실시한다."},
{q:"손해보험회사에서 취급하는 보험이 아닌 것은?", c:["화재보험","자동차보험","해상보험","교육보험"], a:3, e:"화재보험·자동차보험·해상보험은 손해보험이고, 교육보험은 생명보험회사가 취급하는 보험이다."},
{q:"화재보험에 가입해야 하는 이유로 옳은 것은?", c:["화재가 나면 절대 피해를 보지 않기 때문에","우리 집 화재가 옆집에 번졌을 때 피해를 물어줄 수 있어서","세금을 적게 내기 위해서","소방차를 빨리 부르기 위해서"], a:1, e:"실수로 우리 집에서 불이 나 옆집으로 번지면 그 피해를 물어줘야 하므로, 화재보험에 가입해 두어야 경제적 어려움을 줄일 수 있다."},
{q:"옥내소화전은 일반적으로 연면적 몇 ㎡ 이상의 건물에 설치되는가?", c:["500㎡","1,000㎡","1,500㎡","5,000㎡"], a:2, e:"옥내소화전은 대부분 연면적 1,500㎡ 이상의 건물 내부와 지하층 등에 설치되어 있다."},
{q:"스프링클러는 언제, 어느 나라에서 처음 개발되었는가?", c:["1850년경 영국","1950년경 미국","1900년경 프랑스","2000년경 한국"], a:0, e:"스프링클러는 1850년경 영국에서 처음 개발되어 고층건물, 공장, 지하철 등에 설치된다."},
{q:"1999년 6월, 경기도 화성군에서 발생하여 어린이 19명 등 23명이 목숨을 잃은 화재 사고는?", c:["대구지하철 화재","씨랜드 청소년 수련원 화재","밀양 병원 화재","천안 초등학교 축구부 합숙소 화재"], a:1, e:"1999년 6월 30일 경기도 화성군 씨랜드 청소년 수련원 화재로 어린이 19명, 교사 4명 등 총 23명이 목숨을 잃었다."},
{q:"2003년 2월 18일 대구지하철 중앙로역에서 발생한 화재의 원인은?", c:["전기합선","방화","가스누출","담뱃불"], a:1, e:"대구지하철 화재는 방화로 인해 발생했으며 192명 사망, 147명 부상이라는 큰 피해를 냈다."},
{q:"2003년 3월, 충청남도 천안 초등학교 축구부 합숙소 화재의 원인은?", c:["방화","주방 냉장고의 전기합선","가스폭발","낙뢰"], a:1, e:"천안 초등학교 축구부 합숙소 화재는 주방 냉장고의 전기합선으로 발생해 학생 9명이 숨지고 16명이 다쳤다."},
{q:"2018년 1월 26일 발생한 밀양 병원 화재의 원인으로 추정되는 것은?", c:["방화","전기합선","담뱃불","가스누출"], a:1, e:"밀양 병원 화재는 전기합선으로 추정되며 51명 사망, 141명 부상이라는 큰 피해를 냈다."},
{q:"많은 사람이 이용하는 장소에서 화재경보가 울렸을 때 원칙으로 옳은 것은?", c:["먼저 화장실부터 간다","방송이나 관리자의 안내를 따른다","물건부터 챙긴다","큰 소리로 노래를 부른다"], a:1, e:"화재경보가 울리면 방송이나 건물관리자의 안내를 들으며 침착하게 행동해야 한다."},
{q:"백화점이나 영화관에 들어갔을 때 가장 먼저 습관적으로 확인해야 할 것은?", c:["매점 위치","비상구·계단·화재발신기 위치","화장실 위치","주차장 위치"], a:1, e:"사람이 많이 이용하는 장소에 가면 습관적으로 비상구, 계단, 출입문, 화재발신기 위치부터 살펴봐야 한다."},
{q:"옥내소화전 사용 순서로 옳은 것은?", c:["밸브 열기 → 호스 끌기 → 노즐 조준","호스를 불이 난 곳으로 끌기 → 호스 잡아주기 → 밸브 열기 → 노즐 조준","노즐 조준 → 밸브 열기 → 호스 끌기","순서는 상관없다"], a:1, e:"한 명이 호스와 노즐을 불이 난 곳으로 끌고 가면 다른 한 명이 호스를 잡아주고, 밸브를 열어 노즐을 불이 난 곳으로 향하게 한다."},
{q:"학교 과학실험실에서 화학약품에 의해 화상을 입었을 때 해야 할 행동으로 옳지 않은 것은?", c:["흐르는 차가운 물로 씻어낸다","상처에 연고를 발라준다","옷은 벗기지 말고 가위로 잘라낸다","깨끗하고 마른 천으로 덮고 병원에 간다"], a:1, e:"상처에는 아무것도 바르지 말고 깨끗하고 마른 천으로 덮어 병원에서 치료를 받아야 한다."},
{q:"학교에서 화재 대피훈련을 할 때 지켜야 할 행동으로 옳은 것은?", c:["각자 흩어져서 빨리 뛴다","교실 문 앞에 한 줄로 서서 질서 있게 대피한다","가방을 다 챙겨서 나간다","선생님보다 먼저 나간다"], a:1, e:"화재 대피훈련 시 교실 문 앞에 한 줄로 서서 선생님의 지시에 따라 질서 있게 대피해야 한다."},
{q:"화재로 대피한 후 친구가 보이지 않을 때 해야 할 행동은?", c:["다시 교실로 들어가 찾는다","선생님이나 소방관에게 말씀드린다","혼자 찾으러 다닌다","그냥 신경 쓰지 않는다"], a:1, e:"대피한 후 친구가 보이지 않으면 선생님이나 소방관께 말씀드려야 하며, 절대 교실로 다시 들어가면 안 된다."},
{q:"공연장이나 극장에서 안전수칙으로 옳지 않은 것은?", c:["질서를 지켜 입·퇴장한다","낮은 자세로 안내원을 따라 이동한다","폭죽이나 폭음탄을 사용한다","관람석이 아닌 곳에는 앉지 않는다"], a:2, e:"공연·행사장에서 폭죽, 폭음탄 등 화재 위험성이 있는 화기 위험물을 사용하면 안 된다."},
{q:"산림 내 낙엽, 풀, 나무 등이 불타는 화재를 무엇이라 하는가?", c:["도시화재","산불","차량화재","공장화재"], a:1, e:"산불은 산림 내에서 낙엽, 풀, 나무 등이 불타는 화재를 말한다."},
{q:"산불의 원인 중 가장 많은 비중을 차지하는 것은?", c:["낙뢰","논밭두렁 태우기 등 화기 취급 부주의","방화","자연발화"], a:1, e:"농사를 위해 논·밭두렁을 태우다 산림으로 불이 옮겨 붙는 경우가 산불의 가장 많은 원인이다."},
{q:"산행 중 작은 산불을 발견했을 때 초기 진화 방법으로 옳은 것은?", c:["물로만 꺼야 한다","나뭇가지나 외투, 흙으로 두드려 끈다","그냥 지나간다","사진만 찍는다"], a:1, e:"작은 산불은 나뭇가지 등으로 두드리거나 외투, 흙으로 덮어서 초기에 진화할 수 있다."},
{q:"산불을 예방하기 위해 하지 말아야 할 행동이 아닌 것은?", c:["통제구역 산행","산에서 흡연","지정된 곳에서 허가받은 취사","논밭두렁 태우기"], a:2, e:"허용된 지역에서 취사 및 야영을 하는 것은 규정에 맞는 행동이며, 나머지는 산불 예방을 위해 하지 말아야 할 행동이다."},
{q:"화재 시 승강기(엘리베이터) 통로를 타고 위로 올라올 수 있어 위험한 것은?", c:["물","연기와 열기","사람","소리"], a:1, e:"승강기 통로를 타고 연기와 열기가 올라올 수 있으므로 화재 시 승강기를 절대 이용하면 안 된다."},
{q:"완강기는 주로 어떤 장소에 설치되는가?", c:["학교 운동장","호텔·병원 등 고층건물","놀이터","지하철 승강장"], a:1, e:"완강기는 계단이나 승강기 이용이 곤란한 고층건물의 창문·베란다 등에 설치되며, 호텔·병원 등에 많이 설치된다."},
{q:"'화재안전 map'을 그릴 때 표시하지 않아도 되는 것은?", c:["화재위험 장소","소화기·감지기 위치","대피 동선","우리 가족이 좋아하는 음식"], a:3, e:"화재안전 map에는 화재위험 장소, 소화기·감지기·스프링클러 위치, 대피 동선과 대피 후 모일 장소를 표시한다."}
  ]},
  "6": { label: "6회", data: [
{q:"사람이 불을 처음 발견한 것은 어디에서 비롯되었다고 전해지는가?", c:["화산","벼락(번개)","마찰","태양"], a:0, e:"사람이 불을 처음 발견한 것은 화산에서 비롯되었다고 전해진다."},
{q:"옛사람들이 돌이나 나무를 이용해 불을 만드는 방법으로 알아낸 것은?", c:["돌이나 나무를 물에 담그기","돌끼리 여러 번 부딪치거나 나무끼리 마찰시키기","햇빛을 모으기","화산재를 모으기"], a:1, e:"돌끼리 여러 번 부딪치거나 나무끼리 계속 마찰시키면 불이 만들어진다는 것을 알게 되었다."},
{q:"사람들이 불을 신성하고 귀중하게 여겼음을 보여주는 대표적 예로 언급된 것은?", c:["벽난로","올림픽의 성화","촛불행사","캠프파이어"], a:1, e:"사람들은 불을 신성하고 귀중하게 생각했으며, 올림픽의 '성화'가 대표적인 예이다."},
{q:"전기다리미나 전기난로를 사용할 때 옆에 두면 위험한 것은?", c:["금속 물건","옷이나 인형처럼 탈 수 있는 물건","플라스틱 통","물이 든 컵"], a:1, e:"전기다리미·전기난로 등을 사용할 때는 옷, 인형처럼 탈 수 있는 물건을 멀리 치워야 한다."},
{q:"전기 플러그를 뽑을 때 올바른 방법은?", c:["전깃줄을 잡아당긴다","플러그 몸체를 잡고 뽑는다","젖은 손으로 뽑는다","발로 밟아서 뺀다"], a:1, e:"플러그를 뽑을 때는 전깃줄이 아니라 플러그 몸체를 잡고 뽑아야 하며, 젖은 손으로 만지면 안 된다."},
{q:"가스를 사용하기 전, 가스 연결 부위에 발라서 새는 곳을 확인하는 것은?", c:["물","비눗물","기름","소금물"], a:1, e:"평상시 가스 연결 부위에 비눗물을 발라 가스가 새는 곳이 없는지 점검한다."},
{q:"가스레인지를 켠 뒤 불꽃 색깔이 어떤 색이 되도록 공기조절기를 조정해야 하는가?", c:["빨간색","노란색","파란색","흰색"], a:2, e:"점화스위치를 돌려 불을 켠 후 파란 불꽃이 되도록 공기 조절기를 조정해야 한다."},
{q:"난로나 버너에 기름을 넣거나 옮길 때 올바른 방법은?", c:["불을 켠 채로 넣는다","불을 끄고 조금 기다렸다가 넣는다","아무 때나 넣어도 된다","뜨거울 때 빨리 넣는다"], a:1, e:"난로·버너 등을 사용하는 중에 기름을 넣거나 옮기면 절대 안 되며, 불을 끄고 조금 기다렸다가 넣어야 한다."},
{q:"불장난으로 양초가 넘어져 화재가 나는 경우가 많은 이유로 옳은 것은?", c:["양초는 불이 붙지 않기 때문에","넘어진 양초의 불이 주변 물건으로 옮겨붙기 때문에","양초는 안전하기 때문에","양초는 물로 꺼지지 않기 때문에"], a:1, e:"불장난을 하다가 양초가 넘어져 불이 옮겨 붙는 경우가 종종 있다."},
{q:"방 안에서 절대 하면 안 되는 행동으로, 이불에 재가 떨어져 불이 날 수 있는 것은?", c:["독서","방 안에서 담배 피우기","낮잠 자기","창문 열기"], a:1, e:"방 안에서는 절대로 담배를 피우면 안 된다. 이불에 재가 떨어지면 화재가 날 수 있다."},
{q:"튀김 요리 중 불이 붙었을 때, 소화기가 없다면 가장 먼저 해야 할 일은?", c:["물을 붓는다","뚜껑을 덮거나 야채를 많이 넣어 불꽃을 줄인다","프라이팬을 던진다","부채질을 한다"], a:1, e:"소화기가 없다면 불꽃이 작을 때 뚜껑을 덮거나 야채를 한꺼번에 많이 넣어 불꽃 크기를 줄인 후 가스밸브를 잠가야 한다."},
{q:"전기화재에 물을 사용하면 안 되는 이유는?", c:["불이 더 잘 꺼져서","감전될 위험이 있어서","냄새가 나서","전기요금이 더 나와서"], a:1, e:"전기화재의 경우 물을 사용하면 '찌르르' 감전이 될 수 있다."},
{q:"건물 피난계획에서 원칙적으로 지켜야 할 피난 방향의 수는?", c:["1방향","2방향","3방향","방향은 상관없음"], a:1, e:"피난경로 계획은 주 계단과 비상계단을 어느 상황에서도 선택적으로 사용할 수 있도록 2방향 피난을 원칙으로 한다."},
{q:"고층건물에서 화재 발생 시, 피난 순서로 옳은 것은?", c:["최상층 → 바로 위층 → 불이 난 층","불이 난 층 → 바로 위층 → 최상층","전 층이 동시에 대피","1층부터 순서대로"], a:1, e:"모든 층에서 동시에 피난하지 않도록, 불이 시작된 층 → 그 바로 위층 → 연기 전파 우려가 있는 최상층 순으로 피난한다."},
{q:"초고층 건축물에서 지상과 거리가 멀 때, 중간층에 설치하는 일시적 피난장소는?", c:["지하주차장","외기로 개방된 중간층 피난장소","옥내소화전실","엘리베이터홀"], a:1, e:"초고층 건축물은 중간층에 외기로 개방된 안전한 장소를 설치해 일시적 피난장소로 사용한다."},
{q:"마른 수건을 8겹 겹쳐 사용하면 제거할 수 있는 것은?", c:["일산화탄소","자극성가스","이산화탄소","수증기"], a:1, e:"마른 수건도 8겹이면 자극성가스도 제거할 수 있다. 다만 일산화탄소는 제거할 수 없다."},
{q:"마른 수건 12겹을 겹치면 연기를 약 몇 % 제거할 수 있는가?", c:["40%","60%","80%","100%"], a:2, e:"마른타올의 연기제거 성능 그래프에서 약 12겹이면 약 80% 정도 제거할 수 있다."},
{q:"화재 시 열과 연기가 실내에서 이동하는 순서로 옳은 것은?", c:["바닥에서 천장으로만 이동한다","천장에 먼저 도달한 뒤 위에서 아래로 내려온다","좌우로만 퍼진다","이동하지 않는다"], a:1, e:"실내의 열과 연기는 천장에 먼저 도달한 후 위에서 아래로 내려오므로 자세를 낮추는 것이 필요하다."},
{q:"등산객·성묘객이 버린 이것 때문에 산불이 많이 발생하는가?", c:["폭죽","담뱃불","손전등","배터리"], a:1, e:"산불은 등산객이나 성묘객이 버린 담뱃불 때문에 특히 많이 발생한다."},
{q:"화재원인 통계에서 '방화'와 '방화의심'이 차지하는 비율은 각각 몇 %인가?", c:["0.9%씩","5%씩","10%씩","46.5%씩"], a:0, e:"최근 5년간 화재원인 통계에서 방화와 방화의심은 각각 0.9%를 차지한다."},
{q:"화재원인 통계에서 '가스누출(폭발)'이 차지하는 비율은?", c:["0.4%","2.2%","8.5%","10.1%"], a:0, e:"가스누출(폭발)로 인한 화재는 전체의 0.4%를 차지한다."},
{q:"공기의 평균 분자량은 얼마인가?", c:["16","29","44","58"], a:1, e:"공기의 평균 분자량은 29이며, 이보다 무거우면 공기 아래로, 가벼우면 위로 모인다."},
{q:"부탄가스의 분자량은 얼마인가? (공기보다 무거워 바닥에 가라앉음)", c:["16","29","44","58"], a:3, e:"부탄가스의 분자량은 58(C₄H₁₀)로 공기(29)보다 무거워 바닥으로 가라앉는다."},
{q:"가스가 새는 것을 발견했을 때, 어린이가 취해야 할 행동으로 가장 알맞은 것은?", c:["직접 밸브를 잠그고 창문을 연다","가스가 새는 곳을 피한 후 어른이나 119에 신고한다","라이터로 확인해본다","아무 조치도 하지 않는다"], a:1, e:"어린이는 직접 조치를 취하기보다 가스가 새는 곳을 얼른 피한 후 어른들이나 119에 신고해야 한다."},
{q:"유류가 물보다 가벼워 물과 섞으면 어떻게 되는가?", c:["바닥으로 가라앉는다","물 표면에 뜬다","서로 완전히 섞인다","증발해 사라진다"], a:1, e:"유류는 물보다 가벼워 물과 섞으면 물 표면에 뜬다. 그래서 화재 시 유류가 낮은 곳으로 흘러 불이 더 번질 수 있다."}
  ]},
  "7": { label: "7회", data: [
{q:"화상 부위에 물집이 생겼을 때 올바른 행동은?", c:["바늘로 터트린다","터트리지 않는다","반창고로 세게 누른다","손으로 문지른다"], a:1, e:"화상으로 생긴 물집은 가능하면 터트리지 않아야 한다."},
{q:"옷을 입은 채로 화상을 입었을 때 옷을 벗기는 방법으로 옳은 것은?", c:["빠르게 확 벗긴다","찬물에 식힌 후 천천히 벗긴다","가위로 무조건 다 잘라낸다","벗기지 않고 그냥 둔다"], a:1, e:"찬물에 식힌 후 천천히 벗겨야 하며, 화상이 심할 경우에는 억지로 벗기지 않는다."},
{q:"진피 아래 피하지방(근육)까지 손상되어 갈색이나 흰색으로 변하고 흉터가 남는 화상 단계는?", c:["1도 화상","2도 화상","3도 화상","화상이 아님"], a:2, e:"3도 화상은 진피가 모두 손상되거나 피하지방까지 손상된 것으로, 갈색·흰색으로 변하고 흉터가 남는다."},
{q:"3도 화상 치료 후 관절 부위에 생길 수 있는 문제는?", c:["색깔이 예뻐짐","피부가 수축되어 움직이기 어려워짐","털이 많이 남","통증이 전혀 없음"], a:1, e:"3도 화상 치료 후 관절 부위는 피부가 수축되어 움직이기 어려워지기도 한다."},
{q:"심폐소생술에서 환자의 반응을 확인할 때 하는 행동은?", c:["발을 잡아당긴다","양쪽 어깨를 두드리며 소리쳐 확인한다","물을 뿌린다","코를 막는다"], a:1, e:"양쪽 어깨를 두드리며 큰 소리로 \"여보세요, 괜찮으세요?\"를 외쳐 반응을 확인한다."},
{q:"심폐소생술 중 호흡 확인은 몇 초 이내로 해야 하는가?", c:["3초","10초","30초","1분"], a:1, e:"환자의 얼굴과 가슴을 10초 이내로 관찰하여 호흡이 있는지 확인한다."},
{q:"인공호흡을 할 때, 환자의 가슴이 어느 정도 되도록 숨을 불어넣어야 하는가?", c:["가슴이 전혀 움직이지 않을 정도로","가슴이 올라올 정도로","배가 부풀 정도로","얼굴이 빨개질 정도로"], a:1, e:"환자의 코를 막고 1초 동안 가슴이 올라올 정도로 숨을 불어넣는다."},
{q:"환자의 호흡이 회복되었을 때 취해야 할 자세는?", c:["똑바로 눕힌다","옆으로 돌려 눕힌다(회복자세)","앉힌다","엎드리게 한다"], a:1, e:"호흡이 회복되면 환자를 옆으로 돌려 눕혀 기도가 막히는 것을 예방해야 한다."},
{q:"자동심장충격기(AED)는 어떤 환자에게 사용해야 하는가?", c:["감기 환자","반응과 정상 호흡이 없는 심정지 환자","배가 아픈 환자","화상 환자"], a:1, e:"AED는 반응과 정상적인 호흡이 없는 심정지 환자에게만 사용해야 한다."},
{q:"AED 사용 시 패드를 부착하기 전에 해야 할 일은?", c:["환자의 신발을 벗긴다","환자의 상의를 벗긴다","환자를 앉힌다","환자에게 물을 먹인다"], a:1, e:"패드를 오른쪽 쇄골 아래와 왼쪽 겨드랑이선에 부착하려면 먼저 환자의 상의를 벗겨야 한다."},
{q:"심장충격이 필요하다고 판단되면 AED에서 어떤 신호가 나타나는가?", c:["아무 신호도 없다","심장충격 버튼이 깜박인다","소리가 꺼진다","화면이 꺼진다"], a:1, e:"심장충격이 필요한 경우에만 심장충격 버튼이 깜박인다."},
{q:"심장충격 버튼을 누르기 전 반드시 확인해야 할 것은?", c:["시간","다른 사람이 환자에게서 떨어져 있는지","날씨","환자의 이름"], a:1, e:"심장충격을 실시하기 전 다른 사람이 환자에게서 떨어져 있는지 반드시 확인해야 한다."},
{q:"압사 사고를 예방하기 위한 안전한 자세로 옳지 않은 것은?", c:["손을 가슴 앞에 모은다","다리를 고정한다","움직이는 방향으로 저항한다","가방을 앞으로 멘다"], a:2, e:"군중이 움직이는 방향에 저항하지 말고 그 흐름에 따라야 안전하다."},
{q:"넘어졌을 때 몸을 웅크려 보호해야 하는 자세를 무엇이라 하는가?", c:["태아자세","차렷자세","만세자세","옆구르기자세"], a:0, e:"넘어졌을 때는 몸을 웅크려 머리와 가슴 등을 보호하는 태아자세를 취해야 한다."},
{q:"시끄러운 행사장에서 넘어졌을 때, 소리를 지르는 것보다 효과적인 도구는?", c:["손전등","호루라기","거울","부채"], a:1, e:"시끄러운 곳에서는 소리를 지르는 것보다 호루라기를 사용하면 더 잘 들려 효과적이다."},
{q:"소화기는 어떤 곳에 보관해야 하는가?", c:["습기가 많고 햇빛이 잘 드는 곳","습기가 적고 서늘한 곳(30℃ 미만)","뜨거운 보일러실","아무데나"], a:1, e:"소화기는 습기가 적고 햇빛이 없는 서늘한 곳(30℃ 미만)에 보관해야 한다."},
{q:"소화기를 사용할 때 화재와 유지해야 할 안전거리는?", c:["0.5m 이내","1.5~2m","5m 이상","거리 상관없음"], a:1, e:"소화기 사용 시 화재와 1.5~2m 정도의 간격을 유지해야 한다."},
{q:"소화기 위에 물건을 올려놓아도 되는가?", c:["올려놓아도 된다","올려놓으면 안 된다","가벼운 것만 된다","상관없다"], a:1, e:"소화기 위에 물건을 올려놓으면 안 되며, 보기 쉽고 사용하기 편리한 곳에 두어야 한다."},
{q:"옥내소화전의 밸브는 어느 방향으로 돌려야 물이 나오는가?", c:["시계 방향","시계반대 방향","아래로 당긴다","위로 민다"], a:1, e:"옥내소화전은 밸브를 시계반대 방향으로 열면 호스로 물이 뿜어져 나온다."},
{q:"피난구 유도등은 어디에 설치되어 있는가?", c:["바닥","출입구 상단","천장 중앙","창문 옆"], a:1, e:"피난구 유도등은 연기가 많아도 출입문이 잘 보이도록 출입구 상단에 달려 있다."},
{q:"피난계단에 물건을 쌓아두면 안 되는 이유는?", c:["보기 좋지 않아서","피난에 지장을 주기 때문에","청소가 힘들어서","냄새가 나서"], a:1, e:"피난계단에 물건을 쌓아두면 사람들이 대피할 때 지장을 주기 때문에 물건을 두면 안 된다."},
{q:"큰 건물의 옥상광장은 어떤 용도로 사용될 수 있는가?", c:["주차장","임시대피장소","놀이터","창고"], a:1, e:"옥상광장은 임시대피장소로 사용될 수 있으며, 큰 건물에는 헬리콥터 착륙장을 설치하기도 한다."},
{q:"통로 유도표지는 어디에 설치되는가?", c:["천장","바닥으로부터 1m 이하","창문 위","계단 꼭대기"], a:1, e:"통로 유도표지는 피난통로가 되는 복도, 계단 등의 바닥으로부터 1m 이하에 설치한다."},
{q:"건물의 창에서 땅 위로 설치하여 자루 모양으로 미끄러져 내려오게 하는 피난기구는?", c:["피난사다리","구조대","완강기","미끄럼대"], a:1, e:"구조대는 건물의 창에서 땅 위로 설치하여 미끄러져 내려오게 하는 자루 모양의 기구이다."},
{q:"3층 이상 아파트에서 외부로 긴급히 뛰어내릴 때 사용하는, 공기를 넣어 사용하는 피난기구는?", c:["완강기","구조대","공기안전매트","피난사다리"], a:2, e:"공기안전매트는 3층 이상의 아파트에서 외부로 긴급히 뛰어내릴 때 안전하게 땅에 도달하도록 돕는 피난기구이다."}
  ]},
  "8": { label: "8회", data: [
{q:"최근 5년간 월별 화재통계에서 화재가 가장 적게 발생한 달은?", c:["3월","6월","9월","12월"], a:2, e:"최근 5년간 월별 통계에서 9월(2,572건)이 가장 적게 발생했다."},
{q:"최근 5년간(2021~2025) 1월의 화재 발생 건수는 약 몇 건인가?", c:["약 2,500건","약 2,900건","약 3,741건","약 4,000건"], a:2, e:"1월의 화재 발생 건수는 약 3,741건으로 3월(3,744건) 다음으로 많다."},
{q:"지하철 화재 시 대피하는 순서로 옳은 것은?", c:["비상콕 당기기 → 비상용 단추 누르기 → 119 신고","비상용 단추 누르기 → 119 신고 → 비상콕 당기고 출입문 열기","119 신고만 하고 기다리기","아무 순서나 상관없음"], a:1, e:"어른의 도움을 받아 비상용 단추를 누르고, 119에 신고한 뒤, 비상콕을 당겨 출입문을 열고 대피해야 한다."},
{q:"지하철 선로로 내려서 대피할 때 특히 주의해야 할 것은?", c:["다른 열차가 오는지","신발이 젖는지","시간이 얼마나 걸리는지","가방 무게"], a:0, e:"지하철이 다니는 길에 내릴 때에는 다른 열차가 오는지 주의해야 한다."},
{q:"지하상가에서 불이 났을 때 대피 방향으로 옳은 것은?", c:["화재가 발생한 방향","공기가 유입되는 방향","아무 방향이나","가장 가까운 사람을 따라간다"], a:1, e:"화재가 발생한 반대쪽, 즉 공기가 유입되는 방향으로 대피해야 한다."},
{q:"지하상가처럼 구조가 복잡한 곳에서 화재가 나면 잃어버리기 쉬운 것은?", c:["신발","방향 감각","지갑","우산"], a:1, e:"지하상가는 구조상 방향감각을 상실할 수 있으니 반드시 침착하게 행동해야 한다."},
{q:"학교 급식 시간에 화상을 입지 않으려면 어떻게 행동해야 하는가?", c:["뛰어다닌다","조심스럽게 천천히 행동한다","친구를 민다","장난을 친다"], a:1, e:"급식 시간에 뜨거운 물이나 국을 엎질러 화상을 입을 수 있으니 조심스럽게 행동해야 한다."},
{q:"우리 집 화재안전수칙 중, 외출할 때 반드시 확인해야 할 것으로 옳지 않은 것은?", c:["가스밸브가 잠겨 있는지","조리기구 불이 꺼져 있는지","TV 채널","창문 잠금"], a:2, e:"외출할 때는 가스밸브와 조리기구의 불이 꺼져 있는지 반드시 확인해야 한다. TV 채널은 관련이 없다."},
{q:"건물 붕괴 시 대피 방법으로 옳지 않은 것은?", c:["유리창이나 선반처럼 파손되기 쉬운 곳을 피한다","딱딱한 물건으로 머리를 보호한다","한꺼번에 비상구로 몰려간다","견고한 벽체가 있는 곳으로 대피한다"], a:2, e:"가방, 방석 등으로 머리를 보호하면서 일시에 비상구로 몰리지 않도록 침착하게 이동해야 한다."},
{q:"붕괴 위험이 있는 건물 주변에서 유리 파편으로부터 보호해야 할 신체 부위는?", c:["손","머리","발","배"], a:1, e:"붕괴지역 주변에 있을 경우 유리파편 등에 다치지 않도록 머리를 보호해야 한다."},
{q:"물에 빠졌을 때, 흐르는 물에서 벗어나는 방법으로 옳은 것은?", c:["물살을 거슬러 직진한다","물의 흐름에 따라 비스듬히 헤엄쳐 나온다","가만히 떠 있는다","잠수해서 버틴다"], a:1, e:"흐르는 물에 빠졌을 때는 물의 흐름에 따라 표류하며 비스듬히 헤엄쳐 나와야 한다."},
{q:"물놀이 사고자를 발견했을 때 신고할 수 있는 두 기관의 전화번호는?", c:["112와 119","119와 122","110과 120","114와 119"], a:1, e:"물놀이 사고 발견 시 119(소방서)나 122(해양수상구조대)에 신고해야 한다."},
{q:"물에 빠진 사람을 구할 때, 구조경험이 없는 사람이 절대 하면 안 되는 행동은?", c:["소리쳐 도움 요청하기","물체를 던지기","직접 물에 뛰어들기","119에 신고하기"], a:2, e:"구조경험이 없는 사람이 함부로 물에 뛰어들면 본인도 위험할 수 있으므로 절대 금물이다."},
{q:"물속에서 다리에 쥐(경련)가 났을 때 해야 할 행동은?", c:["몸부림친다","몸의 힘을 빼고 경련 부위를 주무른다","물 밖으로 억지로 뛰쳐나간다","숨을 참는다"], a:1, e:"먼저 몸의 힘을 빼서 편한 자세가 되도록 하고 경련 부위를 주물러야 한다."},
{q:"수초에 다리가 감겼을 때 올바른 대처는?", c:["놀라서 발버둥친다","서서히 부드럽게 팔다리를 움직여 풀어낸다","숨을 참고 기다린다","큰소리로 웃는다"], a:1, e:"놀라서 발버둥치면 오히려 더 휘감기므로 서서히 부드럽게 팔다리를 움직여 풀어내야 한다."},
{q:"놀이터에서 맨발로 놀면 안 되는 이유는?", c:["발이 더러워져서","유리조각이나 돌에 다칠 수 있어서","신발이 아까워서","추워서"], a:1, e:"맨발로 놀면 유리 조각이나 돌 등에 의해 다칠 수 있다."},
{q:"미끄럼틀을 이용할 때 안전수칙으로 옳은 것은?", c:["미끄럼판으로 거꾸로 올라간다","계단으로 손잡이를 잡고 한 개씩 올라간다","여러 명이 한꺼번에 내려온다","서서 내려온다"], a:1, e:"미끄럼틀에 올라갈 때는 손잡이를 꼭 잡고 계단을 한 개씩 올라가야 한다."},
{q:"백화점 회전문을 이용할 때 올바른 방법은?", c:["뛰어서 통과한다","완전히 열렸을 때 천천히 들어간다","문을 손으로 세게 민다","반대 방향으로 민다"], a:1, e:"회전문을 통과할 때는 천천히 침착하게 주위를 살피고 완전히 열렸을 때 들어가야 한다."},
{q:"공연장에서 압사사고 위험을 줄이기 위한 행동으로 옳은 것은?", c:["앞사람을 밀치며 서두른다","낮은 자세로 천천히 안내를 따른다","옥상이나 담벼락에 올라가 관람한다","큰 소리로 뛰어다닌다"], a:1, e:"앞사람을 따라 낮은 자세로 천천히 안내원의 안내를 따라 질서 있게 이동해야 한다."},
{q:"산행 중 산불을 만났을 때, 대피하지 못한 경우 취해야 할 자세는?", c:["서서 바람을 마주본다","바람을 등지고 낙엽·나뭇가지를 제거한 뒤 낮은 자세로 엎드린다","나무 위로 올라간다","뛰어다닌다"], a:1, e:"대피하지 못한 경우 바람을 등지고 주변의 낙엽, 나뭇가지를 제거한 후 최대한 낮은 자세로 엎드려야 한다."},
{q:"산불 발생 시 신고할 수 있는 기관이 아닌 것은?", c:["산림청","소방서","경찰서","기상청"], a:3, e:"산불 발견 시 산림청, 소방서, 경찰서, 시·군·구 산림부서에 신고해야 한다."},
{q:"산불이 주택가로 번질 때, 이웃에게 알려야 할 대상으로 특히 강조되는 사람은?", c:["친한 친구","거동이 불편한 이웃","반려동물 주인","택배기사"], a:1, e:"이웃 주민에게 위험상황을 알리고, 거동이 불편한 이웃을 진화대원과 공무원에게 알려주어야 한다."},
{q:"지하철에서 화재가 발생했을 때, 승무원(안내원)의 지시에 따라 어떻게 대피해야 하는가?", c:["각자 알아서 빠르게","차분하고 신속하게","천천히 여유롭게","지시를 무시하고"], a:1, e:"불이 나면 안내원의 지시에 따라 차분하고 신속하게 대피해야 한다."},
{q:"사람들이 많이 이용하는 건물에 갈 때 미리 확인해 두어야 할 것은?", c:["화장실 위치","비상구 위치","매점 위치","주차 요금"], a:1, e:"사람들이 많이 이용하는 건물이나 극장 등에 갈 때는 비상구가 어디에 있는지 꼭 확인해 두어야 한다."},
{q:"건물 붕괴 징조 중 하나로 옳은 것은?", c:["조명이 밝아짐","바닥이 갈라지거나 함몰됨","사람이 많아짐","온도가 내려감"], a:1, e:"건물 붕괴 징조로는 바닥이 갈라지거나 함몰될 때, 벽이나 바닥에서 갈라지는 소리가 날 때 등이 있다."}
  ]},
  "9": { label: "9회", data: [
{q:"지진이 발생했을 때 차 안에 타고 있다면 해야 할 행동은?", c:["문을 열고 뛰어내린다","손잡이를 꽉 잡는다","창문을 연다","노래를 부른다"], a:1, e:"차를 타고 있을 때 지진이 발생하면 손잡이를 꽉 잡아야 한다."},
{q:"지진 발생 시 야외에서 피해야 할 장소가 아닌 것은?", c:["좁은 길이나 담 근처","넓은 운동장 한가운데","자판기 근처","급한 경사지"], a:1, e:"좁은 길, 담, 자판기 근처, 급한 경사지는 위험하므로 피해야 하며, 넓은 운동장 한가운데는 상대적으로 안전하다."},
{q:"낙뢰가 칠 때 학교에서 가면 안 되는 곳은?", c:["교실","물기가 있는 화장실","운동장","도서관"], a:1, e:"낙뢰가 칠 때는 물기가 있는 화장실에 가면 안 되며 선생님의 지시에 따라야 한다."},
{q:"낙뢰가 칠 때 야외에서 가까이 하면 안 되는 물건은?", c:["나무로 만든 의자","우산 등 금속제품","종이컵","마스크"], a:1, e:"우산이나 야영도구 등 금속제품은 낙뢰를 맞을 수 있으므로 가까이 하지 말아야 한다."},
{q:"태풍이 다가올 때 유리창이 깨지지 않도록 하는 방법으로 옳은 것은?", c:["창문을 열어둔다","테이프를 이중으로 붙이거나 젖은 신문지를 붙인다","커튼만 친다","아무 조치도 하지 않는다"], a:1, e:"유리창에 테이프를 이중으로 부착하거나 젖은 신문지 등을 붙여야 한다."},
{q:"태풍이 불 때 산에서 해야 할 행동으로 옳은 것은?", c:["계곡을 건넌다","산사태 위험 지역에 머문다","빨리 산에서 내려오거나 높은 곳으로 피신한다","나무를 붙잡고 버틴다"], a:2, e:"빨리 산에서 내려오거나 급히 높은 곳으로 피신해야 하며, 계곡은 물살이 거세므로 건너면 안 된다."},
{q:"홍수 발생 시 도로에서 물이 흐르는 곳을 통과할 때 주의해야 할 것은?", c:["신발 브랜드","돌이나 맨홀","옷 색깔","우산 유무"], a:1, e:"물이 흐르는 곳을 통과할 경우에는 돌이나 맨홀이 있는지 발밑을 살피며 걸어가야 한다."},
{q:"홍수는 전 세계적으로 어떤 특징을 가진 자연재해인가?", c:["가장 드물게 발생","가장 많은 재난을 일으킴","피해가 거의 없음","여름에만 발생"], a:1, e:"홍수는 전 세계적으로 가장 많은 재난을 일으키는 자연재해이다."},
{q:"황사가 발생하는 주된 원인 지역은?", c:["중국","일본","러시아","동남아시아"], a:0, e:"황사는 주로 중국에서 바람에 날려 하늘 높이 불어 올라간 모래 먼지가 퍼져서 발생한다."},
{q:"황사가 농작물에 피해를 주는 이유는?", c:["태양빛을 막고 숨쉬는 구멍을 막아서","온도를 높여서","비가 많이 와서","벌레가 많아져서"], a:0, e:"황사현상은 태양빛을 막고 농작물이나 활엽수의 숨 쉬는 구멍을 막아 장애를 일으킨다."},
{q:"하임리히법을 시행하기 전, 환자가 스스로 기침을 할 수 있다면 어떻게 해야 하는가?", c:["즉시 배를 누른다","기침을 계속하도록 도와준다","등을 세게 두드린다","입에 손가락을 넣는다"], a:1, e:"스스로 기침을 할 수 있으면 억지로 등을 두드리거나 배를 누르지 말고 기침을 계속하도록 도와야 한다."},
{q:"하임리히법을 할 때, 주먹을 쥔 손의 어느 부분이 환자의 배에 닿아야 하는가?", c:["새끼손가락 쪽","엄지손가락 쪽","손등","손목"], a:1, e:"한 손은 주먹을 쥐고 엄지손가락 쪽이 환자의 배에 닿게 해야 한다."},
{q:"하임리히법을 하는 사람이 균형을 잡기 위해 취해야 할 자세는?", c:["두 발을 모은다","다리를 어깨보다 넓게 벌리고 무릎을 살짝 굽힌다","한 발로 선다","쪼그려 앉는다"], a:1, e:"다리는 어깨보다 넓게 벌리고 무릎은 살짝 굽혀서 넘어지지 않게 해야 한다."},
{q:"하임리히법으로 이물질이 나온 뒤에도 배가 아프거나 숨쉬기 불편하면 어떻게 해야 하는가?", c:["그냥 넘어간다","병원에서 진찰을 받는다","다시 하임리히법을 반복한다","잠을 잔다"], a:1, e:"이물질이 빠져나온 뒤에도 배가 아프거나 숨쉬기가 불편하면 반드시 병원에서 진찰을 받아야 한다."},
{q:"승강기가 완전히 밀폐된 공간이 아니기 때문에 크지 않은 위험은?", c:["추락","질식","진동","소음"], a:1, e:"승강기는 완전히 밀폐된 공간이 아니므로 공기가 금방 부족해져 질식할 위험은 크지 않다."},
{q:"승강기에 갖춰진, 갑자기 바닥으로 떨어지는 것을 막아주는 것은?", c:["비상벨","추락 방지 안전장치","인터폰","환풍기"], a:1, e:"승강기에는 추락을 막는 여러 가지 안전장치가 있어 갑자기 바닥으로 떨어질까 불안해하지 않아도 된다."},
{q:"승강기 안에서 안전 손잡이를 잡을 때 취해야 할 자세는?", c:["높은 자세로 선다","낮은 자세를 유지한다","문에 기댄다","뛴다"], a:1, e:"승강기가 멈추면 낮은 자세를 유지하고 안전 손잡이가 있으면 꼭 잡고 침착하게 기다려야 한다."},
{q:"캠핑장에서 텐트 줄에 걸려 넘어지는 것을 막기 위해 밤에 부착하는 것은?", c:["검은 테이프","야광줄(야광테이프)","흰 종이","거울"], a:1, e:"밤에는 텐트 줄이 잘 안 보이므로 눈에 잘 띄는 야광 줄이나 야광 테이프를 사용해야 한다."},
{q:"캠핑장에서 투명한 병을 함부로 버리면 안 되는 이유는?", c:["냄새가 나서","햇빛을 모아 낙엽에 불이 붙을 위험(볼록렌즈 효과)이 있어서","무거워서","재활용이 안 돼서"], a:1, e:"투명한 병은 햇빛을 모아 주변 낙엽이나 나뭇가지에 불이 붙을 위험(볼록렌즈 효과)이 있다."},
{q:"텐트 안에 준비하면 좋은 것으로, 일산화탄소 중독을 예방하는 데 도움이 되는 장치는?", c:["모기향","일산화탄소 경보기","손전등","라디오"], a:1, e:"텐트 안에는 휴대용 일산화탄소 경보기를 준비하면 좋다. 다만 경보기가 있다고 텐트 안에서 불을 피워도 되는 것은 아니다."},
{q:"캠핑 중 천둥·번개가 칠 때 피해야 할 장소는?", c:["건물 안","자동차 안","산 정상이나 큰 나무 아래","텐트 안(문을 닫고)"], a:2, e:"산 정상, 암벽 위, 큰 나무 아래처럼 낙뢰 위험이 큰 곳을 피하고 건물이나 자동차 안 같은 안전한 곳으로 이동해야 한다."},
{q:"캠핑장에서 계곡물이 갑자기 불어날 때 해야 할 행동은?", c:["물건을 다 챙긴 후 이동한다","물건보다 먼저 높은 곳으로 대피한다","그 자리에서 기다린다","물에 들어가 확인한다"], a:1, e:"물이 갑자기 불어나면 물건을 챙기느라 시간을 보내지 말고 높은 곳으로 대피해야 한다."},
{q:"아파트 화재 신고를 할 때 예시로 제시된 문구에 포함되지 않는 정보는?", c:["아파트 동·호수","화재 상황","갇힌 인원수","좋아하는 반려동물"], a:3, e:"신고 시에는 아파트 동·호수, 화재 상황, 집 안에 있는 인원수 등을 말해야 한다."},
{q:"아파트 화재 시 '꼭 기억하세요' 체크리스트에 포함되지 않는 내용은?", c:["무조건 밖으로 나가는 것이 아니라 먼저 상황을 살핀다","대피할 수 있으면 계단을 이용한다","평소 대피공간 위치를 확인해둔다","대피공간 앞에 물건을 쌓아둔다"], a:3, e:"대피공간, 경량칸막이, 하향식 피난구 앞에는 물건을 쌓아두면 안 된다."},
{q:"승강기 안에서 밖으로 소리를 낼 때 올바른 방법은?", c:["발로 문을 세게 찬다","손바닥이나 물건으로 문·벽을 두드린다","몸으로 문을 밀어붙인다","가만히 있는다"], a:1, e:"손바닥이나 가지고 있는 물건으로 승강기 문이나 벽을 두드려 갇힌 사실을 알려야 한다."}
  ]},
  "10": { label: "10회", data: [
{q:"소방관이 화재 진압 시 입는 장비가 아닌 것은?", c:["방호복","방열복","화학복","수영복"], a:3, e:"소방관은 방호복, 방열복, 화학복 등을 착용하며, 화재 예방·진압·구급활동·교육 등을 담당한다."},
{q:"한국화재보험협회(KFPA)가 주최·시행하는 행사가 아닌 것은?", c:["소방안전봉사상","불조심 어린이마당","재난안전교육","전국체육대회"], a:3, e:"KFPA는 소방안전봉사상, 불조심 어린이마당, 재난안전교육 등을 통해 재난예방에 앞장선다."},
{q:"생명보험회사가 취급하는 보험 종류가 아닌 것은?", c:["사망보험","양로보험","교육보험","화재보험"], a:3, e:"화재보험은 손해보험회사가 취급하는 보험이다. 생명보험은 사망보험, 양로보험, 교육보험 등을 취급한다."},
{q:"극장, 백화점, 노래방, 찜질방처럼 많은 사람이 이용하는 시설이 화재보험에 가입해야 하는 이유는?", c:["세금 혜택 때문에","화재 발생 시 인명·재산피해가 크기 때문에","광고 효과 때문에","손님이 늘어나서"], a:1, e:"이런 시설은 언제나 화재위험이 있고, 화재 발생 시 많은 인명·재산피해가 일어나므로 화재보험에 가입해야 한다."},
{q:"화재안전 map에서 소화기가 놓여 있는 장소로 예시된 곳은?", c:["주방","발코니","화장실","신발장"], a:1, e:"예시 화재안전 map에서 발코니(하단)에 소화기가 놓여 있는 것으로 표시되어 있다."},
{q:"화재안전 체크리스트에서, 전기제품을 사용하지 않을 때 해야 할 것은?", c:["그대로 둔다","코드를 항상 뽑아 둔다","스위치만 끈다","물로 씻는다"], a:1, e:"전기제품을 사용하지 않을 때에는 코드를 항상 뽑아 두어야 한다."},
{q:"화재안전 체크리스트에서, 전자제품 코드를 콘센트에 꽂을 때 올바른 방법은?", c:["한 콘센트에 모두 몰아 꽂는다","여러 콘센트에 분산해서 꽂는다","아무렇게나 꽂는다","코드를 밟히게 둔다"], a:1, e:"전자제품들의 코드를 콘센트에 분산해서 꽂아 사용해야 과부하를 막을 수 있다."},
{q:"음식을 만들 때 화재안전 체크리스트에서 강조하는 것은?", c:["혼자서 요리한다","어른이 반드시 부엌에 있는다","TV를 크게 튼다","문을 잠근다"], a:1, e:"음식을 만들 때에는 어른이 반드시 부엌에 있어야 한다."},
{q:"대형 화재사례 중 가장 많은 사망자(192명)를 낸 사고는?", c:["씨랜드 청소년 수련원 화재","천안 초등학교 축구부 합숙소 화재","대구지하철 화재","밀양 병원 화재"], a:2, e:"2003년 2월 18일 대구지하철 중앙로역 화재로 192명이 사망하고 147명이 부상당했다."},
{q:"대형 화재사례 중 2018년에 발생한 사고는?", c:["씨랜드 청소년 수련원 화재","천안 초등학교 축구부 합숙소 화재","대구지하철 화재","밀양 병원 화재"], a:3, e:"2018년 1월 26일 밀양 병원 화재는 전기합선으로 추정되며 51명이 사망하고 141명이 부상당했다."},
{q:"옥내소화전의 정의로 옳은 것은?", c:["소방차가 오기 전 사람들이 자체적으로 화재를 진압할 수 있는 고정식 물소화 설비","스스로 작동하는 스프링클러","대피용 사다리","화재경보장치"], a:0, e:"옥내소화전은 소방대가 오기 전까지 건물 내 사람들이 자체적으로 신속하게 화재를 진압할 수 있도록 설치하는 고정식 물소화 설비이다."},
{q:"열의 변화를 감지하는 감지기와 연기를 감지하는 감지기를 각각 무엇이라 하는가?", c:["열감지기·연기감지기","발신기·수신기","유도등·유도표지","스프링클러·소화기"], a:0, e:"감지기의 종류에는 열의 변화를 알아차리는 열감지기와 연기를 감지하는 연기감지기가 있다."},
{q:"화재경보가 울렸을 때 가장 먼저 해야 할 행동으로 강조된 것은?", c:["팝콘을 사러 간다","방송이나 건물관리자의 안내를 듣는다","화장실에 간다","사진을 찍는다"], a:1, e:"화재경보가 울리면 화만 내지 말고 방송이나 건물관리자의 안내를 들어야 갇히지 않는다."},
{q:"대피 중 연기를 만났을 때, 벽을 이용해 이동하는 방법은?", c:["벽을 부순다","벽을 짚으면서 이동한다","벽에 기대어 쉰다","벽을 타고 오른다"], a:1, e:"대피 중 연기를 만나게 되면 벽을 짚으면서 빠져나가야 한다."},
{q:"대피가 불가능할 때 문틈을 막는 데 사용할 수 있는 것이 아닌 것은?", c:["수건","청테이프","옷","부채"], a:3, e:"대피가 불가능하면 문을 닫고 수건, 청테이프, 옷 등으로 문틈새를 막아 연기가 새어 들어오지 않게 해야 한다."},
{q:"엘리베이터를 화재 시 절대 타면 안 되는 이유로 옳지 않은 것은?", c:["조금만 이상을 감지해도 멈추도록 설계되어 있어서","연기와 열기가 통로를 타고 올라올 수 있어서","요금이 비싸서","정전되면 갇힐 수 있어서"], a:2, e:"엘리베이터는 이상 감지 시 멈추도록 설계되어 있고, 통로로 연기·열기가 올라올 수 있으며, 정전되면 갇힐 위험이 있어 화재 시 이용하면 안 된다."},
{q:"완강기를 사용할 때, 벨트를 조이는 신체 부위는?", c:["허리","가슴","목","다리"], a:1, e:"완강기는 가슴에 안전벨트를 조이고 체중에 의해 자동으로 하강하는 피난기구이다."},
{q:"옥내소화전을 사용할 때, 밸브를 열면 호스에 무엇이 가득 차는가?", c:["공기","물","소화약제 가루","이산화탄소"], a:1, e:"밸브를 열면 물이 호스에 가득 차서 세게 뿜어져 나온다."},
{q:"초등학생용 불조심 길라잡이를 발행한 두 기관은?", c:["교육부와 경찰청","소방청과 화재보험협회","환경부와 기상청","보건복지부와 적십자사"], a:1, e:"이 책은 소방청과 한국화재보험협회(KFPA)가 발행하였다."},
{q:"불의 3요소 중 하나라도 없으면 불이 꺼지는 원리를 이용한 소화 방법이 아닌 것은?", c:["냉각소화","제거소화","질식소화","확산소화"], a:3, e:"소화의 종류에는 냉각소화, 제거소화, 질식소화, 소화기 사용이 있다. 확산소화라는 용어는 없다."},
{q:"화재원인 통계에서 '미상'으로 분류된 화재의 비율은?", c:["0.4%","2.2%","8.5%","27.0%"], a:2, e:"화재원인 통계에서 원인을 알 수 없는 '미상'은 8.5%를 차지한다."},
{q:"소화기의 구조에서, 소화약제가 나오는 관을 무엇이라 하는가?", c:["사이폰관","손잡이","안전핀","압력게이지"], a:0, e:"소화기의 구조 중 사이폰관은 본체용기 안의 소화약제가 호스로 나오는 통로 역할을 한다."},
{q:"감지기의 가장 중요한 역할은?", c:["불을 직접 끄는 것","화재를 빨리 알려 대피 시간을 벌어주는 것","냄새를 없애는 것","전기요금을 절약하는 것"], a:1, e:"감지기는 불이 난 것을 자동으로 감지해 빨리 알림으로써 사람들이 안전하게 대피할 시간을 벌어준다."},
{q:"가스레인지에 물을 올려놓고 자리를 비우면 위험한 이유는?", c:["물이 아까워서","냄비가 과열되어 불이 날 수 있어서","물맛이 나빠져서","시간이 오래 걸려서"], a:1, e:"조리 중 자리를 비우면 냄비가 과열되어 불이 번질 수 있으므로 반드시 자리를 지켜야 한다."},
{q:"불조심 길라잡이 전체 내용을 통해 강조하는 가장 중요한 태도는?", c:["불을 아예 사용하지 않는 것","평소 안전수칙을 알고 침착하게 대처하는 것","화재보험만 믿는 것","소방관에게 모두 맡기는 것"], a:1, e:"불조심 길라잡이는 평소 안전수칙을 알아두고, 위급한 상황에서 침착하게 대처하는 태도를 가장 중요하게 강조한다."}
  ]},
  "11": { label: "11회", data: [
{q:"화재원인 통계에서 '기계적요인'이 차지하는 비율은?", c:["2.2%","8.5%","10.1%","27.0%"], a:2, e:"최근 5년간 화재원인 통계에서 기계적요인은 10.1%를 차지하며 부주의·전기적요인 다음으로 높다."},
{q:"화재원인 통계에서 '화학적요인'이 차지하는 비율은?", c:["0.4%","1.1%","2.2%","8.5%"], a:2, e:"화학적요인으로 인한 화재는 전체의 2.2%를 차지한다."},
{q:"화재원인 통계에서 '교통사고'로 인한 화재가 차지하는 비율은?", c:["0.4%","0.8%","1.1%","1.3%"], a:2, e:"교통사고로 인한 화재는 전체의 1.1%를 차지한다."},
{q:"화재원인 통계에서 '자연적요인'이 차지하는 비율은?", c:["0.4%","0.8%","1.1%","1.3%"], a:1, e:"자연적요인(낙뢰 등)으로 인한 화재는 전체의 0.8%를 차지한다."},
{q:"화재원인 통계에서 '기타(실화)'가 차지하는 비율은?", c:["0.4%","0.8%","1.3%","2.2%"], a:2, e:"기타(실화)로 분류된 화재는 전체의 1.3%를 차지한다."},
{q:"화재원인 통계에서 '제품 결함'이 차지하는 비율은?", c:["0.4%","0.9%","1.1%","2.2%"], a:0, e:"제품 결함으로 인한 화재는 전체의 0.4%로 가장 낮은 편에 속한다."},
{q:"과부하에 걸려 지나치게 높은 열이 발생하는 현상을 무엇이라 하는가?", c:["누전","과열","스파크","정전"], a:1, e:"과열은 과부하에 걸려 지나치게 높은 열이 발생하는 현상으로, 불이 나는 주요 원인이다."},
{q:"전기기구 사용 중 튀는 불꽃을 무엇이라 하는가?", c:["누전","과부하","전기불꽃(스파크)","정전"], a:2, e:"전기불꽃(스파크)은 전기기구 사용 중 튀는 불꽃으로, 전기용접 시에도 발생해 불이 나기도 한다."},
{q:"천둥번개가 칠 때 컴퓨터, 텔레비전 등 전기기구를 켜두면 위험한 이유는?", c:["전기요금이 많이 나와서","번개가 전깃줄을 타고 들어와 불이 나거나 기구가 망가질 수 있어서","화면이 흐려져서","전파방해가 생겨서"], a:1, e:"천둥번개가 칠 때 전기기구가 켜져 있으면 번개가 전깃줄을 타고 들어와 불을 내거나 기구를 망가뜨릴 수 있다."},
{q:"고장난 전기제품을 발견했을 때 올바른 행동은?", c:["직접 분해해서 고친다","어른들께 말씀드려 고쳐서 사용한다","그냥 계속 사용한다","물로 씻는다"], a:1, e:"고장난 전기제품은 함부로 분해하지 말고 어른들께 말씀드려 고쳐서 사용해야 한다."},
{q:"마른 수건을 16겹 겹치면 연기를 약 몇 % 제거할 수 있는가?", c:["40%","60%","80%","100%"], a:3, e:"마른타올의 연기제거 성능 그래프에서 약 16겹이면 연기를 약 100% 제거할 수 있다."},
{q:"튀김 요리 중 불이 붙었을 때 물을 뿌리면 안 되는 이유는?", c:["불이 꺼지지 않아서","기름이 튀어 불이 번지거나 화상을 입을 수 있어서","냄새가 나서","냄비가 녹아서"], a:1, e:"물로 인해 기름이 튀어 불이 번지거나 화상을 입을 수 있으므로 튀김 요리 중 화재에는 물을 뿌리면 안 된다."},
{q:"실내에 갇혔을 때 절대 하면 안 되는 행동은?", c:["소리를 질러 외부에 알린다","창 밖으로 함부로 뛰어내린다","구조를 기다린다","문 손잡이를 만져본다"], a:1, e:"불길이나 연기 때문에 빠져나갈 수 없을 때는 소리를 질러 알리고 참을성 있게 구조를 기다려야 하며, 창 밖으로 함부로 뛰어내리면 안 된다."},
{q:"옷에 불이 붙어 구르는 사람을 발견했을 때, 주변 사람이 해야 할 행동은?", c:["그냥 지켜본다","담요나 수건으로 덮어준다","사진을 찍는다","물을 뿌려 끄려 한다"], a:1, e:"주변에 있는 사람은 담요나 수건으로 구르는 사람을 덮어주어야 한다."},
{q:"심폐소생술에서 가슴압박점의 위치로 옳은 것은?", c:["목뼈 바로 아래","가슴뼈를 이등분했을 때 아래쪽 중간 부분","배꼽 위","왼쪽 갈비뼈"], a:1, e:"가슴압박점은 가슴뼈(흉골)를 이등분했을 때 아래쪽의 중간 부분이다."},
{q:"인공호흡이 어려운 상황이라면 어떻게 해야 하는가?", c:["심폐소생술을 중단한다","가슴압박만 반복해도 충분하다","환자를 눕히고 기다린다","물을 먹인다"], a:1, e:"인공호흡이 어렵다면 가슴압박만 반복해도 충분하다."},
{q:"압사 사고 예방을 위한 안전한 자세에서, 가방이 있는 경우 매야 하는 방향은?", c:["뒤로 멘다","앞으로 멘다","옆으로 멘다","손에 든다"], a:1, e:"안전한 자세를 취할 때 가방이 있는 경우 가방을 앞으로 매야 안전하다."},
{q:"극장이나 공연장 객석의 통로, 바닥 또는 벽에 설치하는 유도등은?", c:["피난구 유도등","통로 유도등","객석 유도등","비상 유도등"], a:2, e:"객석 유도등은 극장이나 공연장 객석의 통로, 바닥 또는 벽에 설치하는 유도등이다."},
{q:"건물이 무너질 때를 대비해 평소에 확인해 두면 좋은 것은?", c:["완강기와 손전등의 위치","TV 채널","냉장고 위치","신발장 위치"], a:0, e:"평소 완강기, 손전등 등 탈출에 필요한 물품이 있는 곳을 확인해 두는 것이 좋다."},
{q:"물놀이를 하기 전, 심장에서 먼 부분부터 물을 적시는 순서로 옳은 것은?", c:["얼굴 → 가슴 → 팔 → 다리","다리 → 팔 → 얼굴 → 가슴","가슴 → 얼굴 → 다리 → 팔","팔 → 다리 → 가슴 → 얼굴"], a:1, e:"물에 들어갈 때는 심장에서 먼 부분부터 물을 적신 후 천천히 들어가야 하며, 순서는 다리 → 팔 → 얼굴 → 가슴이다."},
{q:"파도가 갑자기 높아져 위험할 때, 체력이 다해 지쳤다면 어떻게 해야 하는가?", c:["계속 힘껏 헤엄친다","배영·선헤엄 등으로 휴식을 취하며 파도에 몸을 맡긴다","큰 소리로만 계속 소리친다","물속으로 계속 잠수한다"], a:1, e:"체력이 다하여 지쳤을 때는 배영·선헤엄 등으로 휴식을 취하면서 파도에 몸을 맡겨야 한다."},
{q:"놀이터에서 끈이 달려있는 옷을 입으면 위험한 이유는?", c:["옷이 더러워져서","놀이기구에 끼어 사고가 날 수 있어서","예쁘지 않아서","무거워서"], a:1, e:"끈이 달려있는 옷을 입으면 놀이기구에 끼어 사고가 날 수 있으니 주의해야 한다."},
{q:"캠핑장 내에서 텐트를 치면 안 되는 장소가 아닌 것은?", c:["통로","소화기 앞","전기시설 주변","정해진 구역"], a:3, e:"캠핑장에서는 통로, 소화기 앞, 전기시설 주변에 텐트를 치면 안 되며 반드시 정해진 구역에 쳐야 한다."},
{q:"화재안전 체크리스트에서, 전기코드에 대한 설명으로 옳지 않은 것은?", c:["손상된 부분이 없어야 한다","가구 등에 눌리지 않게 정리한다","걸어 다닐 때 밟혀도 상관없다","콘센트에 분산해서 꽂는다"], a:2, e:"전기코드는 걸어 다닐 때 밟히지 않도록 정리되어 있어야 한다."},
{q:"재윤이의 사례처럼, 밤에 부엌에서 불이 났을 때 이것 덕분에 금방 잠에서 깨어 알 수 있었다. 이것은?", c:["알람시계","화재감지기","강아지","부모님의 목소리"], a:1, e:"재윤이는 화재 감지기를 통해 불이 난 것을 알고 금방 일어날 수 있었다."}
  ]},
  "12": { label: "12회", data: [
{q:"성냥, 라이터 등 불을 붙일 수 있는 모든 것을 무엇이라 하는가?", c:["가연물","점화원","소화약제","연소물"], a:1, e:"점화원이란 성냥, 라이터 등 불을 붙일 수 있는 모든 것을 말한다."},
{q:"실수나 고의로 발생하여 꺼야 할 필요성이 있는, 해로운 불을 무엇이라 하는가?", c:["성화","화재","불꽃","점화"], a:1, e:"불은 이로운 불과 해로운 불로 나눌 수 있으며, 그 중 해로운 불, 즉 실수나 고의로 발생하여 꺼야 할 필요성이 있는 불을 '화재'라고 한다."},
{q:"전기제품을 사용하지 않을 때 스위치만 끄고 플러그를 뽑지 않으면 위험한 이유는?", c:["전기요금이 더 나와서","플러그를 뽑지 않으면 전기가 계속 흐르기 때문에","제품이 빨리 고장 나서","전파가 발생해서"], a:1, e:"스위치만 꺼도 플러그를 뽑지 않으면 전기가 계속 흘러 위험하므로, 사용하지 않을 때는 반드시 플러그를 뽑아 두어야 한다."},
{q:"콘센트나 플러그 주변에 먼지가 쌓이면 위험한 이유는?", c:["전기요금이 늘어서","전기스파크가 튀면 먼지에 불이 붙을 수 있어서","콘센트가 무거워져서","전자파가 많아져서"], a:1, e:"전기스파크가 튈 때 쌓인 먼지에 불이 붙을 수 있으므로 콘센트·플러그·배선 주위 먼지는 정기적으로 청소해야 한다."},
{q:"누전차단기를 점검하는 순서로 옳은 것은?", c:["시험용 버튼 누르기 → TV 끄기 → 스위치 확인","TV 등을 끄기 → 시험용 버튼 누르기 → 스위치가 떨어지는지 확인","스위치 확인 → TV 끄기 → 버튼 누르기","순서는 상관없다"], a:1, e:"가정에서 사용 중인 TV, 컴퓨터 등을 끈 뒤 시험용 버튼을 누르고, 스위치가 아래로 떨어지는지 확인해야 한다."},
{q:"LPG(액화석유가스) 용기는 어디에 보관해야 하는가?", c:["실내 아무 곳","통풍이 잘되고 그늘진 실외 받침대 위","햇빛이 잘 드는 창가","냉장고 옆"], a:1, e:"LPG 용기는 통풍이 잘 되고 그늘진 실외 받침대 위에 넘어지지 않도록 두어야 한다."},
{q:"평소 가스 점검 중 이음새 부분에서 거품이 나면 어떻게 해야 하는가?", c:["그냥 둔다","용기밸브(또는 메인밸브)를 잠그고 판매업소·도시가스사업자에게 연락한다","물을 뿌린다","라이터로 확인한다"], a:1, e:"거품이 나면 가스가 새는 것이므로 밸브를 잠그고 판매업소나 도시가스사업자에게 연락하여 고친 후 사용해야 한다."},
{q:"알코올 등 화공약품을 다루는 학교 실험실에 반드시 갖다 놓아야 하는 것은?", c:["소화기","가습기","환풍기","우산"], a:0, e:"알코올 등 화공약품을 취급하는 학교 실험실이나 기름을 취급하는 곳에는 꼭 소화기를 갖다 놓아야 한다."},
{q:"폭죽놀이가 위험한 이유로 옳은 것은?", c:["소리가 시끄러워서","불꽃이 종이 등 잘 타는 물건에 튀면 불이 날 수 있어서","연기가 많이 나서","비싸서"], a:1, e:"폭죽을 쏘아 올려 놀다가 종이 등 불에 잘 타는 물건에 불꽃이 튀면 불이 날 수 있다."},
{q:"방에 갇혔을 때 주위에 알리는 방법으로 옳지 않은 것은?", c:["손수건을 창문 밖으로 흔든다","냄비와 숟가락을 두드린다","비상벨을 누른다","조용히 혼자 기다린다"], a:3, e:"창문 밖으로 물건을 던지거나 손수건을 흔들고, 소리 나는 물건을 두드리거나 비상벨을 눌러 적극적으로 알려야 한다."},
{q:"단독경보형감지기 설치 순서로 옳은 것은?", c:["건전지 넣기 → 설치 위치 표시 → 천장에 고정 → 작동 확인","설치 위치 표시 → 건전지 넣기 → 천장에 고정 → 작동 확인","천장에 고정 → 건전지 넣기 → 작동 확인 → 설치 위치 표시","작동 확인 → 건전지 넣기 → 설치 위치 표시 → 천장에 고정"], a:1, e:"단독경보형감지기는 설치 위치 표시 → 건전지 넣기 → 천장에 고정 → 작동 확인 순서로 설치한다."},

let currentMode = 'quiz'; // 'quiz' | 'gogo'
let currentRoundKey = null;
let DATA = [];
let idx = 0, startTime = 0, finishTime = 0, timerInterval = null, answered = false, wrongList = [], isRetryRound = false, currentItem = null;
const circ = ["①","②","③","④"];

function shuffledItem(item) {
  const order = [0, 1, 2, 3];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return { q: item.q, c: order.map(oi => item.c[oi]), a: order.indexOf(item.a), e: item.e };
}

function showSelectScreen() {
  currentMode = 'quiz';
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('category-screen').classList.add('hidden');
  document.getElementById('gogo-select-screen').classList.add('hidden');
  document.getElementById('gogo-game-screen').classList.add('hidden');
  document.getElementById('select-screen').classList.remove('hidden');
  const grid = document.getElementById('round-grid');
  grid.innerHTML = '';
  Object.keys(ROUNDS).forEach(key => {
    const box = document.createElement('div');
    box.className = 'round-box';
    box.onclick = () => startGame(key);
    box.innerHTML = `<div class="r-num">${ROUNDS[key].label}</div><div class="r-name">총 ${ROUNDS[key].data.length}문제</div>`;
    grid.appendChild(box);
  });
}

function startGame(key) {
  currentRoundKey = key;
  DATA = ROUNDS[key].data.slice();
  idx = 0; wrongList = []; answered = false; isRetryRound = false; finishTime = 0;
  document.getElementById('select-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  document.getElementById('round-pill').textContent = ROUNDS[key].label;
  document.getElementById('q-total').textContent = DATA.length;
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
  showQuestion();
}
function restartRound() {
  if (currentMode === 'gogo') { startGogoTopic(currentRoundKey); return; }
  startGame(currentRoundKey);
}
function backToSelect() {
  clearInterval(timerInterval);
  if (currentMode === 'gogo') { showGogoSelectScreen(); return; }
  showSelectScreen();
}
function updateTimer() {
  const sec = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}
function showQuestion() {
  answered = false;
  currentItem = shuffledItem(DATA[idx]);
  const item = currentItem;
  document.getElementById('q-index').textContent = idx + 1;
  document.getElementById('question-box').textContent = item.q;
  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  item.c.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = `${circ[i]} ${c}`;
    btn.onclick = () => selectChoice(i);
    grid.appendChild(btn);
  });
  document.getElementById('explain-box').classList.add('hidden');
}
function selectChoice(i) {
  if (answered) return;
  answered = true;
  const item = currentItem;
  const buttons = document.querySelectorAll('.choice-btn');
  buttons.forEach((b, bi) => {
    b.disabled = true;
    if (bi === item.a) b.classList.add('correct');
    else if (bi === i) b.classList.add('wrong');
  });
  if (i !== item.a) {
    wrongList.push({ q: item.q, c: item.c, a: item.a, e: item.e, mine: i });
  }
  if (idx === DATA.length - 1) {
    finishTime = Date.now();
    clearInterval(timerInterval);
    updateTimer();
  }
  document.getElementById('explain-answer').textContent = `정답: ${circ[item.a]} ${item.c[item.a]}`;
  document.getElementById('explain-text').textContent = item.e;
  document.getElementById('explain-box').classList.remove('hidden');
  document.getElementById('next-btn').textContent = (idx === DATA.length - 1) ? '결과보기' : '다음 문제';
}
function nextQuestion() {
  idx++;
  if (idx >= DATA.length) { endGame(); return; }
  showQuestion();
}
function endGame() {
  clearInterval(timerInterval);
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  const roundLabel = currentMode === 'gogo' ? GOGO[currentRoundKey].label : ROUNDS[currentRoundKey].label;
  document.getElementById('result-title').textContent = `${roundLabel} 퀴즈 완료!`;
  const totalSec = Math.floor((finishTime - startTime) / 1000);
  const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
  const s = String(totalSec % 60).padStart(2, '0');
  document.getElementById('result-time').textContent = `${m}:${s}`;
  const now = new Date();
  document.getElementById('result-finish').textContent = now.toLocaleString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

  const wrongWrap = document.getElementById('wrong-wrap');
  if (wrongList.length > 0) {
    wrongWrap.classList.remove('hidden');
    document.getElementById('wrong-count').textContent = wrongList.length;
    const listEl = document.getElementById('wrong-list');
    listEl.innerHTML = '';
    wrongList.forEach((w, i) => {
      const div = document.createElement('div');
      div.className = 'wrong-item';
      div.innerHTML = `<div class="wq">${i + 1}. ${w.q}</div>
        <div>내가 고른 답: <span class="wmine">${circ[w.mine]} ${w.c[w.mine]}</span></div>
        <div>정답: <span class="wcorrect">${circ[w.a]} ${w.c[w.a]}</span> — ${w.e}</div>`;
      listEl.appendChild(div);
    });
    document.getElementById('retry-wrong-btn').textContent = isRetryRound
      ? `이번에 틀린 ${wrongList.length}개 또 다시 풀기`
      : `틀린 문제만 다시 풀기 (${wrongList.length}개)`;
  } else {
    wrongWrap.classList.add('hidden');
  }
}
function retryWrong() {
  DATA = wrongList.map(w => ({ q: w.q, c: w.c, a: w.a, e: w.e }));
  idx = 0; wrongList = []; answered = false; isRetryRound = true; finishTime = 0;
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  document.getElementById('q-total').textContent = DATA.length;
  // startTime은 그대로 유지 — 타이머를 리셋하지 않고 처음부터 누적해서 계속 잰다.
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
  showQuestion();
}

// ===== 고고전진 (힌트 맞히기 게임) =====
const GOGO = {
  "1": { label: "1. 불이란?", data: [{"q":"고기를 구울 때나 촛불처럼 집안을 밝힐 때도 쓰이며, 우리 삶에서 매우 중요한 것은 무엇인가?","c":["불","물","바람","흙"],"a":0,"e":"불은 열과 빛을 내며 타는 현상으로, 요리와 난방, 조명 등 사람의 생활에 반드시 필요한 존재다."},{"q":"먼 옛날 사람이 불을 처음 발견하게 된 자연현상은 무엇인가?","c":["홍수","화산","지진","번개"],"a":1,"e":"먼 옛날 사람들은 화산이 폭발할 때 나오는 불이나 용암을 보고 처음으로 불을 접하게 되었다고 알려져 있다."},{"q":"불을 사용하면서 사람들이 알게 된 첫 번째 좋은 점은 무엇인가?","c":["동물을 더 빨리 잡을 수 있게 됨","집을 더 크게 지을 수 있게 됨","음식을 익혀 맛있게 먹을 수 있게 됨","옷을 짜서 입을 수 있게 됨"],"a":2,"e":"불로 음식을 익혀 먹으면 소화가 잘 되고 세균 감염 위험도 줄어들어, 사람들은 더 안전하고 맛있게 먹을 수 있게 되었다."},{"q":"불 덕분에 사람들이 몸을 보호할 수 있게 된, 캄캄한 밤에 나타나는 위험한 대상은 무엇인가?","c":["매서운 추위","굶주림","전염병","사나운 짐승"],"a":3,"e":"불빛과 열기가 사나운 짐승을 겁주고 쫓아내는 역할을 해서, 사람들은 밤에도 안전하게 지낼 수 있었다."},{"q":"불을 사용하면서 사람들이 알게 된 것 중, 겨울에도 몸을 따뜻하게 지킬 수 있게 해준 것은 무엇인가?","c":["추위를 막아줌","짐승을 쫓아줌","음식을 저장해줌","빛을 밝혀줌"],"a":0,"e":"불을 피워 놓으면 체온을 유지할 수 있어서, 사람들은 추운 겨울에도 얼어 죽지 않고 살아남을 수 있었다."},{"q":"아주 먼 옛날, 사람들은 화산이나 번개처럼 자연적으로 일어난 불을 어떤 마음으로 대하며 피해 다녔는가?","c":["반가움","두려움(무서움)","호기심","즐거움"],"a":1,"e":"화산 폭발이나 번개처럼 자연적으로 생긴 불은 통제할 수 없어 위험했기 때문에, 사람들은 처음에는 불을 두려워하며 피해 다녔다."},{"q":"사람들이 불을 만드는 방법을 찾다가, 이것들을 여러 번 부딪쳐서 불씨를 만들 수 있다는 것을 알게 되었다. 무엇일까?","c":["나무","쇠못","돌","종이"],"a":2,"e":"부싯돌 같은 돌을 서로 세게 부딪치면 튀는 불꽃으로 불을 만들 수 있다는 사실을 사람들이 알아냈다."},{"q":"나무와 나무를 계속해서 비비면 불이 만들어지는데, 이런 현상을 무엇이라고 하는가?","c":["증발","냉각","부식","마찰"],"a":3,"e":"나무를 계속 비비면 마찰로 열이 발생하고, 그 열이 쌓이면 불이 붙게 된다."},{"q":"불과 함께 시작되어 인간 생활의 중요한 수단이 된 것은 무엇인가?","c":["문명","농업","언어","종교"],"a":0,"e":"불의 사용은 요리, 난방, 도구 제작 등을 가능하게 하여 인류 문명 발전의 중요한 출발점이 되었다."},{"q":"사람들이 불을 신성하고 귀중하게 여겼음을 보여주는 대표적인 예로, 올림픽에서 볼 수 있는 불을 무엇이라고 하는가?","c":["촛불","성화","모닥불","봉화"],"a":1,"e":"성화는 불을 신성하고 귀중하게 여긴 고대의 전통이 이어져 오늘날 올림픽 개회식에서 밝혀지는 불꽃이다."},{"q":"불이란 어떤 물질이 어떤 기체와 결합하여 열과 빛을 내면서 타는 현상을 말한다. 이 기체는 무엇인가?","c":["질소","수소","산소","이산화탄소"],"a":2,"e":"물질이 산소와 결합하여 열과 빛을 내며 타는 화학반응을 연소, 즉 불이라고 한다."},{"q":"불꽃, 산소, 탈 수 있는 물건 이 세 가지가 만났을 때 불이 일어나는데, 이 세 가지를 통틀어 무엇이라고 부르는가?","c":["연소의 두 단계","화재의 네 가지 등급","소화의 원리","불의 세 가지 요소"],"a":3,"e":"불이 붙으려면 불꽃(점화원), 산소, 가연물(탈 수 있는 물건) 세 가지가 모두 필요하며, 이를 불의 3요소라 부른다."},{"q":"불의 세 가지 요소 중, '불꽃'을 가리키는 다른 말은 무엇인가?","c":["점화원","가연물","산화제","소화제"],"a":0,"e":"점화원은 물질에 불을 붙이는 열원으로, 불꽃, 스파크, 고온의 표면 등이 여기에 해당한다."},{"q":"불의 세 가지 요소 중, 공기 속에 있는 '이 기체'를 가리키는 요소는 무엇인가?","c":["질소","산소","이산화탄소","수소"],"a":1,"e":"산소는 공기 중 약 21%를 차지하는 기체로, 물질이 타는 데 반드시 필요하다."},{"q":"불의 세 가지 요소 중, 불에 탈 수 있는 물건을 가리키는 다른 말은 무엇인가?","c":["점화원","산화제","가연물(연료)","소화기"],"a":2,"e":"가연물은 나무, 종이, 기름처럼 산소와 반응해 스스로 탈 수 있는 물질을 말한다."},{"q":"캠핑장에서 나무장작처럼 불에 타는 물질을 무엇이라고 부르는가?","c":["점화원","소화물","매개물","가연물"],"a":3,"e":"장작처럼 불에 잘 타는 물질을 가연물이라고 하며, 불의 3요소 중 하나다."},{"q":"캠핑장에서 토치의 불꽃처럼 나무장작에 불을 붙이는 역할을 하는 것은 무엇인가?","c":["점화원","가연물","산소공급원","소화원"],"a":0,"e":"점화원은 가연물에 불을 붙여 연소를 시작시키는 열원으로, 토치 불꽃이나 라이터 불꽃이 대표적이다."},{"q":"캠핑장이 아니어도 공기 중에 항상 있어서, 가연물과 점화원만 있으면 불이 붙을 수 있게 해주는 기체는 무엇인가?","c":["질소","산소","수소","헬륨"],"a":1,"e":"공기 중에는 항상 산소가 있기 때문에, 가연물과 점화원만 만나면 언제 어디서든 불이 붙을 수 있다."},{"q":"불은 중요하지만 다루는 데 잠깐의 실수가 있으면 크게 번져 일어날 수 있는 것은 무엇인가?","c":["홍수","가뭄","화재","지진"],"a":2,"e":"불을 다루다가 통제를 벗어나 크게 번지면 사람과 재산에 큰 피해를 주는 화재가 된다."}] },
  "2": { label: "2. 화재의 원인", data: [{"q":"우리나라에서 가장 많이 일어나는 화재의 종류는 무엇인가?","c":["부주의로 인한 화재","방화","기계적 요인 화재","자연적 요인 화재"],"a":0,"e":"소방청 통계에 따르면 담뱃불이나 조리 중 부주의처럼 사람의 부주의로 인한 화재가 전체 화재 원인 중 가장 큰 비중을 차지한다."},{"q":"부주의로 인한 화재의 대표적인 원인으로, 아무 데나 버리면 안 되는 것은 무엇인가?","c":["음식물 쓰레기","담배꽁초","종이컵","나뭇가지"],"a":1,"e":"불이 완전히 꺼지지 않은 담배꽁초를 마른 풀이나 쓰레기 위에 버리면 큰 화재로 이어질 수 있다."},{"q":"냉장고, 전기난로 같은 가전제품에서 열이 나거나 전선에 문제가 생겨 발생하는 화재를 무엇이라 하는가?","c":["유류 화재","가스 화재","전기 화재","산불"],"a":2,"e":"전기 화재는 낡은 전선이나 과부하, 누전 등으로 인해 전기기구에서 열과 스파크가 발생하며 일어난다."},{"q":"화상을 입었을 때 가장 먼저 화상 부위에 해 주어야 하는 것은 무엇인가?","c":["알코올 소독","얼음 마사지","연고 바르기","흐르는 물"],"a":3,"e":"화상 부위를 즉시 흐르는 시원한 물로 식히면 열기가 피부 깊숙이 퍼지는 것을 막아 상처를 줄일 수 있다."},{"q":"감전된 사람을 발견했을 때, 가장 먼저 해야 할 중요한 행동은 무엇인가?","c":["전기 스위치(차단기) 차단","맨손으로 잡아당기기","물을 뿌리기","큰 소리로 웃기게 하기"],"a":0,"e":"감전된 사람을 구할 때는 먼저 전원을 차단해야 구조자까지 감전되는 2차 사고를 막을 수 있다."},{"q":"가스가 새어 나가 폭발이나 큰 불로 이어질 수 있는 화재를 무엇이라 하는가?","c":["전기 화재","가스 화재","유류 화재","산불"],"a":1,"e":"가스는 조금만 새어도 공기 중에 퍼져 작은 불씨에도 폭발적으로 타오르기 때문에 매우 위험하다."},{"q":"가스통 형태로 사용하는 액화석유가스를 줄여서 부르는 말은 무엇인가?","c":["LNG","CNG","LPG","PNG"],"a":2,"e":"LPG(액화석유가스)는 프로판과 부탄을 압축해 액체 상태로 만든 가스로, 가스통 형태로 배달해 사용한다."},{"q":"도시가스로 더 익숙한, 액화천연가스를 줄여서 부르는 말은 무엇인가?","c":["LPG","CNG","PNG","LNG"],"a":3,"e":"LNG(액화천연가스)는 배관을 통해 가정에 공급되는 도시가스의 주성분으로, 공기보다 가벼워 위로 퍼지는 특징이 있다."},{"q":"가스버너나 라이터의 1회용 충전 용기에 담아 쓰는 가스는 무엇인가?","c":["부탄가스","LNG","수소가스","산소가스"],"a":0,"e":"부탄가스는 휴대용 버너나 라이터에 사용되는 가스로, 화기 근처에 두면 폭발할 위험이 있어 조심해야 한다."},{"q":"액체로 된 기름 같은 가연물을 다루다가 부주의로 나는 화재를 무엇이라 하는가?","c":["가스 화재","유류 화재","전기 화재","산불"],"a":1,"e":"유류 화재는 기름이 물보다 가볍게 떠서 물로 끄면 오히려 불이 번지므로, 모래나 소화기로 꺼야 한다."},{"q":"라이터, 양초, 담뱃불, 폭죽 등을 가지고 놀다가 불이 나는 것을 무엇이라 하는가?","c":["방화","실화","불장난","누전"],"a":2,"e":"어린이나 청소년이 호기심으로 불씨를 가지고 놀다가 자기도 모르게 큰불로 번지게 하는 것을 불장난이라 한다."},{"q":"나쁜 마음을 먹고 일부러 불을 지르는 것을 무엇이라 하는가?","c":["실화","누전","불장난","방화"],"a":3,"e":"방화는 고의로 불을 지르는 범죄 행위로, 실제로 불을 지르지 않고 준비만 해도 법에 따라 처벌받을 수 있다."},{"q":"나무와 풀이 많은 산에서 나는 큰불을 무엇이라 하는가?","c":["산불","들불","화전","야산 화재"],"a":0,"e":"산불은 마른 나뭇잎과 풀이 많아 불이 빠르게 번지고 진화가 어려워 큰 피해를 남긴다."},{"q":"부주의만 조심해도 화재를 어느 정도까지 줄일 수 있다고 하는가?","c":["10%","50%","80%","5%"],"a":1,"e":"화재 통계에서 부주의가 원인의 절반 가까이를 차지하기 때문에, 조금만 주의를 기울여도 화재의 약 50%를 예방할 수 있다."},{"q":"안전 장치 없이 이 작업을 하다가 불이 나는 경우가 있다. 무엇일까?","c":["페인트칠","청소","용접 작업","배달"],"a":2,"e":"용접 작업에서 튀는 불꽃이 주변의 가연물에 옮겨붙으면 화재로 이어질 수 있어, 반드시 안전 장치와 소화기를 준비해야 한다."},{"q":"음식을 조리하다가 어떻게 하면 화재가 자주 발생하는가?","c":["불의 세기를 조절하면","문을 열어두면","냄비 뚜껑을 덮으면","자리를 비우면"],"a":3,"e":"조리 중 자리를 비우면 음식이 타면서 불이 나는 것을 바로 발견하지 못해 화재로 번지기 쉽다."},{"q":"전선이나 전기기구에서 전기가 새는 현상을 무엇이라 하는가?","c":["누전","과부하","정전","단전"],"a":0,"e":"누전은 절연이 낡거나 손상되어 전기가 정상 경로가 아닌 곳으로 흐르는 현상으로, 화재나 감전을 일으킬 수 있다."},{"q":"하나의 콘센트에 여러 전기기구를 꽂아 적정 용량을 초과하는 것을 무엇이라 하는가?","c":["누전","과부하","방전","절전"],"a":1,"e":"과부하가 걸리면 전선에 지나치게 많은 전류가 흘러 전선이 뜨거워지고 화재로 이어질 수 있다."},{"q":"가스 냄새가 나면 가장 먼저 열어서 환기시켜야 하는 것은 무엇인가?","c":["냉장고 문","가스레인지 뚜껑","창문(문)","신발장"],"a":2,"e":"가스가 샜을 때는 스위치를 만지지 말고 먼저 창문과 문을 열어 가스를 밖으로 빼내야 폭발 위험을 줄일 수 있다."},{"q":"가스를 사용하기 전, 가스가 새는 곳이 없는지 어떻게 확인하는가?","c":["손으로 만져서 확인","성냥불로 확인","소리를 들어서 확인","냄새를 맡아 확인"],"a":3,"e":"가스에는 일부러 냄새 나는 물질을 섞어 놓아서, 냄새로 가스가 새는지 쉽게 확인할 수 있게 되어 있다."},{"q":"가스레인지로 불을 켰을 때, 정상적으로 타고 있다는 뜻의 불꽃 색깔은 무엇인가?","c":["파란 불꽃","노란 불꽃","붉은 불꽃","흰 불꽃"],"a":0,"e":"가스가 완전히 연소되면 파란 불꽃이 나오고, 불완전 연소되면 노란색이나 붉은색 불꽃이 나타나 위험 신호가 된다."},{"q":"유류 화재가 위험한 이유로, 불이 번지는 속도는 어떠한가?","c":["매우 느림","매우 빠름","일정함","예측 불가능"],"a":1,"e":"기름은 불이 붙으면 순식간에 넓게 번지기 때문에 유류 화재는 진화가 매우 어렵고 위험하다."},{"q":"난로나 버너를 사용하는 중에는 어떤 작업을 하면 안 되는가?","c":["문을 여는 것","불을 끄는 것","기름을 넣거나 옮기는 것","창문을 닫는 것"],"a":2,"e":"불이 켜진 상태에서 기름을 넣으면 불씨가 옮겨붙어 순식간에 큰불로 번질 수 있다."},{"q":"불장난은 주로 몇 살 정도의 어린이들이 많이 일으키는가?","c":["10~13세","14~16세","8~9세","3~7세"],"a":3,"e":"3~7세 어린이는 호기심은 많지만 불의 위험성을 잘 모르기 때문에 불장난으로 인한 화재 사고가 자주 발생한다."},{"q":"산불의 원인 중 가장 많은 경우로, 논이나 밭의 이것을 태우다가 불이 옮겨붙는 경우가 있다. 무엇일까?","c":["밭두렁(논두렁)","낙엽 더미","건초더미","비닐하우스"],"a":0,"e":"봄철 농사 준비를 위해 논두렁이나 밭두렁을 태우다가 바람을 타고 불씨가 산으로 옮겨붙어 산불이 나는 경우가 가장 많다."},{"q":"낡은 전기용품을 쓰면 누전과 함께 쉽게 생겨 불이 날 위험을 키우는 현상은 무엇인가?","c":["정전","과열","절전","방전"],"a":1,"e":"오래된 전기용품은 부품이 낡아 전류가 흐를 때 열이 비정상적으로 많이 발생하는 과열 현상이 일어나기 쉽다."},{"q":"천둥·번개가 칠 때, 번개가 무엇을 타고 들어와 불을 내기도 하는가?","c":["빗물","나무뿌리","전깃줄(전선)","지붕 기와"],"a":2,"e":"번개는 강한 전류를 가지고 있어 전깃줄을 타고 건물 안으로 흘러들어와 화재나 정전을 일으킬 수 있다."},{"q":"전기난로나 다리미처럼 열을 내는 기기 근처에는 어떤 물건들을 치워야 하는가?","c":["금속 물건","유리 물건","도자기 물건","탈 수 있는 물건"],"a":3,"e":"이불이나 옷, 종이처럼 잘 타는 물건이 열기구 가까이 있으면 온도가 올라가면서 불이 붙을 수 있다."},{"q":"사용이 끝난 전자제품은 스위치만 끄지 말고 무엇까지 뽑아야 안전한가?","c":["플러그","배터리","안테나","리모컨"],"a":0,"e":"스위치를 꺼도 플러그가 꽂혀 있으면 전류가 계속 흐를 수 있으므로, 완전히 안전하려면 플러그를 뽑아야 한다."},{"q":"플러그를 뽑을 때 절대 어떤 손으로 만지면 안 되는가?","c":["마른 손","젖은 손","장갑 낀 손","왼손"],"a":1,"e":"물은 전기가 잘 통하기 때문에 젖은 손으로 플러그를 만지면 감전될 위험이 크게 높아진다."},{"q":"가스가 새는 것을 점검할 때, 연결 부위에 발라서 거품이 생기는지 확인하는 것은 무엇인가?","c":["식용유","소금물","비눗물","알코올"],"a":2,"e":"연결 부위에 비눗물을 바르면 가스가 새는 곳에서 거품이 보글보글 올라와 누출 여부를 쉽게 확인할 수 있다."},{"q":"LPG 용기를 안전하게 보관하는 장소는 통풍이 잘 되고 어떤 곳에 받침대를 놓고 두어야 하는가?","c":["햇볕이 강한 곳","실내 창고","부엌 안","그늘진 곳"],"a":3,"e":"LPG 용기는 온도가 높아지면 내부 압력이 올라가 위험하므로, 직사광선을 피한 그늘진 곳에 세워서 보관해야 한다."},{"q":"유류 화재는 물로 끄면 안 되는데, 대신 무엇으로 덮어 산소를 차단하는가?","c":["모래","신문지","얼음","소금"],"a":0,"e":"기름은 물보다 가벼워 물 위에 뜨기 때문에 물을 뿌리면 불이 오히려 번지므로, 모래를 덮어 산소 공급을 막아 꺼야 한다."},{"q":"부탄가스나 프로판 가스는 공기보다 무거워서, 새어 나왔을 때 어떤 도구로 쓸어내야 하는가?","c":["선풍기","빗자루(방석)로 쓸어내기","물걸레","청소기"],"a":1,"e":"이런 가스들은 공기보다 무거워 바닥에 가라앉으므로, 빗자루나 방석 등으로 바닥 쪽 가스를 밖으로 쓸어내야 한다."},{"q":"산불이 잘 나는 습도 기준으로, 이 수치 이하이면 산불이 급속히 번질 위험이 있다. 몇 %일까?","c":["70%","60%","40%","20%"],"a":2,"e":"습도가 40% 이하로 떨어지면 나뭇잎과 풀이 바짝 마르면서 작은 불씨에도 빠르게 불이 붙고 번진다."},{"q":"산불이 봄철에 특히 많이 나는 이유로, 봄철 습도가 이 수치 미만인 날이 많기 때문이다. 몇 %일까?","c":["80%","70%","60%","50%"],"a":3,"e":"봄철에는 건조한 날씨로 습도가 50% 미만인 날이 많아, 산의 낙엽과 나무가 잘 말라 산불이 나기 쉬운 환경이 된다."},{"q":"우리나라 산불 발생 건수 중 봄철에 발생하는 비율은 얼마인가?","c":["약 60%","약 30%","약 80%","약 10%"],"a":0,"e":"봄철은 건조하고 바람이 강해, 우리나라 전체 산불의 약 60%가 이 시기에 집중적으로 발생한다."},{"q":"콘센트나 플러그, 배선 주위에 쌓인 무엇을 정기적으로 청소해야 스파크가 튀어도 불이 붙지 않는가?","c":["물기","먼지","곰팡이","벌레"],"a":1,"e":"콘센트 주변에 먼지가 쌓이면 습기와 만나 전기가 흐르면서 불꽃(스파크)이 튀어 화재로 이어지는 트래킹 현상이 일어날 수 있다."},{"q":"전기제품을 살 때 안전을 확인할 수 있는, 제품에 표시된 인증마크는 무엇인가?","c":["유기농 인증마크","에너지스타 마크","KC 인증마크","재활용 마크"],"a":2,"e":"KC 인증마크는 국가에서 안전성을 검사하고 인정한 제품에 붙이는 마크로, 전기제품 구매 시 반드시 확인해야 한다."},{"q":"누전으로 인한 화재를 막기 위해 매달 정기적으로 점검해야 하는 안전장치는 무엇인가?","c":["소화기","화재감지기","스프링클러","누전차단기"],"a":3,"e":"누전차단기는 전기가 새는 것을 감지하면 자동으로 전원을 차단해 화재와 감전 사고를 막아주는 장치로, 정기적으로 시험 버튼을 눌러 작동 여부를 점검해야 한다."},{"q":"감전된 사람을 구할 때, 맨손 대신 사용해야 하는 전기가 잘 통하지 않는 도구는 무엇인가?","c":["고무장갑(나무막대)와 같은 도구","젖은 수건","금속 막대","철사"],"a":0,"e":"고무나 나무는 전기가 잘 통하지 않는 부도체이기 때문에, 이런 도구를 이용하면 구조자가 감전되지 않고 안전하게 구할 수 있다."},{"q":"방화를 실제로 하지 않고 준비만 하거나 도와준 사람도 어떻게 될 수 있는가?","c":["훈방 조치","법에 따라 처벌","벌금 없이 경고","사회봉사만"],"a":1,"e":"방화는 예비·음모·방조 단계만으로도 처벌 대상이 될 만큼 무겁게 다뤄지는 범죄다."},{"q":"방화의 동기 중, 청소년이 다른 사람의 관심을 받기 위해 저지르기도 하는 대상은 무엇인가?","c":["공중전화 부스","우체통","주차된 자동차","가로수"],"a":2,"e":"일부 청소년 방화는 관심을 끌거나 스트레스를 풀기 위한 목적으로 주차된 자동차 등에 불을 지르는 형태로 나타난다."},{"q":"산불의 확산 속도와 방향에 영향을 주는 세 가지 조건 중, 연료·지형과 함께 나머지 하나는 무엇인가?","c":["강수량","계절","고도","기상 조건"],"a":3,"e":"바람의 세기와 방향, 습도 같은 기상 조건은 산불이 얼마나 빠르게, 어느 방향으로 번질지를 크게 좌우한다."},{"q":"화기를 취급하는 학교 실험실이나 기름 취급 장소에 반드시 배치해 두어야 하는 것은 무엇인가?","c":["소화기","선풍기","가습기","정수기"],"a":0,"e":"실험실이나 기름을 다루는 장소는 화재 위험이 높기 때문에 초기 진화를 위한 소화기를 반드시 비치해야 한다."},{"q":"밀폐된 공간에서 기름을 사용한 뒤 바닥에 깔려 나중에 화재를 일으킬 수 있는 것은 무엇인가?","c":["매연","유증기","습기","먼지"],"a":1,"e":"유증기는 기름이 증발하며 만들어지는 기체로, 밀폐된 공간에 가라앉아 있다가 작은 불씨만 닿아도 폭발적으로 불이 붙을 수 있다."},{"q":"가스가 샐 때 전기기구의 스위치를 켜거나 끄면 안 되는 이유가 되는 현상은 무엇인가?","c":["정전기 방지","소음 발생","전기불꽃(스파크) 발생","열 손실"],"a":2,"e":"스위치를 켜고 끄는 순간 작은 전기불꽃(스파크)이 튀는데, 이 불꽃이 새어 나온 가스에 닿으면 폭발할 수 있다."},{"q":"가스가 새는 것을 발견했을 때, 어린이가 해야 할 가장 안전한 행동은 무엇인가?","c":["혼자 밸브 잠그기","스위치로 환풍기 켜기","라이터로 확인하기","어른에게 알리기"],"a":3,"e":"어린이가 직접 가스를 조작하는 것은 위험하므로, 즉시 안전한 곳으로 이동해 어른에게 알리는 것이 가장 안전하다."}] },
  "3": { label: "3. 화재 대처 요령", data: [{"q":"불을 발견하면 가장 먼저 큰 소리로 무엇이라고 외쳐야 하는가?","c":["불이야","도와주세요","살려주세요","조심하세요"],"a":0,"e":"\"불이야!\"라고 크게 외치면 주변 사람들에게 위험을 빠르게 알리고 함께 대피하거나 초기 진화를 도울 수 있다."},{"q":"화재 신고를 할 때 누르는 전화번호는 무엇인가?","c":["112","119","122","110"],"a":1,"e":"119는 화재, 구급, 구조 등 각종 재난을 신고할 수 있는 소방 신고 전화번호다."},{"q":"불이 났을 때 절대 타면 안 되는, 정전되면 갇힐 위험이 있는 이동 수단은 무엇인가?","c":["계단","비상구","엘리베이터","완강기"],"a":2,"e":"화재 시 정전이 되면 엘리베이터 안에 갇히거나 연기가 유입될 수 있어 매우 위험하므로, 반드시 계단을 이용해야 한다."},{"q":"옷에 불이 붙었을 때 지켜야 할 3단계 행동요령을 영어로 무엇이라 부르는가?","c":["런-스탑-콜","드롭-런-콜","스탑-런-롤","스탑-드롭-롤"],"a":3,"e":"스탑(멈추기)-드롭(엎드리기)-롤(구르기)은 옷에 붙은 불을 몸을 굴려서 산소를 차단해 끄는 국제 표준 행동요령이다."},{"q":"연기를 마시지 않도록 코와 입을 막을 때, 수건을 어떻게 해서 사용하는가?","c":["물에 적셔서","불에 그을려서","마른 채로","두 겹으로 접어"],"a":0,"e":"물에 적신 수건으로 코와 입을 막으면 유해가스와 연기 입자를 어느 정도 걸러내 호흡기를 보호할 수 있다."},{"q":"대피할 때 몸을 어떻게 하고 이동해야 연기를 덜 마시는가?","c":["똑바로 서서","자세를 낮추어","두 팔을 벌려","눈을 감고"],"a":1,"e":"뜨거운 연기는 위로 떠오르기 때문에, 자세를 낮춰 바닥 가까이에서 이동하면 상대적으로 맑은 공기를 마실 수 있다."},{"q":"119에 장난 전화를 하면 법에 의해 어떻게 될 수 있는가?","c":["상장을 받음","칭찬을 받음","처벌(벌)을 받음","아무 일도 없음"],"a":2,"e":"허위 신고는 소방력 낭비와 실제 화재 신고의 지연으로 이어질 수 있어 법으로 처벌받는 행위다."},{"q":"큰 건물이라 목소리가 잘 안 들릴 때, 화재를 알리기 위해 두드리거나 눌러야 하는 것은 무엇인가?","c":["초인종","인터폰","안내방송","비상벨"],"a":3,"e":"비상벨(발신기)을 누르면 건물 전체에 화재 경보가 울려 사람들에게 신속하게 위험을 알릴 수 있다."},{"q":"방 안에 갇혔을 때, 창문 밖으로 흔들어서 자신의 위치를 알리는 물건은 무엇인가?","c":["손수건(옷가지)","신발","책","우산"],"a":0,"e":"밝은 색의 손수건이나 옷을 창밖으로 흔들면 구조대가 갇힌 사람의 위치를 빠르게 발견할 수 있다."},{"q":"소화기 없이 프라이팬의 작은 불꽃을 줄일 때, 뚜껑을 덮거나 무엇을 한꺼번에 많이 넣어 불꽃을 줄이는가?","c":["식용유","채소(야채)","물","밀가루"],"a":1,"e":"채소를 한꺼번에 많이 넣으면 온도가 낮아지고 산소 공급이 줄어들어 불꽃을 진정시키는 데 도움이 된다."},{"q":"대피할 때 문을 열고 나온 뒤, 불과 연기가 번지지 않도록 반드시 해야 하는 행동은 무엇인가?","c":["불 끄기","창문 열기","문 닫기","소리치기"],"a":2,"e":"문을 닫아두면 산소 공급이 줄어들고 불과 연기가 다른 공간으로 번지는 속도를 늦출 수 있다."},{"q":"다른 곳에서 불이 났을 때, 대피해도 되는지 확인하려면 문이나 손잡이를 만져 무엇을 확인하는가?","c":["색깔","냄새","소리","뜨거운지(온도)"],"a":3,"e":"문손잡이가 뜨겁다면 문 반대편에 불이 있다는 신호이므로 문을 열지 말고 다른 대피로를 찾아야 한다."},{"q":"문틈으로 연기가 새어 들어올 때, 물에 적신 무엇으로 틈을 막는가?","c":["담요(시트·수건)","신문지","비닐봉지","종이테이프"],"a":0,"e":"물에 적신 담요나 수건으로 문틈을 막으면 유독 연기가 방 안으로 들어오는 것을 어느 정도 막을 수 있다."},{"q":"옷에 불이 붙었을 때 스탑-드롭-롤 중 첫 번째로 해야 하는 행동은 무엇인가?","c":["구르기","멈추기(자리에 서기)","뛰어다니기","물 찾기"],"a":1,"e":"불이 붙은 채로 뛰어다니면 바람 때문에 불이 더 커지므로, 먼저 그 자리에 멈춰 서야 한다."},{"q":"119에 신고하기 전, 가장 먼저 확보해야 하는 것은 무엇인가?","c":["핸드폰 배터리","목격자 진술","자신의 안전","정확한 시간"],"a":2,"e":"자신이 위험한 상황에 있으면 신고는커녕 스스로 다칠 수 있으므로, 먼저 안전한 곳으로 피한 뒤 신고해야 한다."},{"q":"기름을 쓰는 난로 등에 불이 났을 때 물을 쓰면 안 되는 이유는 무엇인가? 기름이 물 위에 이렇게 되기 때문이다.","c":["가라앉는다","증발한다","섞인다","뜬다(떠오른다)"],"a":3,"e":"기름은 물보다 가벼워서 물 위에 뜨기 때문에, 물을 뿌리면 불붙은 기름이 사방으로 퍼져 오히려 불이 커진다."},{"q":"전기 화재에 물을 사용하면 안 되는 이유가 되는 위험은 무엇인가?","c":["감전","폭발","화상 확대","유독가스"],"a":0,"e":"물은 전기를 잘 통하게 하므로, 전기 화재에 물을 뿌리면 전류가 물을 타고 흘러 감전 사고가 날 수 있다."},{"q":"튀김 요리 중 불이 붙었을 때, 소화기 대신 사용할 수 있는 도구는 무엇인가?","c":["젖은 행주","냄비 뚜껑","국자","나무젓가락"],"a":1,"e":"냄비 뚜껑으로 불붙은 냄비를 덮으면 산소 공급이 차단되어 불이 저절로 꺼진다."},{"q":"튀김 요리 불을 뚜껑으로 덮은 뒤, 뚜껑을 열기 전에 기다려야 하는 상태는 무엇인가?","c":["연기가 날 때","5초가 지난 뒤","기름이 식은 뒤","소리가 멈춘 즉시"],"a":2,"e":"뚜껑을 너무 빨리 열면 남은 열기로 다시 불이 붙을 수 있으므로, 기름이 충분히 식을 때까지 기다려야 한다."},{"q":"화재 시 문이나 문손잡이가 뜨거울 때 절대 하면 안 되는 행동은 무엇인가?","c":["다른 통로 찾기","119에 신고하기","큰 소리로 알리기","문을 열기"],"a":3,"e":"뜨거운 문 반대편에는 불이 있을 가능성이 높아, 문을 여는 순간 화염과 연기가 한꺼번에 밀려들어올 수 있다."},{"q":"연기는 위로, 찬 공기는 바닥에 있기 때문에, 연기가 들어왔을 때 취해야 하는 자세는 무엇인가?","c":["바닥에 엎드리기","창문 옆에 서기","벽에 기대기","두 팔을 들기"],"a":0,"e":"연기는 뜨거운 공기와 함께 위로 떠오르므로, 바닥에 엎드리거나 낮은 자세로 이동하면 유독가스를 덜 마실 수 있다."},{"q":"119에 신고할 때, 소방관이 쉽게 찾을 수 있도록 주소와 함께 말하면 좋은 정보는 무엇인가?","c":["날씨","가까운 큰 건물 이름","가족 이름","학교 이름"],"a":1,"e":"정확한 주소를 모르더라도 근처의 눈에 띄는 큰 건물 이름을 알려주면 소방관이 위치를 훨씬 빨리 찾을 수 있다."},{"q":"옷에 불이 붙었을 때 스탑-드롭-롤의 마지막 단계로, 손으로 얼굴을 가리고 하는 행동은 무엇인가?","c":["제자리 뛰기","바람 등지기","좌우로 구르기","양팔 흔들기"],"a":2,"e":"바닥에 엎드려 좌우로 구르면 몸과 바닥 사이에서 산소 공급이 차단되어 불이 꺼진다."},{"q":"쓰레기더미에서 불이 났을 때, 쓰레기를 없애 무엇을 제거하는 소화 방법을 쓰는가?","c":["산소 제거","점화원 제거","열 제거","가연물 제거"],"a":3,"e":"탈 물질(쓰레기) 자체를 치우는 것은 불의 3요소 중 가연물을 없애는 소화 방법이다."},{"q":"모래나 담요를 덮어 불을 끄는 것은, 불의 세 가지 요소 중 무엇을 차단하는 원리인가?","c":["산소","점화원","가연물","열"],"a":0,"e":"모래나 담요로 불을 덮으면 공기(산소)의 공급이 끊겨 불이 저절로 꺼지는데, 이를 질식소화라고 한다."},{"q":"119 장난 전화를 자주 하면, 나중에 진짜 신고를 믿지 못하게 된다는 것을 비유한 이야기 속 인물은 누구인가?","c":["신데렐라","양치기 소년","흥부","백설공주"],"a":1,"e":"거짓말을 반복하면 진짜 위급한 순간에 아무도 도와주지 않게 된다는 양치기 소년 이야기처럼, 허위 신고는 실제 화재 대응을 늦출 수 있다."},{"q":"화재 대피 시, 어른들이 먼저 나갈 수 있도록 배려해야 하는 대상은 누구인가?","c":["가장 힘이 센 사람","소방관","어린이·노약자·환자","대피를 지휘하는 사람"],"a":2,"e":"스스로 대피하기 어려운 어린이, 노약자, 환자를 먼저 배려해 안전하게 대피시키는 것이 화재 대피의 기본 원칙이다."},{"q":"119 신고 시, 주소·건물 이름과 함께 알고 있다면 말해야 하는 정보는 무엇인가?","c":["신고자의 나이","날짜","화재 목격 시간","불이 난 원인"],"a":3,"e":"화재 원인을 알고 있다면 함께 알려주면 소방관이 상황을 파악하고 적절한 장비로 신속하게 대응하는 데 도움이 된다."}] },
  "4": { label: "4. 화상·심폐소생술·압사사고", data: [{"q":"심장이 멎은 사람에게 실시하는 응급처치법의 이름은 무엇인가?","c":["심폐소생술","하임리히법","인공호흡법","응급수혈법"],"a":0,"e":"심폐소생술(CPR)은 멎은 심장을 대신해 가슴압박과 인공호흡으로 혈액을 순환시키는 응급처치법이다."},{"q":"심폐소생술을 연습할 때 사용하는, 팔다리가 없는 실습용 도구는?","c":["구급상자","마네킹","들것","산소통"],"a":1,"e":"심폐소생술 실습용 마네킹은 가슴 부위만으로도 압박 깊이와 위치를 연습할 수 있도록 만들어져 있다."},{"q":"심정지가 발생했을 때, 몇 분 이내에 조치하지 않으면 뇌손상이 시작되는가?","c":["1~2분","10분","4~5분","30분"],"a":2,"e":"뇌는 산소 공급이 끊기면 4~5분 만에 손상되기 시작하므로, 심정지 초기 대응이 매우 중요하다."},{"q":"심장에 자동으로 전기 충격을 주어 불규칙한 심장 리듬을 되돌리는 기계는?","c":["산소호흡기","혈압측정기","체온계","자동심장충격기(AED)"],"a":3,"e":"자동심장충격기(AED)는 심전도를 분석해 필요한 경우 전기 충격을 주어 심장이 정상 리듬을 되찾도록 돕는다."},{"q":"뜨거운 물체나 액체에 데었을 때 생기는 상처를 무엇이라 하는가?","c":["화상","동상","찰과상","골절"],"a":0,"e":"화상은 높은 온도, 화학물질, 전기 등으로 피부나 조직이 손상되는 상처를 말한다."},{"q":"화상을 입었을 때 가장 먼저 상처 부위에 해야 할 응급처치는?","c":["연고 바르기","찬물로 식히기","붕대 감기","얼음 문지르기"],"a":1,"e":"화상 직후에는 흐르는 찬물로 상처 부위를 식혀 열이 더 깊이 퍼지는 것을 막아야 한다."},{"q":"표피만 손상되어 흉터 없이 낫는 가장 가벼운 화상 단계는?","c":["2도 화상","3도 화상","1도 화상","4도 화상"],"a":2,"e":"1도 화상은 피부 표면인 표피만 손상되어 붉어지고 따가운 정도이며 대부분 흉터 없이 낫는다."},{"q":"많은 사람이 좁은 공간에 몰려 서로 눌리면서 발생하는 사고를 무엇이라 하는가?","c":["교통사고","낙상 사고","감전 사고","압사 사고"],"a":3,"e":"압사 사고는 좁은 공간에 인파가 몰려 신체가 눌리면서 호흡 곤란이나 골절 등의 피해가 발생하는 사고이다."},{"q":"압사 사고를 예방하기 위해 사람이 많이 몰릴 것으로 예상되는 곳에서는 어떻게 하는 것이 좋은가?","c":["방문을 자제한다","최대한 빨리 이동한다","가운데로 들어간다","친구와 흩어진다"],"a":0,"e":"인파가 몰릴 것으로 예상되는 장소는 가급적 방문을 자제하는 것이 압사 사고를 예방하는 가장 좋은 방법이다."},{"q":"압사 사고 위험이 특히 큰 대표적인 장소로 알맞은 것은?","c":["한적한 공원","사람이 몰리는 축제나 지하철","학교 운동장","넓은 주차장"],"a":1,"e":"많은 인원이 한꺼번에 몰리는 축제 현장이나 지하철, 대중교통 환승 구간 등은 압사 사고 위험이 특히 큰 장소이다."},{"q":"심폐소생술의 첫 번째 단계로, 환자의 양쪽 어깨를 두드리며 확인해야 하는 것은?","c":["호흡 여부","맥박 수","반응(의식) 확인","체온"],"a":2,"e":"심폐소생술을 시작하기 전, 먼저 환자의 어깨를 두드리며 큰 소리로 불러 의식이 있는지부터 확인해야 한다."},{"q":"심폐소생술의 두 번째 단계에서 119 신고와 함께 요청해야 하는 장비는?","c":["산소마스크","들것","구급상자","자동심장충격기"],"a":3,"e":"의식이 없음을 확인하면 즉시 119에 신고하면서 동시에 자동심장충격기(AED)를 가져다 달라고 요청해야 한다."},{"q":"주변 사람에게 119 신고를 부탁할 때, 확실하게 도움을 받으려면 어떻게 요청해야 하는가?","c":["한 사람을 콕 집어 지목한다","여러 명에게 동시에 외친다","가장 가까운 어른에게만 속삭인다","전체에게 조용히 알린다"],"a":0,"e":"막연히 여러 사람에게 외치면 서로 미루게 되므로, 옷차림 등을 짚어 한 사람을 정확히 지목해 신고를 부탁해야 확실히 도움을 받을 수 있다."},{"q":"심폐소생술 세 번째 단계에서, 환자의 호흡 여부는 몇 초 이내로 확인해야 하는가?","c":["5초","10초","20초","30초"],"a":1,"e":"호흡 확인은 10초 이내로 신속하게 이루어져야 하며, 너무 오래 지체하면 가슴압박 시작이 늦어질 수 있다."},{"q":"최초 목격자가 즉시 심폐소생술을 시작하면 환자의 생존 확률은 어떻게 되는가?","c":["거의 변화 없다","절반으로 줄어든다","3배 이상 늘어난다","10배 줄어든다"],"a":2,"e":"심정지 환자를 처음 발견한 사람이 곧바로 심폐소생술을 시작하면, 그렇지 않은 경우보다 생존 확률이 3배 이상 높아진다."},{"q":"크지 않은 화상 부위를 찬물에 담가 식힐 때 적당한 시간은?","c":["1~2분","1시간 이상","하루 종일","10~15분"],"a":3,"e":"넓지 않은 화상은 흐르는 찬물에 10~15분 정도 식혀주면 열기를 충분히 가라앉힐 수 있다."},{"q":"화상 부위에 물을 너무 세게 틀어서는 안 되는 이유는 무엇인가?","c":["약해진 피부에 추가 손상을 줄 수 있어서","물이 아까워서","물이 뜨거워질 수 있어서","흉터가 빨리 없어져서"],"a":0,"e":"화상으로 약해진 피부에 강한 물줄기를 대면 오히려 피부 조직이 추가로 손상될 수 있으므로 약하게 흐르는 물로 식혀야 한다."},{"q":"화상 부위를 얼음으로 직접 문지르면 안 되는 이유와 관련된 신체 작용은?","c":["소화 작용","혈액순환 방해","호흡 작용","체온 상승"],"a":1,"e":"얼음을 직접 문지르면 혈관이 급격히 수축되어 혈액순환을 방해하고, 오히려 조직 손상을 일으킬 수 있다."},{"q":"진피까지 손상되어 물집이 생기고 매우 아픈, 전문의 치료가 필요한 화상 단계는?","c":["1도 화상","3도 화상","2도 화상","경미한 찰과상"],"a":2,"e":"2도 화상은 표피 아래 진피까지 손상되어 물집이 생기고 통증이 심하며, 감염 위험이 있어 전문의 진료가 필요하다."},{"q":"사람이 많이 모이는 곳에 갈 때, 헤어질 경우를 대비해 미리 정해두어야 하는 것은?","c":["입장 순서","좋아하는 자리","입고 갈 옷","만날 장소와 연락 방법"],"a":3,"e":"인파 속에서 일행과 떨어질 수 있으므로, 미리 만날 장소와 연락 방법을 정해두면 서로를 빠르게 찾을 수 있다."},{"q":"주변에 사람이 갑자기 많아지기 시작하면 어떻게 행동해야 하는가?","c":["넓은 공간으로 신속하게 이동한다","제자리에 멈춰 선다","사람들 사이로 비집고 들어간다","앉아서 기다린다"],"a":0,"e":"인파가 갑자기 몰리기 시작하면 압사 위험이 커지므로, 좁은 곳을 벗어나 넓은 공간으로 신속하게 이동해야 한다."},{"q":"인파가 몰린 곳에서 앞서가려고 절대 하면 안 되는 행동은?","c":["천천히 걷기","뛰기","줄을 서기","기다리기"],"a":1,"e":"복잡한 인파 속에서 뛰면 넘어지거나 다른 사람을 밀치게 되어 압사 사고로 이어질 수 있으므로 절대 뛰어서는 안 된다."},{"q":"인파 속에서 이동할 때 앞사람에게 절대 해서는 안 되는 행동은?","c":["말 걸기","비켜주기","밀기","기다리기"],"a":2,"e":"인파 속에서 앞사람을 밀면 연쇄적으로 사람들이 넘어져 대형 압사 사고로 번질 수 있으므로 절대 밀어서는 안 된다."},{"q":"가슴압박을 할 때 두 손은 어떻게 하여 손바닥으로 압박해야 하는가?","c":["각각 따로 놓는다","주먹을 쥔다","손가락 끝으로 누른다","깍지를 낀다"],"a":3,"e":"가슴압박은 한 손 위에 다른 손을 겹쳐 깍지를 낀 뒤, 손바닥 뒤꿈치로 체중을 실어 압박해야 힘이 효과적으로 전달된다."},{"q":"성인 심폐소생술에서 가슴압박의 깊
